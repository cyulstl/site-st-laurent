<!-- Équipes 5-4 — élément « Intégrer du HTML » de Wix. Remplace l'intégration Google Sheets (trop lente).
     S'affiche tout de suite avec une copie des équipes, puis se met à jour avec l'onglet « Cycles 5-4 »
     du fichier Horaire (par le script « Horaire Wix », même lien que l'horaire).
     Montre le cycle de 9 jours en cours (aujourd'hui en bleu), avec flèches pour les cycles d'avant et d'après.
     Hauteur conseillée de l'élément Wix : 650 px (ordinateur), 880 px (téléphone). -->

     (window.EN_PAGE, just below this block) and replaced. {x} in a list entry = a part that changes (number, initials,
     date…), carried over to the English: {ini…} = initials only, {n…} = a number only, any other name = any text. Dates use LOC() ('fr-CA' / 'en-CA'). The choice is kept on the device;

<script>

    ['Contrôleurs', 'Controllers'], ['Superviseurs', 'Supervisors'], ['Contrôleur', 'Controller'], ['Superviseur', 'Supervisor'],
  ];
  var esc = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };

    'oct.': 'Oct', 'nov.': 'Nov', 'déc.': 'Dec', janvier: 'January', 'février': 'February', avril: 'April', juillet: 'July',
    septembre: 'September', octobre: 'October', novembre: 'November', 'décembre': 'December' };
  var dateRe = new RegExp('(^|[^0-9A-Za-zÀ-ÿ_.])(' + Object.keys(DATES).sort(function (a, b) { return b.length - a.length; }).map(esc).join('|') +
    ')(?=$|[^0-9A-Za-zÀ-ÿ_])', 'g');
  function part(v, n) {                 // one changing part: its own translation, else each « ; » item, else dates only
    if (n >= 3) return v;
    var t = trad(v, n + 1);
    if (t != null) return t;
    if (v.indexOf(' ; ') > 0) return v.split(' ; ').map(function (x) { return part(x, n); }).join('; ');

  function trad(s, n) {
    if (!exact || nLu !== (window.EN_PAGE || []).length) compiler();
    var k = norm(s);
    if (k === ':' && /^\s/.test(s)) return ':' + /\s*$/.exec(s)[0];      // « Mise à jour : » → « Update: »
    if (!k || !/[A-Za-zÀ-ÿ]/.test(k)) return null;
    var r;
    if (!n && memo.has(k)) r = memo.get(k);
    else {
      r = exact.get(k);
      if (r === undefined) for (var i = 0; i < pats.length; i++) {
        var p = pats[i], m = p.re.exec(k);

        });
        break;
      }
      if (r === undefined && phrRe && /[a-zà-ÿ]/.test(k)) {

        if (chg) r = t2;
      }

      if (!n) memo.set(k, r);

<script>
const CONFIG = {
  url: 'https://script.google.com/macros/s/AKfycbzlun0DaIaOlLTwCVXApc4tv6pAecIiLJsfTHMK8mpsCSw0njNe87POvAsIJCePo1Ot/exec',
  avis: { minMois: 1, maxMois: 12, sansFinMois: 3 },   // « congé à venir » : annoncé aussi longtemps d'avance qu'il dure
                            // (6 mois de congé = 6 mois d'avance), au moins minMois, au plus maxMois ; sans date de fin : sansFinMois
};
// « congé à venir » is announced as long before it starts as it lasts (a 6-month leave shows 6 months ahead),
// at least CONFIG.avis.minMois, at most maxMois; a leave with no end date: sansFinMois.
function congeAnnonce(debut, fin) {
  if (!debut) return true;
  const n = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5;
  const x = new Date(), auj = Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()) / 864e5;
  const M = 30.44, A = CONFIG.avis;
  const avis = fin ? Math.min(A.maxMois * M, Math.max(A.minMois * M, n(fin) - n(debut) + 1)) : A.sansFinMois * M;
  return n(debut) - auj <= avis;
}

  ['KC',7,0,0],['LH',5,0,0],['LO',4,0,1],['NV',7,0,0],['OJ',1,0,0],['SF',3,0,0],['UK',6,0,0],['WY',6,0,0],
  ['XV',8,1,0],['YH',3,0,0],['YM',7,0,0],['ZA',3,0,0],['ZU',2,0,0],['ZZ',1,0,0],['OF',1,0,1],
], conges: [['LO', '2026-12-21', '', 'Congé prolongé'], ['OF', '2027-01-07', '', 'Fin de contrat']] };
let live = false;

// ---- dates (YYYY-MM-DD, no time zone surprises)
const pad = n => String(n).padStart(2, '0');
const toUTC = d => new Date(d + 'T00:00:00Z');
const iso = t => t.toISOString().slice(0, 10);
const addDays = (d, n) => iso(new Date(toUTC(d).getTime() + n * 864e5));
const diff = (a, b) => Math.round((toUTC(a) - toUTC(b)) / 864e5);
const auj = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; };
const fmt = (d, o) => toUTC(d).toLocaleDateString(LOC(), Object.assign({ timeZone: 'UTC' }, o));
const jourDe = d => ((diff(d, DATA.debut) % 9) + 9) % 9 + 1;                 // 1…9 in the 5-4 cycle
const debutCycle = d => addDays(d, 1 - jourDe(d));
let cur = debutCycle(auj());

// team k works cycle days k … k+4 (wrapping after day 9)
const travaille = (k, j) => ((j - k + 9) % 9) < 5;

function afficher() {
  const today = auj(), jours = [...Array(9)].map((_, i) => addDays(cur, i));
  // on an approved leave that day (« Congés » list; start or end may be empty)
  const fen = w => (DATA.conges || []).filter(c => c[0] === w);
  const absent = (g, d) => fen(g[0]).some(([, a, b]) => (!a || d >= a) && (!b || d <= b));
  const eq = (k, d) => { const actifs = DATA.gens.filter(g => !absent(g, d));
    return { c: actifs.filter(g => g[1] === k && !g[2]).map(g => g[0]).sort(),
             s: actifs.filter(g => g[1] === k && g[2]).map(g => g[0]).sort() }; };
  document.getElementById('periode').textContent =
    `Cycle du ${fmt(jours[0], { day: 'numeric', month: 'long' })} au ${fmt(jours[8], { day: 'numeric', month: 'long', year: 'numeric' })}`;

  // ---- desktop: teams × days
  let h = '<thead><tr><th class="eq"><span class="lg">Équipe</span><span class="tel">Éq.</span></th>' + jours.map((d, i) =>
    `<th class="${d === today ? 'auj' : ''}"><b><span class="lg">Jour </span><span class="tel">J</span>${i + 1}</b>` +
    `${fmt(d, { weekday: 'short' })} <span class="jn">${fmt(d, { day: 'numeric' })}</span></th>`).join('') + '</tr></thead><tbody>';
  for (let k = 1; k <= 9; k++) {
    h += `<tr><th class="eq"><span class="lg">Équipe </span>${k}</th>` + jours.map((d, i) => {
      const e = eq(k, d);
      const on = travaille(k, i + 1), cls = [on ? 'on' : '', on && !travaille(k, i) ? 'debut' : '', d === today ? 'auj' : ''].join(' ');
      return `<td class="${cls}">` + (on ? e.c.map(x => `<span class="c">${x}</span>`).join('') +
        e.s.map(x => `<span class="s">${x}<span class="lg"> (S)</span></span>`).join('') : '') + '</td>';
    }).join('') + '</tr>';
  }
  const compte = i => { let c = 0, s = 0; for (let k = 1; k <= 9; k++) if (travaille(k, i + 1)) { const e = eq(k, jours[i]); c += e.c.length; s += e.s.length; } return [c, s]; };
  h += '</tbody><tfoot><tr><th class="eq"><span class="lg">Contr. + sup.</span><span class="tel">C+S</span></th>' + jours.map((d, i) => { const [c, s] = compte(i);
         return `<td class="${d === today ? 'auj' : ''}">${c}<span class="ps"> + ${s}</span></td>`; }).join('') +
       '</tr><tr class="tot"><th class="eq"><span class="lg">Total</span><span class="tel">Tot.</span></th>' + jours.map((d, i) => { const [c, s] = compte(i); return `<td class="${d === today ? 'auj' : ''}">${c + s}</td>`; }).join('') + '</tr></tfoot>';
  document.getElementById('table').innerHTML = h;

  const jl = d => fmt(d, { day: 'numeric', month: 'long' });
  const cg = DATA.conges || [];
  const prol = cg.filter(([, a, b]) => (!a || a <= today) && (!b || b >= today)).sort((x, y) => (x[0] < y[0] ? -1 : 1))
    .map(([w, , b]) => w + (b ? ` (<span>jusqu'au ${jl(b)}</span>)` : ''));
  const avenir = cg.filter(([, a, b]) => a && a > today && congeAnnonce(a, b)).sort((x, y) => (x[1] < y[1] ? -1 : 1))
    .map(([w, a, b]) => `${w} (<span>${b ? `du ${jl(a)} au ${jl(b)}` : `dès le ${jl(a)}`}</span>)`);
  document.getElementById('note').innerHTML = (prol.length ? `<span>En congé (non compté) :</span> ${prol.join(', ')}. ` : '') +
    (avenir.length ? `<span>Congé à venir (compté jusque-là) :</span> ${avenir.join(', ')}. ` : '') +
    '<span class="tel">En rouge : superviseur. </span>' +
    `<span class="etat">${live ? 'Mis à jour : ' + DATA.at : 'Chargement de la version à jour…'}</span>`;
}

// ---- load the current teams (same way as the schedule page)
function recevoir(d) {
  if (!d || d.erreur || !Array.isArray(d.gens) || !d.debut) { etatErreur(); return; }
  DATA = d; live = true;
  afficher();
}
function etatErreur() {
  const e = document.querySelector('#note .etat');
  if (e) e.textContent = `Version à jour indisponible : copie du ${DATA.at.replace(' (copie)', '')}.`;
}
function charger() {
  const base = CONFIG.url + '?type=equipe&quoi=cycles&t=' + Date.now();
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  fetch(base, { credentials: 'omit', cache: 'no-store', signal: ctl.signal })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { clearTimeout(t); recevoir(d); })
    .catch(() => {
      clearTimeout(t);
      const cb = '__cycles54' + Date.now(), s = document.createElement('script');
      const fin = () => { delete window[cb]; s.remove(); };
      const t2 = setTimeout(() => { fin(); etatErreur(); }, 20000);
      window[cb] = d => { clearTimeout(t2); fin(); recevoir(d); };
      s.onerror = () => { clearTimeout(t2); fin(); etatErreur(); };
      s.src = base + '&callback=' + cb;
      document.head.appendChild(s);
    });
}

document.getElementById('prec').onclick = () => { cur = addDays(cur, -9); afficher(); };
document.getElementById('suiv').onclick = () => { cur = addDays(cur, 9); afficher(); };
document.getElementById('auj').onclick = () => { cur = debutCycle(auj()); afficher(); };
window.surLangue = () => afficher();   // FR/EN switch: dates in the new language
let largeur = innerWidth;
addEventListener('resize', () => { if (innerWidth !== largeur) { largeur = innerWidth; afficher(); } });
afficher();
charger();
</script>
</body>
</html>
