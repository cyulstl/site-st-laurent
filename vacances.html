     The page stays written in French; in English, every piece of text shown is looked up in the page's list
     (window.EN_PAGE, just below this block) and replaced. {x} in a list entry = a part that changes (number, initials,
     date…), carried over to the English: {ini…} = initials only, {n…} = a number only, any other name = any text. Dates use LOC() ('fr-CA' / 'en-CA'). The choice is kept on the device;

             overflow: hidden; background: #fff; font: 600 11.5px/1 Roboto, "Segoe UI", Arial, sans-serif; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  @media (max-width: 760px) {   /* phones: right end of the title row; the status line goes under it */

  }
  @media print { #stlLang { display: none; } }
</style>
<script>
(function () {
  'use strict';
  var K = 'stl.lang';
  function lsGet() { try { return localStorage.getItem(K); } catch (e) { return null; } }
  function lsSet(v) { try { localStorage.setItem(K, v); } catch (e) { /* no storage: this visit only */ } }
  var q = null;
  try { q = window.LANG_URL || new URLSearchParams(location.search).get('lang'); } catch (e) { /* none */ }
  if (q === 'en' || q === 'fr') lsSet(q);
  window.LANG = q === 'en' || q === 'fr' ? q : lsGet() === 'en' ? 'en' : 'fr';
  window.LOC = function () { return window.LANG === 'en' ? 'en-CA' : 'fr-CA'; };
  document.documentElement.lang = window.LANG;

  // ---- the list: exact sentences, sentences with {parts}, and phrases also replaced inside longer text
  var COMMUN = [
    ['Aujourd\'hui', 'Today'], ['Chargement…', 'Loading…'], ['Fermer', 'Close'], ['Annuler', 'Cancel'], ['oui', 'yes'], ['non', 'no'],
    ['Contrôleurs', 'Controllers'], ['Superviseurs', 'Supervisors'], ['Contrôleur', 'Controller'], ['Superviseur', 'Supervisor'],
  ];
  var esc = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  var norm = function (s) { return String(s).replace(/\s+/g, ' ').trim(); };
  var exact, pats, phrMap, phrRe, memo, nLu = -1;
  function compiler() {
    nLu = (window.EN_PAGE || []).length;
    exact = new Map(); pats = []; phrMap = new Map(); memo = new Map();
    COMMUN.concat(window.EN_PAGE || []).forEach(function (e) {
      var k = norm(e[0]), en = e[1];
      if (/\{\w+\}/.test(k)) {
        var noms = [];
        var src = k.split(/(\{\w+\})/).map(function (p) {
          var m = /^\{(\w+)\}$/.exec(p);
          if (m) { noms.push(m[1]); return /^ini/.test(m[1]) ? '([A-Z]{2,3})' : /^n\d*$/.test(m[1]) ? '([-+−]?\\d+(?:[.,]\\d+)?)' : '([\\s\\S]+?)'; }
          return esc(p);
        }).join('');
        pats.push({ re: new RegExp('^' + src + '$'), noms: noms, en: en, poids: k.replace(/\{\w+\}/g, '').length });
      } else {
        exact.set(k, en);
        if (k.indexOf(' ') > 0 && k.length >= 6) phrMap.set(k, en);
      }
    });
    pats.sort(function (a, b) { return b.poids - a.poids; });
    var ph = Array.from(phrMap.keys()).sort(function (a, b) { return b.length - a.length; }).map(esc);
    phrRe = ph.length ? new RegExp('(^|[^0-9A-Za-zÀ-ÿ_])(' + ph.join('|') + ')(?=$|[^0-9A-Za-zÀ-ÿ_])', 'g') : null;
  }
  // French day and month names inside a changing part (dates written by the server): replaced word for word
  var DATES = { 'dim.': 'Sun', 'lun.': 'Mon', 'mar.': 'Tue', 'mer.': 'Wed', 'jeu.': 'Thu', 'ven.': 'Fri', 'sam.': 'Sat',
    dimanche: 'Sunday', lundi: 'Monday', mardi: 'Tuesday', mercredi: 'Wednesday', jeudi: 'Thursday', vendredi: 'Friday', samedi: 'Saturday',
    'janv.': 'Jan', 'févr.': 'Feb', mars: 'Mar', 'avr.': 'Apr', mai: 'May', juin: 'Jun', 'juil.': 'Jul', 'août': 'Aug', 'sept.': 'Sep',
    'oct.': 'Oct', 'nov.': 'Nov', 'déc.': 'Dec', janvier: 'January', 'février': 'February', avril: 'April', juillet: 'July',
    septembre: 'September', octobre: 'October', novembre: 'November', 'décembre': 'December' };
  var dateRe = new RegExp('(^|[^0-9A-Za-zÀ-ÿ_.])(' + Object.keys(DATES).sort(function (a, b) { return b.length - a.length; }).map(esc).join('|') +
    ')(?=$|[^0-9A-Za-zÀ-ÿ_])', 'g');
  function part(v, n) {                 // one changing part: its own translation, else each « ; » item, else dates only
    if (n >= 3) return v;
    var t = trad(v, n + 1);
    if (t != null) return t;
    if (v.indexOf(' ; ') > 0) return v.split(' ; ').map(function (x) { return part(x, n); }).join('; ');
    return v.replace(dateRe, function (x, a, b) { return a + DATES[b]; });
  }
  function trad(s, n) {
    if (!exact || nLu !== (window.EN_PAGE || []).length) compiler();
    var k = norm(s);
    if (k === ':' && /^\s/.test(s)) return ':' + /\s*$/.exec(s)[0];      // « Mise à jour : » → « Update: »
    if (!k || !/[A-Za-zÀ-ÿ]/.test(k)) return null;
    var r;
    if (!n && memo.has(k)) r = memo.get(k);
    else {
      r = exact.get(k);
      if (r === undefined) for (var i = 0; i < pats.length; i++) {
        var p = pats[i], m = p.re.exec(k);
        if (!m) continue;
        r = p.en.replace(/\{(\w+)\}/g, function (x, nom) {
          var j = p.noms.indexOf(nom);
          return j < 0 ? x : part(m[j + 1], n);
        });
        break;
      }
      if (r === undefined && phrRe && /[a-zà-ÿ]/.test(k)) {
        var chg = false;
        var t2 = k.replace(phrRe, function (x, a, b) { chg = true; return a + phrMap.get(b); });
        if (chg) r = t2;
      }
      if (r === undefined) r = null;
      if (!n) memo.set(k, r);
    }
    if (r == null) return null;
    var deb = /^\s*/.exec(s)[0];
    if (/^[:;!?]/.test(r)) deb = '';                       // French space before « : » — none in English
    return deb + r + /\s*$/.exec(s)[0];
  }
  // for code that needs a sentence outside the page (a dialog, the tab title): T('…') gives it in the current language
  window.T = function (s) { if (window.LANG !== 'en') return s; var t = trad(s, 0); return t == null ? s : t; };

  // ---- the page: every text and a few attributes; never what people type, nor marked parts (data-notr)
  var ORIG = new WeakMap(), AORIG = new WeakMap();
  var ATTR = ['title', 'placeholder', 'aria-label', 'alt'];
  var SAUTE = /^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT)$/;

    for (var e = el; e && e.nodeType === 1; e = e.parentElement) if (SAUTE.test(e.tagName) || e.hasAttribute('data-notr') || e.isContentEditable) return true;
    return false;

    var v = nd.nodeValue, o = ORIG.get(nd);
    if (o && v === o[1]) return;
    var en = trad(v, 0);

    ORIG.set(nd, [v, en]); nd.nodeValue = en;

    var v = el.getAttribute(a);
    if (v == null) return;
    var m = AORIG.get(el), o = m && m[a];

    var en = trad(v, 0);
    if (en == null || en === v) return;
    if (!m) AORIG.set(el, m = {});
    m[a] = [v, en]; el.setAttribute(a, en);
  }

    for (var i = 0; i < ATTR.length; i++) if (el.hasAttribute(ATTR[i])) un(el, ATTR[i]);
    if (bouton(el)) un(el, 'value');
  }
  function parcourir(r) {
    if (!r) return;
    if (r.nodeType === 3) { if (!saute(r.parentElement)) texte(r); return; }
    if (r.nodeType !== 1) return;
    if (saute(r)) { if (r.tagName === 'TEXTAREA' && !saute(r.parentElement)) attrs(r); return; }
    attrs(r);
    var w = document.createTreeWalker(r, 5, { acceptNode: function (n) {
      if (n.nodeType !== 1 || !(SAUTE.test(n.tagName) || n.hasAttribute('data-notr') || n.isContentEditable)) return 1;
      if (n.tagName === 'TEXTAREA' && !n.hasAttribute('data-notr')) attrs(n);       // its placeholder, never what's typed
      return 2; } });
    for (var n = w.nextNode(); n; n = w.nextNode()) { if (n.nodeType === 3) texte(n); else attrs(n); }
  }
  function remettre() {
    var w = document.createTreeWalker(document.documentElement, 5);
    for (var n = w.currentNode; n; n = w.nextNode()) {
      if (n.nodeType === 3) { var o = ORIG.get(n); if (o) { if (n.nodeValue === o[1]) n.nodeValue = o[0]; ORIG.delete(n); } }
      else { var m = AORIG.get(n); if (m) { for (var a in m) if (n.getAttribute(a) === m[a][1]) n.setAttribute(a, m[a][0]); AORIG.delete(n); } }
    }
  }
  new MutationObserver(function (ms) {
    if (window.LANG !== 'en') return;
    ms.forEach(function (m) {
      if (m.type === 'childList') m.addedNodes.forEach(parcourir);
      else if (m.type === 'characterData') { if (!saute(m.target.parentElement)) texte(m.target); }
      else if (m.target.nodeType === 1 && !saute(m.target.parentElement) && !/^(SCRIPT|STYLE)$/.test(m.target.tagName) &&
        (m.attributeName !== 'value' || bouton(m.target))) un(m.target, m.attributeName);
    });
  }).observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true,
    attributeFilter: ATTR.concat('value') });

  // ---- the switch, upper right
  function maj() {
    var d = document.getElementById('stlLang');
    if (d) Array.prototype.forEach.call(d.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-l') === window.LANG); });
  }
  function poser(l) {
    if (l === window.LANG) return;
    window.LANG = l; lsSet(l); document.documentElement.lang = l; maj();
    if (l === 'fr') remettre();
    try { if (typeof window.surLangue === 'function') window.surLangue(l); } catch (e) { console.log('surLangue : ' + e); }
    if (l === 'en') parcourir(document.documentElement);
  }
  window.poserLangue = poser;
  // the page's HTML in French (for « Plein écran », which writes the page into a new tab: it then shows in the chosen language)
  window.htmlFr = function () {
    if (window.LANG !== 'en') return document.documentElement.outerHTML;
    remettre();
    var h = document.documentElement.outerHTML;
    parcourir(document.documentElement);
    return h;
  };
  function boutons() {
    if (document.getElementById('stlLang') || !document.body) return;
    var d = document.createElement('div');
    d.id = 'stlLang'; d.setAttribute('data-notr', ''); d.setAttribute('translate', 'no');
    d.innerHTML = '<button type="button" data-l="fr" title="Français">FR</button><button type="button" data-l="en" title="English">EN</button>';
    d.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) poser(b.getAttribute('data-l')); });
    var ici = document.querySelector('[data-langue-ici]');     // the page's own header row, if it has one (and it's shown)
    if (ici && !ici.getClientRects().length) ici = null;
    if (ici) { d.className = 'dans'; ici.appendChild(d); }
    else { d.className = 'rangee'; document.body.insertBefore(d, document.body.firstChild); }   // a thin row of its own, upper right
    maj();
  }
  function init() { boutons(); if (window.LANG === 'en') parcourir(document.documentElement); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

<!--
  VACANCES — élément HTML pour le site Wix (Ajouter → Intégrer du code → HTML personnalisé), sur sa propre page.
  - Copie en direct de l'onglet « Sélection » du fichier « Vacances 2027-2028 St-Laurent » (lecture seule) : choix de
    chacun par tour, places restantes par jour, overlaps, tour en cours et à qui c'est le tour.
  - « Ma demande » : la personne clique ses cycles dans sa rangée et envoie sa demande (code personnel). À son tour,
    elle est inscrite tout de suite dans la feuille et son ✓ est coché ; avant son tour, elle attend en file et
    s'inscrit d'elle-même quand son tour arrive ; si elle ne respecte pas une règle, UK décide. UK reçoit une copie
    par courriel (et une ligne dans l'onglet « Demandes (site) »).
  Lit …/exec?type=equipe&quoi=vacances et envoie …/exec?type=equipe&quoi=vac_demande (application Web de l'Admin. Worksheet).
-->
<style>
  :root { --fg: #3c4043; --muted: #70757a; --line: #dadce0; --soft: #f1f3f4; --bg: #fff; --accent: #1a73e8;
          --ok: #188038; --wait: #b06000; --x: #c5221f; --off: #e3e5e8; --cw: 22px;
          font-family: Roboto, "Segoe UI", Arial, sans-serif; font-size: 14px; color: var(--fg); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  button, select, input, textarea { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; font-weight: 500; color: #202124; }
  .etat { margin-left: auto; font-size: 12px; color: var(--muted); }
  .etat button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 0 0 6px; }
  .err { color: var(--x); }
  .barre { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .onglets { display: inline-flex; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .onglets button { border: 0; background: #fff; padding: 5px 14px; cursor: pointer; }
  .onglets button.on { background: #e8f0fe; color: #174ea6; font-weight: 500; }
  label.moi { font-size: 16px; font-weight: 500; color: #202124; }
  label.moi select { margin-left: 6px; padding: 6px 10px; font-size: 16px; font-weight: 600; border: 1.5px solid #9aa0a6; border-radius: 8px; background: #fff; }
  .mois { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 16px 0; }   /* right above the grid */
  .mois:empty { display: none; }
  .mois button { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .mois button:hover { color: var(--fg); border-color: #bdc1c6; }
  .plein { margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 4px 12px; cursor: pointer; color: var(--accent); }
  .plein:hover { background: #f1f6fe; }
  body.seul .grille { max-height: calc(100vh - 120px); }

  .tour { margin: 12px 16px 6px; padding: 10px 12px; border-radius: 8px; background: #f8f9fa; border: 1px solid var(--line); line-height: 1.55; }
  .tour b.qui { font-size: 16px; color: #202124; }
  .tour .regle { color: var(--muted); font-size: 13px; }
  .tour .suivants { font-size: 12.5px; color: var(--muted); }
  .tour.moi-tour { background: #e6f4ea; border-color: #b7dfc3; }

  /* the grid: sticky left columns and header rows */
  .grille { position: relative; overflow: auto; max-height: 72vh; margin: 8px 16px 0; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: separate; border-spacing: 0; font-size: 11.5px; }
  th, td { padding: 0; height: 22px; text-align: center; white-space: nowrap; border-right: 1px solid #edeef0; border-bottom: 1px solid #edeef0; }
  td.j, th.j { width: var(--cw); min-width: var(--cw); max-width: var(--cw); }
  thead th { position: sticky; background: #fff; z-index: 2; font-weight: 400; color: var(--muted); }
  thead tr.m th { top: 0; height: 20px; color: #202124; font-weight: 500; text-align: left; padding-left: 4px; border-left: 1px solid var(--line); }
  thead tr.n th { top: 20px; }
  thead tr.w th { top: 42px; font-size: 10px; }
  /* same colours as the Sélection tab */
  th.we { background: #c4ecdc; }
  th.fer { background: #f4cccc; color: #202124; font-weight: 700; }
  th.rel { background: #ebddf7; color: #5b2a85; }
  th.cj { background: #ffe499; color: #202124; font-weight: 700; }
  th.cr { background: #df6666; color: #fff; }
  .g { position: sticky; z-index: 1; background: #fff; text-align: left; padding: 0 6px; }
  thead .g { z-index: 3; }
  .g0 { left: 0; width: 44px; min-width: 44px; color: var(--muted); }
  .g1 { left: 44px; width: 40px; min-width: 40px; font-weight: 600; color: #202124; }
  .g2 { left: 84px; width: 38px; min-width: 38px; text-align: right; }
  .g3 { left: 122px; width: 44px; min-width: 44px; text-align: right; }
  .g4 { left: 166px; width: 38px; min-width: 38px; text-align: right; border-right: 1px solid #bdc1c6; }
  tr.p:hover td.g { background: #f8f9fa; }
  tr.p.tour td.g { background: #cfe2f3; font-weight: 700; }
  tr.p.fini td.g1::after { content: ' ✓'; color: var(--ok); font-weight: 400; }
  tr.p.form td.g { color: #b0b4b8; }
  td.g.neg { color: #df6666; font-weight: 700; }
  tr.p td.g.ovneg { background: #df6666; color: #fff; font-weight: 700; }
  td.g.ov0 { color: #999; }
  td.j { background: #fff; color: #202124; }
  td.j.tr { background: #deeaf6; }                 /* whose turn */
  td.j.off { background: #d9d9d9; }                /* day off (5-4 cycle) */
  td.j.cj { background: #fff1cc; }                 /* day at the maximum */
  td.j.cr { background: #df6666; }                 /* over the maximum (overlap used) */
  td.j.cj.off { background: #e8cd8f; }             /* day at the maximum, but a day off in this person's 5-4 cycle */
  td.j.cr.off { background: #b84b4b; }             /* over the maximum, day off */
  td.j.v { background: #6aa84f; font-weight: 700; }
  td.j.vt { background: #df6666; font-weight: 700; }
  td.j.vm { background: #df6666; color: #fff; font-weight: 700; }   /* this person's overlap */
  td.j.vo { background: #ff9900; font-weight: 700; }                /* picked on a day off: check */
  td.j.ech { background: #d9d9d9; font-weight: 700; font-size: 9px; letter-spacing: -.2px; }
  td.j.pour { font-size: 7.5px; color: #555; text-align: left; vertical-align: top; padding: 2px 0 0 2px; line-height: 1; }
  /* my row: framed in blue, my picks not yet in the sheet hatched */
  tr.moi td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
  tr.moi td.j.cl { cursor: pointer; }
  tr.moi td.j.cl:hover { box-shadow: inset 0 0 0 2px var(--accent); }
  tr.moi td.j.sel { background: repeating-linear-gradient(135deg, #b6d7a8 0 4px, #e2f0d9 4px 8px); box-shadow: inset 0 0 0 2px #38761d; }
  tr.moi td.j.sel.ovp { box-shadow: inset 0 0 0 2px #df6666; }
  tr.moi td.j.sel.ko { background: repeating-linear-gradient(135deg, #f4b4b4 0 4px, #fce8e6 4px 8px); box-shadow: inset 0 0 0 2px #df6666; }
  tr.sep td { height: 6px; border: 0; background: #fff; }
  tr.tot td.g { color: var(--muted); font-weight: 400; }
  tr.tot td.j { font-size: 10.5px; color: var(--muted); }
  tr.tot td.j.cj { background: #ffe499; color: #202124; font-weight: 700; }
  tr.tot td.j.cr { background: #df6666; color: #202124; font-weight: 700; }
  tr.tot td.j.crb { background: #df6666; color: #fff; font-weight: 700; }
  tr.ovl td.j.crb { font-size: 8.5px; }
  td.mdeb, th.mdeb { border-left: 1px solid #bdc1c6; }

  .leg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 16px 0; font-size: 12px; color: var(--muted); }
  .leg i { display: inline-block; width: 14px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }

  /* my request */
  .dem { margin: 14px 16px 24px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; }
  .dem h2 { font-size: 16px; font-weight: 500; color: #202124; margin: 0 0 6px; }
  .dem .aide { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .regle-d { margin-top: 6px; }
  .regle-d summary { cursor: pointer; font-weight: 500; color: var(--fg); width: max-content; }
  .regle-d[open] summary { margin-bottom: 2px; }
  .dem .avis { margin: 8px 0; padding: 7px 10px; border-radius: 6px; font-size: 13px; }
  .avis.w { background: #fef7e0; color: #7a4a00; }
  .avis.ok { background: #e6f4ea; color: #0d652d; }
  .avis.x { background: #fce8e6; color: #a50e0e; }
  .mode { font-size: 13px; margin: 6px 0; }
  .modebar { margin: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .modebar label { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border: 2px solid #f57c00; border-radius: 20px;
                   background: #fff4e5; color: #8a4b00; font-weight: 600; font-size: 14px; cursor: pointer; user-select: none; }
  .modebar label.on { background: #f57c00; color: #fff; }
  .modebar input { width: 17px; height: 17px; accent-color: #8a4b00; margin: 0; }
  .modebar .aide { font-size: 12px; color: var(--muted); }
  .blocs { margin: 8px 0; }
  .bloc { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 6px 0; border-bottom: 1px solid #f0f1f2; }
  .bloc b { color: #202124; }
  .bloc .nb { color: var(--muted); font-size: 12.5px; }
  .bloc .m { font-size: 12.5px; }
  .bloc .m.w { color: var(--wait); } .bloc .m.x { color: var(--x); } .bloc .m.ok { color: var(--ok); } .bloc .m.ov { color: #c5221f; font-weight: 500; }
  .ovconf { margin: 12px 0 0; padding: 10px 12px; border: 1px solid #f4c7c3; background: #fce8e6; border-radius: 8px; color: #5f1410; font-size: 14px; line-height: 1.45; }
  .ovconf .actions { margin-top: 8px; }
  .actions[hidden] { display: none; }
  .prog { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: #e8eaed; overflow: hidden; vertical-align: middle; margin-right: 6px; position: relative; }
  .prog-b { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: var(--accent, #1a73e8); animation: prog 1.2s ease-in-out infinite; }
  @keyframes prog { 0% { left: -40%; } 100% { left: 100%; } }
  .prog-n { color: var(--muted); font-size: 12px; }
  .bloc button { margin-left: auto; border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12.5px; }
  .dem label.t { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .dem textarea { width: 100%; min-height: 44px; margin-top: 3px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .actions button { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 18px; padding: 7px 16px; cursor: pointer; }
  .actions button.sec { background: #fff; color: var(--accent); }
  .actions button:disabled { opacity: .5; cursor: default; }
  .actions .msg { font-size: 13px; }
  .actions .msg.ok { color: var(--ok); } .actions .msg.x { color: var(--x); } .actions .msg.w { color: var(--wait); }
  .code { margin: 8px 0 10px; padding: 8px 10px; border-radius: 6px; background: #fef7e0; font-size: 13.5px; }
  .code input#codeIn { width: 5.5em; margin: 0 4px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font-family: "Roboto Mono", monospace; letter-spacing: 2px; }
  .code button, .lien { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 4px; font: inherit; }
  .code #codeOk { border: 1px solid var(--accent); border-radius: 14px; padding: 3px 10px; }
  .code label.ret { margin-left: 8px; color: var(--muted); font-size: 12.5px; }
  .code.ok { background: #e6f4ea; color: #0d652d; padding: 5px 10px; }
  .code .msg.x { color: var(--x); font-weight: 500; }
  .code .msg.x ~ .aide { margin-top: 2px; }
  .code.ko input#codeIn { border-color: var(--x); box-shadow: 0 0 0 1px var(--x); }
  .echf { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; font-size: 13.5px; }
  .echf input, .echf select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .echf button, .ouvrir { border: 1px solid var(--accent); background: #fff; color: var(--accent); border-radius: 16px; padding: 4px 12px; cursor: pointer; }
  #ech h2 .ouvrir { margin-left: 8px; font-size: 13px; vertical-align: 1px; }
  @media (max-width: 600px) {
    .grille { max-height: none; margin: 8px 8px 0; } .tour, .dem, .leg, .mois { margin-left: 8px; margin-right: 8px; }
    .g0, .g3 { display: none; } .g1 { left: 0; } .g2 { left: 40px; } .g4 { left: 78px; }   /* narrow: Ini., Pris, Ovlp. only */
  }
  /* « » in the top-left corner: fold the frozen columns down to Ini. only (remembered on the device) */
  .grille.replie .g0, .grille.replie .g2, .grille.replie .g3, .grille.replie .g4 { display: none; }
  .grille.replie .g1 { left: 0; border-right: 1px solid #bdc1c6; }
  button.plier { border: 1px solid var(--line); background: #fff; color: var(--accent); border-radius: 9px; font-family: inherit; font-weight: 600; font-size: 12px; line-height: 14px;
                 padding: 0 6px; cursor: pointer; }
  button.plier:hover { background: #e8f0fe; border-color: var(--accent); }
  /* bandeau TEST (à enlever quand la vraie sélection commence) */
  .bandeau-test { margin: 10px 16px 0; border-radius: 10px; overflow: hidden; border: 2px solid #f9ab00; background: #fef7e0; }
  .bandeau-test .ruban { height: 10px; background: repeating-linear-gradient(135deg, #f9ab00 0 14px, #3c4043 14px 28px); }
  .bandeau-test .txt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 12px 16px 14px; }
  .bandeau-test b { font-size: 22px; font-weight: 800; letter-spacing: .06em; color: #b06000; }
  .bandeau-test span { font-size: 15px; line-height: 1.45; color: #3c4043; }
  @media (max-width: 600px) { .bandeau-test { margin: 8px 8px 0; } .bandeau-test b { font-size: 19px; } .bandeau-test span { font-size: 14px; } }
</style>
</head>
<body>
<!-- TEST : enlever ce bandeau quand la vraie sélection commence -->
<div class="bandeau-test" role="note"><div class="ruban"></div><div class="txt"><b>TEST EN COURS</b>
  <span>Données fictives : ce ne sont pas les vrais choix de vacances. Ne pas en tenir compte. La vraie sélection sera annoncée par UK.</span></div></div>
<header data-langue-ici>
  <h1>Vacances — sélection</h1>
  <span class="etat" id="etat">Chargement…</span>
</header>
<div class="barre">
  <div class="onglets" id="onglets"></div>
  <label class="moi">Je suis : <select id="moi"><option value="">—</option></select></label>
  <button class="plein" id="bPlein" hidden title="Ouvrir la sélection dans un nouvel onglet, sur toute la largeur de l'écran">&#10530; Plein écran</button>
</div>
<div id="tour"></div>
<div class="modebar" id="modebar" hidden></div>
<div class="mois" id="mois"></div>
<div class="grille" id="grille" data-notr></div>
<div class="leg" id="leg"></div>
<div class="dem" id="dem"></div>
<div class="dem" id="ech" hidden></div>

<script>
// A copy of this whole page as it was loaded, for the « Plein écran » button (taken before anything is drawn)
const PAGE_SOURCE = '<!doctype html>\n' + (window.htmlFr ? htmlFr() : document.documentElement.outerHTML);
const CONFIG = {
  // lien de l'application Web de l'Admin. Worksheet (le même que dans le calendrier). Vide = données d'exemple.
  url: 'https://script.google.com/macros/s/AKfycbzlun0DaIaOlLTwCVXApc4tv6pAecIiLJsfTHMK8mpsCSw0njNe87POvAsIJCePo1Ot/exec',
  rafraichir: 2,            // minutes entre deux relectures de la feuille (la page reste ouverte pendant les tours)
  // règles par tour (les mêmes que le script) : cycles au maximum, jours minimum par cycle, cycle complet obligatoire
  // quand ses jours sont libres (l'overlap n'est jamais obligatoire), ou jours seuls n'importe où
  regles: { 1: { maxCycles: 2, minJours: 3, complet: true }, 2: { maxCycles: 2, minJours: 3, complet: true },
            3: { maxCycles: 2, minJours: 3, complet: false }, 4: { jours: true } },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const utc = d => new Date(d + 'T00:00:00Z');
const ymd = t => `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`;
const fmt = (d, o) => new Intl.DateTimeFormat(LOC(), Object.assign({ timeZone: 'UTC' }, o)).format(utc(d));
const jour = d => fmt(d, { weekday: 'short', day: 'numeric', month: 'short' });
const mod9 = n => ((n % 9) + 9) % 9;
const mem = {
  get(k) { try { return localStorage.getItem('vac.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('vac.' + k, v); } catch (e) { /* pas de stockage */ } },
};
// S.d = data of the sheet, S.g = group shown (index), S.moi = my initials, S.sel = Set of day indexes I picked,
// S.unParUn = { round: true/false } : click single days instead of whole cycles, as chosen by the person for that round;
// not chosen: on by default where incomplete cycles are allowed (round 3), off in rounds 1-2; always in a round of single days
// initials given by the link of the « c'est ton tour » email (…&moi=GE, put in by the server) win over the remembered ones
document.addEventListener('toggle', e => { const k = e.target.dataset && e.target.dataset.mem; if (k) mem.set(k, e.target.open ? '1' : ''); }, true);
const MOI_URL = (() => { try { return String(window.MOI_URL || new URLSearchParams(location.search).get('moi') || '').trim().toUpperCase(); } catch (e) { return ''; } })();
if (/^[A-Z]{2,3}$/.test(MOI_URL)) mem.set('moi', MOI_URL);
// the code given by the same link (…&c=1234, put in by the server) is filled in for those initials only: nothing is checked
// or sent until « Envoyer ma demande » (the server checks the code then, as always)
const CODE_URL = (() => { try { const c = String(window.CODE_URL || new URLSearchParams(location.search).get('c') || '').trim(); return /^\d{4}$/.test(c) ? c : ''; } catch (e) { return ''; } })();
const codeDe = ini => (ini && ini === MOI_URL && CODE_URL) || (ini ? mem.get('code.' + ini) || '' : '');
const S = { d: null, g: 0, moi: mem.get('moi') || '', sel: new Set(), unParUn: {}, envoi: false,
  replie: mem.get('replie') ? mem.get('replie') === '1' : innerWidth <= 600 };   // frozen columns folded to Ini. only
// personal code (4 digits from UK), required to send anything; kept on this device if « retenir » is ticked
S.code = codeDe(S.moi); S.codeRet = true; S.codeSaisie = '';
S.msgDem = ['', '']; S.msgEch = ['', ''];           // last result shown under the buttons (kept when the grid reloads)

/* ---------- derived data ---------- */
const dateDe = k => ymd(new Date(utc(S.d.debut).getTime() + k * 864e5));
const idxDe = d => Math.round((utc(d) - utc(S.d.debut)) / 864e5);
const grp = () => S.d.groupes[S.g];
const moiDe = () => { for (const [gi, g] of S.d.groupes.entries()) { const p = g.gens.find(x => x.i === S.moi); if (p) return { gi, g, p }; } return null; };
// days chosen but not sent yet: kept on this device (per initials) until sent, so a reload doesn't lose them
const selGarder = () => { S.ovConf = false; S.ovOk = false; if (S.moi && S.d) mem.set('sel.' + S.moi, S.sel.size ? JSON.stringify([...S.sel].map(dateDe)) : ''); };
function selReprendre() {
  S.sel = new Set();
  if (!S.moi || !S.d) return;
  try { (JSON.parse(mem.get('sel.' + S.moi) || '[]') || []).map(idxDe).filter(k => k >= 0 && k < S.d.n).forEach(k => S.sel.add(k)); } catch (e) { /* illisible */ }
}
const estVac = v => /^\d+$/.test(String(v || ''));
// base 5-4 pattern of a person (work = true), from the cycle start date
function baseTravail(p, k) { if (!p.cy) return null; return mod9(k - idxDe(p.cy)) < 5; }
// work that day, taking shift exchanges written in the grid into account
// (as in the sheet: initials on one of their work days = a colleague works for them; on a day off = they work
//  for that colleague)
function travaille(g, p, k) {
  const v = p.j[k], base = baseTravail(p, k);
  if (v && !estVac(v)) return !base;
  if (!base && pourQui(g, p, k)) return true;                        // the small mention isn't in their row
  return base;
}
const pourQui = (g, p, k) => g.gens.find(x => x !== p && x.j[k] === p.i && baseTravail(x, k)) || null;
// state of a day for the group, as coloured in the sheet: 'cr' over the maximum, 'cj' at the maximum
const etatCol = (g, k) => { const n = g.enVac[k] || 0; return n > g.max ? 'cr' : g.max > 0 && n === g.max ? 'cj' : ''; };
// the person's 5 work days of the pattern around day k
function cycleDe(p, k) {
  if (!baseTravail(p, k)) return [];
  const debut = k - mod9(k - idxDe(p.cy));
  return [0, 1, 2, 3, 4].map(x => debut + x).filter(x => x >= 0 && x < S.d.n);
}
// whose turn: first one in order who hasn't ticked ✓ for the current round (trainees skipped)
function aQui(g) { return g.gens.filter(p => !p.form && p.cy).find(p => !p.fini) || null; }
// state of a day for me: 'mien' (already mine), 'off', 'libre', 'ovlp' (full, my overlap would allow it), 'complet'
function etatJour(g, p, k) {
  if (estVac(p.j[k])) return 'mien';
  if (!travaille(g, p, k)) return 'off';
  if ((g.places[k] || 0) > 0) return 'libre';
  const n = g.enVac[k] || 0;
  if (n === g.max && !g.ovlpPar[k] && p.ov > 0) return 'ovlp';
  return 'complet';
}

const unParUnDe = g => (g.tour in S.unParUn ? S.unParUn[g.tour] : (CONFIG.regles[g.tour] || {}).complet === false);
const unJour = g => !!(CONFIG.regles[g.tour] || { jours: true }).jours || unParUnDe(g);

/* ---------- rendering ---------- */
// « choisir les jours un par un » : right above the months, for my row, in a round of cycles
function afficherMode() {
  const el = document.getElementById('modebar'), mm = S.d && moiDe();
  const ok = mm && mm.gi === S.g && !(CONFIG.regles[mm.g.tour] || { jours: true }).jours;
  el.hidden = !ok; if (!ok) { el.innerHTML = ''; return; }
  const on = unParUnDe(mm.g);
  el.innerHTML = `<label class="${on ? 'on' : ''}"><input type="checkbox" id="unParUn"${on ? ' checked' : ''}> Choisir les jours un par un</label>` +
    (on ? '<span class="aide">Chaque clic ajoute ou enlève un seul jour.</span>' : '');
}
function afficher() {
  if (!S.d) return;
  const d = S.d;
  // tabs
  document.getElementById('onglets').innerHTML = d.groupes.map((g, i) => `<button data-g="${i}" class="${i === S.g ? 'on' : ''}">${esc(g.nom)}</button>`).join('');
  // me
  const tous = d.groupes.flatMap(g => g.gens.filter(p => !p.form && p.cy).map(p => p.i));
  const sel = document.getElementById('moi');
  sel.innerHTML = '<option value="">—</option>' + tous.slice().sort().map(i => `<option${i === S.moi ? ' selected' : ''}>${esc(i)}</option>`).join('');
  // months
  const mois = [];
  for (let k = 0; k < d.n; k++) if (k === 0 || dateDe(k).slice(8) === '01') mois.push(k);
  document.getElementById('mois').innerHTML = mois.map(k => `<button data-mois="${k}">${esc(fmt(dateDe(k), { month: 'short' }).replace('.', ''))}</button>`).join('');
  afficherTour(); afficherMode(); afficherGrille(); afficherLegende(); afficherDemande(); afficherEchange();
  document.getElementById('etat').innerHTML = (CONFIG.url ? '' : '<b class="err">Données d\'exemple</b> · ') +
    `Feuille lue à ${esc(d.at.slice(11))}<button id="maj" title="Relire la feuille maintenant">↻</button>`;
}

// the round's rule [short, details], in English when the Règles tab has it (columns D and E)
function reglesDe(tour) {
  const x = (S.d.regles || {})[String(tour)] || [];
  return LANG === 'en' && x[2] ? [x[2], x[3] || x[1]] : x;
}
function afficherTour() {
  const g = grp(), qui = aQui(g), r = reglesDe(g.tour);
  const moiTour = qui && qui.i === S.moi;
  document.getElementById('tour').innerHTML = `<div class="tour${moiTour ? ' moi-tour' : ''}">` +
    `<b>${esc(g.nom)} — tour ${g.tour}</b>` +
    (r[0] && !/à fournir/.test(r[0]) ? ` <span class="regle">· ${esc(r[0])}</span>` : '') + '<br>' +
    (qui ? `${moiTour ? '<b class="qui">C\'est ton tour !</b>' : `C'est au tour de <b class="qui">${esc(qui.i)}</b> <span class="regle">(${esc(qui.o)})</span>`}`
      : 'Tout le monde a fini ce tour.') +
    ((g.attente || []).length ? `<br><span class="suivants">Demandes en file d'attente (inscrites automatiquement à leur tour) : ${g.attente.map(esc).join(', ')}</span>` : '') +
    `<br><span class="suivants">Maximum ${g.max} par jour · ${g.ovlp} overlap${g.ovlp > 1 ? 's' : ''} par personne</span></div>`;
}

// the grid is marked data-notr (thousands of cells: the FR/EN switch skips it); its few words go through T() here instead
const boutonPlier = () => `<button class="plier" data-plier title="${T(S.replie ? 'Afficher Ordre, Pris, Solde et Ovlp.' : 'Masquer Ordre, Pris, Solde et Ovlp. (garder les initiales)')}" ` +
  `aria-label="${T(S.replie ? 'Afficher les colonnes' : 'Masquer les colonnes')}">${S.replie ? '»' : '«'}</button>`;
function afficherGrille() {
  const d = S.d, g = grp(), mm = moiDe();
  const fer = new Map((d.feries || []).map(([x, n]) => [x, n]));
  const rel = k => (d.relache || []).find(([a, b]) => dateDe(k) >= a && dateDe(k) <= b);
  const vide = '<th class="g g0"></th><th class="g g1"></th><th class="g g2"></th><th class="g g3"></th><th class="g g4"></th>';
  let m = '<tr class="m">' + vide.replace('<th class="g g1"></th>', `<th class="g g1">${boutonPlier()}</th>`);
  let n = `<tr class="n"><th class="g g0">${T('Ordre')}</th><th class="g g1">${T('Ini.')}</th><th class="g g2" title="${T('Jours de vacances pris')}">${T('Pris')}</th>` +
    `<th class="g g3" title="${T('Jours qu\'il reste (crédits − pris)')}">${T('Solde')}</th><th class="g g4" title="${T('Overlaps restants')}">${T('Ovlp.')}</th>`;
  let w = '<tr class="w">' + vide;
  const mdeb = k => dateDe(k).slice(8) === '01' ? ' mdeb' : '';
  for (let k = 0; k < d.n; k++) {
    const x = dateDe(k), t = utc(x), dow = t.getUTCDay();
    if (x.slice(8) === '01' || k === 0) {
      let fin = k; while (fin + 1 < d.n && dateDe(fin + 1).slice(5, 7) === x.slice(5, 7)) fin++;
      const nom = fmt(x, { month: 'long', year: 'numeric' });
      m += `<th colspan="${fin - k + 1}" id="m${k}">${esc(nom.charAt(0).toUpperCase() + nom.slice(1))}</th>`;
    }
    const f = fer.get(x), r = rel(k), we = dow === 0 || dow === 6, c = etatCol(g, k), nb = g.enVac[k] || 0;
    const titre = [jour(x), f ? 'Férié payé 1,5x : ' + f : '', r ? 'Relâche : ' + r[2] : '',
      c === 'cr' ? `${nb} en vacances : overlap utilisé` : c === 'cj' ? `${nb} en vacances : maximum atteint` : ''].filter(Boolean).map(T).join(' — ');
    n += `<th class="j ${c || (f ? 'fer' : we ? 'we' : '')}${mdeb(k)}" title="${esc(titre)}">${t.getUTCDate()}</th>`;
    w += `<th class="j ${c || (f ? 'fer' : r ? 'rel' : we ? 'we' : '')}${mdeb(k)}" title="${esc(titre)}">${(LANG === 'en' ? 'SMTWTFS' : 'dlmmjvs')[dow]}</th>`;
  }
  const qui = aQui(g);
  const rangees = g.gens.map(p => {
    const moi = mm && mm.p === p, tour = qui === p;
    const cl = ['p', moi ? 'moi' : '', p.fini ? 'fini' : '', tour ? 'tour' : '', p.form || !p.cy ? 'form' : ''].filter(Boolean).join(' ');
    const solde = parseFloat(String(p.solde).replace(',', '.'));
    let h = `<tr class="${cl}" data-i="${esc(p.i)}"><td class="g g0">${esc(p.o)}</td><td class="g g1">${esc(p.i)}</td>` +
      `<td class="g g2">${p.pris || ''}</td><td class="g g3${solde < 0 ? ' neg' : ''}">${esc(p.solde || '')}</td>` +
      `<td class="g g4${p.form || !p.cy ? '' : p.ov < 0 ? ' ovneg' : p.ov === 0 ? ' ov0' : ''}">${p.form || !p.cy ? '' : p.ov}</td>`;
    for (let k = 0; k < d.n; k++) {
      const v = p.j[k], base = baseTravail(p, k), col = etatCol(g, k);
      let cls, txt = '', titre = '';
      if (v && !estVac(v)) {
        if (p.cy && base) { cls = 'ech'; titre = T(`${v} travaille à la place de ${p.i}`); } else { cls = 'pour'; titre = T(`${p.i} travaille pour ${v}`); }
        txt = esc(v);
      } else if (estVac(v)) {
        const ov = g.ovlpPar[k] === p.i;
        cls = p.cy && base === false ? 'vo' : ov ? 'vm' : col === 'cr' ? 'vt' : 'v';
        txt = esc(v);
        titre = [p.i, T('tour ' + v), ov ? T('son overlap') : '', cls === 'vo' ? T('pris sur un congé : à vérifier') : ''].filter(Boolean).join(' · ');
      } else {
        const pq = p.cy && base === false ? pourQui(g, p, k) : null;
        if (pq) { cls = 'pour'; txt = esc(pq.i); titre = T(`${p.i} travaille pour ${pq.i}`); }
        else cls = col ? col + (p.cy && base === false ? ' off' : '') : p.cy && base === false ? 'off' : tour ? 'tr' : '';   // full days still show the 5-4 cycle
      }
      if (moi && !v && travaille(g, p, k)) {
        cls += ' cl';
        if (S.sel.has(k)) { const e = etatJour(g, p, k); cls += ' sel' + (e === 'ovlp' ? ' ovp' : e === 'complet' ? ' ko' : ''); }
      }
      h += `<td class="j ${cls}${mdeb(k)}" data-k="${k}"${titre ? ` title="${esc(titre + ' · ' + jour(dateDe(k)))}"` : ''}>${txt}</td>`;
    }
    return h + '</tr>';
  }).join('');
  const sep = `<tr class="sep"><td class="g g0"></td><td class="g g1"></td><td class="g g2"></td><td class="g g3"></td><td class="g g4"></td><td colspan="${d.n}"></td></tr>`;
  const ligne = (cls, lab, titre, cell) => `<tr class="tot ${cls}"><td class="g g0"></td><td class="g g1" title="${titre}">${lab}</td><td class="g g2"></td><td class="g g3"></td><td class="g g4"></td>` +
    Array.from({ length: d.n }, (_, k) => cell(k)).join('') + '</tr>';
  const bas = ligne('', T('Vac.'), T('En vacances'), k => `<td class="j ${etatCol(g, k)}${mdeb(k)}">${g.enVac[k] || ''}</td>`) +
    ligne('places', T('Libres'), T('Places restantes'), k => `<td class="j${etatCol(g, k) === 'cr' ? ' crb' : ''}${mdeb(k)}">${g.places[k] || 0}</td>`) +
    ligne('ovl', T('Ovlp.'), T('Overlap utilisé par'), k => { const v = g.ovlpPar[k] || '';
      return `<td class="j${v ? ' crb' : ''}${mdeb(k)}"${v ? ` title="${v === 'TROP' ? T('Trop de monde ce jour-là') : T('Overlap utilisé par') + ' ' + esc(v)}"` : ''}>${esc(v === 'TROP' ? '!' : v)}</td>`; });
  const el = document.getElementById('grille'), sx = el.scrollLeft, sy = el.scrollTop;
  el.classList.toggle('replie', S.replie);
  el.innerHTML = `<table><thead>${m}</tr>${n}</tr>${w}</tr></thead><tbody>${rangees}${sep}${bas}</tbody></table>`;
  el.scrollLeft = sx; el.scrollTop = sy;
}

function afficherLegende() {
  const it = (style, t) => `<span><i style="${style}"></i>${t}</span>`;
  document.getElementById('leg').innerHTML =
    it('background:#6aa84f', 'vacances (le chiffre = le tour)') + it('background:linear-gradient(90deg,#fff1cc 50%,#e8cd8f 50%);box-shadow:inset 0 0 0 1px #f1d98a', 'jour au maximum (plus foncé : en congé)') +
    it('background:#df6666', 'overlap utilisé') + it('background:#d9d9d9', 'congé (cycle 5-4)') +
    it('background:#d9d9d9;box-shadow:inset 0 0 0 1px #bbb', 'initiales : le collègue travaille à sa place') +
    it('background:#ff9900', 'pris sur un congé (à vérifier)') + it('background:#cfe2f3', 'à son tour') +
    it('background:repeating-linear-gradient(135deg,#b6d7a8 0 4px,#e2f0d9 4px 8px);box-shadow:inset 0 0 0 1px #38761d', 'ma demande (pas encore dans la feuille)') +
    it('background:#f4cccc', 'férié') + it('background:#ebddf7', 'relâche') + it('background:#c4ecdc', 'fin de semaine');
}

// consecutive days → blocks [first, last]
function blocs(ks) {
  const out = [];
  [...ks].sort((a, b) => a - b).forEach(k => { const b = out[out.length - 1]; if (b && k === b[1] + 1) b[1] = k; else out.push([k, k]); });
  return out;
}
// my picks grouped by cycle, with what the page can check
function analyse() {
  const mm = moiDe(); if (!mm) return null;
  const { g, p } = mm, R = CONFIG.regles[g.tour] || { jours: true }, complet = !!R.complet, parCycles = !R.jours;
  const parCycle = new Map();
  [...S.sel].forEach(k => {
    const c = cycleDe(p, k), cle = c.length ? c[0] : 'j' + k;
    if (!parCycle.has(cle)) parCycle.set(cle, { c, ks: [] });
    parCycle.get(cle).ks.push(k);
  });
  const cycles = [...parCycle.values()].sort((a, b) => Math.min(...a.ks) - Math.min(...b.ks)).map(x => {
    const ks = x.ks.sort((a, b) => a - b), msgs = [];
    const etats = ks.map(k => etatJour(g, p, k));
    const nOv = etats.filter(e => e === 'ovlp').length, nKo = etats.filter(e => e === 'complet').length;
    if (nKo) msgs.push(['x', `${nKo} jour${nKo > 1 ? 's' : ''} déjà complet${nKo > 1 ? 's' : ''}`]);
    const ovKs = ks.filter((k, i) => etats[i] === 'ovlp');
    const libres = x.c.filter(k => !S.sel.has(k) && etatJour(g, p, k) === 'libre');
    if (complet && libres.length) msgs.push(['w', `cycle incomplet alors que ${libres.length} autre${libres.length > 1 ? 's' : ''} jour${libres.length > 1 ? 's sont libres' : ' est libre'} (${libres.map(k => jour(dateDe(k))).join(', ')})`]);
    if (parCycles && ks.length < R.minJours) msgs.push(['w', `moins de ${R.minJours} jours`]);
    if (!msgs.length) msgs.push(['ok', !parCycles ? 'ok' : ks.length === 5 ? 'cycle complet' : complet ? 'cycle incomplet : les autres jours sont déjà pris' : 'cycle incomplet (permis à ce tour)']);
    return { ks, msgs, ovKs };
  });
  // days already at the maximum: within the overlaps left, the overlap is simply used (the pick goes through);
  // beyond, it goes to UK
  const nOv = cycles.reduce((s, c) => s + c.ovKs.length, 0), ovOk = nOv <= p.ov;
  cycles.forEach(c => { if (c.ovKs.length) c.msgs.push(ovOk
    ? ['ov', `${c.ovKs.map(k => jour(dateDe(k))).join(', ')} : déjà au maximum, ton overlap sera utilisé`]
    : ['x', `${c.ovKs.length} jour${c.ovKs.length > 1 ? 's' : ''} au maximum : il faudrait ton overlap`]); });
  const gen = [];
  if (parCycles && cycles.length > R.maxCycles) gen.push(['w', `${cycles.length} cycles : au tour ${g.tour}, c'est ${R.maxCycles} au maximum`]);
  const solde = parseFloat(String(p.solde).replace(',', '.'));
  if (!isNaN(solde) && S.sel.size > solde) gen.push(['x', `${S.sel.size} jour${S.sel.size > 1 ? 's' : ''} choisi${S.sel.size > 1 ? 's' : ''}, il t'en reste ${solde} (solde)`]);
  if (nOvTot(cycles) > p.ov) gen.push(['x', `il te faudrait ${nOvTot(cycles)} overlaps, il t'en reste ${p.ov}`]);
  const qui = aQui(g);
  if (p.fini) gen.push(['x', 'tu as déjà fini ce tour (✓ dans la feuille) : reviens au prochain tour']);
  else if (qui && qui !== p) gen.push(['w', `ce n'est pas encore ton tour (c'est au tour de ${qui.i}) : ta demande attendra en file et s'inscrira toute seule à ton tour`]);
  if (cycles.some(c => c.msgs.some(([n]) => n !== 'ok' && n !== 'ov')) || gen.some(([n, t]) => n === 'x' || / cycles :/.test(t)))
    gen.push(['w', 'une demande qui ne respecte pas les règles n\'est pas inscrite : elle est envoyée à UK, qui décide']);
  const ovJours = ovOk ? cycles.flatMap(c => c.ovKs).sort((x, y) => x - y) : [];
  return { g, p, cycles, gen, ovJours };
}
const nOvTot = cycles => cycles.reduce((s, c) => s + c.ks.filter(k => etatJour(S.d.groupes[moiDe().gi], moiDe().p, k) === 'ovlp').length, 0);

/* ---------- shift exchange: « X travaille à la place de Y » on a date, to be written in the grid by UK ---------- */
// S.ech = lines to send [{ d, qui, pour }], S.echOuvert = form shown, S.echF = what is in the form
S.ech = []; S.echOuvert = false; S.echF = { d: '', qui: '', pour: '' };
function verifEchange(g, l) {
  const k = idxDe(l.d), P = g.gens.find(x => x.i === l.pour), Q = g.gens.find(x => x.i === l.qui), out = [];
  if (!(k >= 0 && k < S.d.n)) return [['x', 'date hors de l\'année de vacances']];
  if (estVac(P.j[k])) out.push(['w', `${P.i} est en vacances ce jour-là`]);
  else if (P.j[k]) out.push(['w', `déjà un échange inscrit pour ${P.i} ce jour-là (${P.j[k]})`]);
  else if (baseTravail(P, k) === false) out.push(['w', `${P.i} ne travaille pas ce jour-là (cycle 5-4)`]);
  if (baseTravail(Q, k)) out.push(['w', `${Q.i} travaille déjà ce jour-là`]);
  if (estVac(Q.j[k])) out.push(['w', `${Q.i} est en vacances ce jour-là`]);
  return out.length ? out : [['ok', 'ok']];
}
function afficherEchange() {

  let h = `<h2>Échange de quart${S.echOuvert ? '' : ' <button class="ouvrir" id="echOuvrir">+ Ajouter un échange</button>'}</h2>` +

  if (S.echOuvert) {
    h += `<div class="echf">Le <input type="date" id="echD" value="${esc(F.d)}" min="${S.d.debut}" max="${dateDe(S.d.n - 1)}">` +

    h += '<div class="blocs">' + S.ech.map((l, i) => `<div class="bloc"><b>${esc(jour(l.d))}</b><span>${esc(l.qui)} travaille à la place de ${esc(l.pour)}</span>` +
      verifEchange(g, l).map(([n, t]) => n === 'ok' ? '<span class="m ok">✓</span>' : `<span class="m ${n}">${n === 'x' ? '✗' : '⚠'} ${esc(t)}</span>`).join('') +
      `<button data-echenl="${i}">enlever</button></div>`).join('') + '</div>';
    if (S.sel.size) h += '<div class="avis w">Tes jours de vacances choisis ne sont pas encore envoyés : le bouton ci-dessous n\'envoie que l\'échange. Pour tes vacances, utilise « Envoyer ma demande » dans « Ma demande ».</div>';
    h += `<label class="t">Note pour UK (facultatif)<textarea id="echNote">${esc(F.note || '')}</textarea></label>` +
      (S.code ? '' : '<div class="aide" style="margin-top:8px">Entre d\'abord ton code personnel dans « Ma demande ».</div>') +
      `<div class="actions"><button id="echEnvoyer"${!S.ech.length || S.envoi || !S.code ? ' disabled' : ''}>Envoyer ${S.ech.length > 1 ? 'les échanges' : 'l\'échange'}</button>` +
      `<button class="sec" id="echFermer">Annuler</button><span class="msg ${S.msgEch[0]}" id="echMsg">${S.msgEch[1]}</span></div>`;

function ajouterEchange() {
  const F = S.echF, msg = t => { document.getElementById('echMsg').className = 'msg x'; document.getElementById('echMsg').textContent = t; };
  if (!F.d) return msg('Choisis la date.');
  if (!F.qui || !F.pour) return msg('Choisis les deux personnes.');
  if (F.qui === F.pour) return msg('Il faut deux personnes différentes.');
  if (F.qui !== S.moi && F.pour !== S.moi) return msg('Tu dois être une des deux personnes de l\'échange.');
  if (S.ech.length >= 10) return msg('10 échanges au plus par envoi.');
  if (!S.ech.some(l => l.d === F.d && l.qui === F.qui && l.pour === F.pour)) S.ech.push({ d: F.d, qui: F.qui, pour: F.pour });
  S.ech.sort((a, b) => (a.d < b.d ? -1 : 1));
  F.d = ''; afficherEchange();
}
function envoyerEchange() {
  const mm = moiDe(); if (!mm || !S.ech.length) return;
  const avert = S.ech.map(l => [l, verifEchange(mm.g, l).filter(([n]) => n !== 'ok')]).filter(x => x[1].length)
    .map(([l, m]) => `${l.d} ${l.qui}>${l.pour} : ${m.map(x => x[1]).join(', ')}`).join(' ; ');
  S.envoi = true; afficherEchange();
  const msg = (cls, t) => { S.msgEch = [cls, esc(t)]; const m = document.getElementById('echMsg'); if (m) { m.className = 'msg ' + cls; m.textContent = t; } };
  const stop = progres('echMsg', ['Envoi…', 'Vérification de ton code…', 'Vérification de l\'échange…', 'Inscription dans la grille…', 'Copie à UK…', 'Presque fini…']);
  appel({ quoi: 'vac_echange', ini: S.moi, code: S.code, ech: S.ech.map(l => `${l.d}:${l.qui}>${l.pour}`).join(','), note: S.echF.note || '', avert }, r => {
    stop(); S.envoi = false;
    if (r && r.ok) { const n = S.ech.length; S.ech = []; S.echF = { d: '', qui: '', pour: S.moi }; afficherEchange();
      if (r.statut === 'a_decider') msg('w', `Envoyé à UK pour décision — rien n'est inscrit : ${(r.raisons || []).join(' ; ')}`);
      else { msg('ok', `Inscrit ✓ dans la grille — UK en a reçu une copie.` + (S.sel.size ? ' Tes jours de vacances, eux, ne sont pas encore envoyés : « Envoyer ma demande ».' : '')); charger(true); } }
    else if (codeRefuse(r)) { afficherEchange(); msg('x', r.erreur); }
    else { afficherEchange(); msg('x', (r && r.erreur) || 'Envoi impossible pour le moment. Réessaie dans quelques minutes, ou texte UK.'); }
  });
}
// Call to the web app. 1st try: a plain request WITHOUT the browser's Google sign-in (like the grid and the
// schedule page): JSONP sends the Google cookies, and with several Google accounts signed in, Google answers
// with a sign-in page instead, so the call fails. JSONP is only a fallback, and only for calls that change
// nothing (a request or an exchange is never sent twice).
function appel(params, fini) {
  const f0 = fini;
  fini = r => f0(r && !r.ok && !r.erreur ? { erreur: 'Le serveur du site n\'a pas encore la nouvelle version (UK doit la déployer). Réessaie plus tard.' } : r);
  if (!CONFIG.url) {                     // sample data: the code is 1234
    const bon = !('code' in params) || params.code === '1234';
    let rep = { ok: 1 };
    if (bon && params.quoi === 'vac_demande') {        // like the server: written at your turn, otherwise queued
      const mm = moiDe(), qui = mm && aQui(mm.g), actifs = mm ? mm.g.gens.filter(p => !p.form && p.cy && !p.fini) : [];
      rep = qui === (mm && mm.p) ? { ok: 1, statut: 'inscrite' } : { ok: 1, statut: 'attente', avant: Math.max(0, actifs.indexOf(mm.p)), raisons: [] };
    } else if (bon && params.quoi === 'vac_echange') rep = { ok: 1, statut: 'inscrit' };
    setTimeout(() => fini(bon ? rep : { erreur: `Code incorrect pour ${params.ini}. (Données d'exemple : 1234)`, code: 1 }), 300); return;
  }
  const q = Object.entries(Object.assign({ type: 'equipe' }, params)).map(([k, x]) => k + '=' + encodeURIComponent(x)).join('&');
  const u = CONFIG.url + (CONFIG.url.includes('?') ? '&' : '?') + q;
  const sansEffet = params.quoi === 'vac_code';
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  fetch(u + '&t=' + Date.now(), { credentials: 'omit', cache: 'no-store', signal: ctl.signal })
    .then(r => r.json())
    .then(r => { clearTimeout(t); fini(r); })
    .catch(() => { clearTimeout(t); if (sansEffet) jsonp(u, fini); else fini(null); });
}
function jsonp(u, fini) {
  const cb = '__vac' + Date.now(), s = document.createElement('script');
  const minuterie = setTimeout(() => { delete window[cb]; s.remove(); fini(null); }, 30000);
  window[cb] = r => { clearTimeout(minuterie); delete window[cb]; s.remove(); fini(r); };
  s.onerror = () => { clearTimeout(minuterie); delete window[cb]; s.remove(); fini(null); };
  s.src = u + '&callback=' + cb;
  document.head.appendChild(s);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const g = t.closest('[data-g]');
  if (g) { S.g = +g.dataset.g; afficher(); return; }
  if (t.closest('[data-plier]')) { S.replie = !S.replie; mem.set('replie', S.replie ? '1' : '0');
    const el = document.getElementById('grille'); el.classList.toggle('replie', S.replie); t.closest('[data-plier]').outerHTML = boutonPlier(); return; }
  const mo = t.closest('[data-mois]');
  if (mo) { const c = document.getElementById('m' + mo.dataset.mois), el = document.getElementById('grille');
    // measured on screen: the sticky columns' offsetLeft moves with the scroll, so it can't be used
    const r0 = el.getBoundingClientRect().left, fixe = [...el.querySelectorAll('thead tr.n .g')].filter(x => x.offsetWidth);
    const gauche = fixe.length ? Math.max(...fixe.map(x => x.getBoundingClientRect().right)) - r0 : 0;
    if (c) el.scrollTo({ left: el.scrollLeft + c.getBoundingClientRect().left - r0 - gauche, behavior: 'smooth' }); return; }
  if (t.id === 'maj') { charger(true); return; }
  const td = t.closest('tr.moi td.j.cl');
  if (td) {
    const mm = moiDe(), k = +td.dataset.k;
    if (unJour(mm.g)) { if (S.sel.has(k)) S.sel.delete(k); else S.sel.add(k); }
    else {
      // a cycle: the first click takes every day still free (not the days already at the maximum: those would use
      // the overlap); a click on such a day of the chosen cycle adds it (overlap), or takes it back; a click on
      // another day of the chosen cycle drops the whole cycle
      const cyc = cycleDe(mm.p, k).filter(x => travaille(mm.g, mm.p, x) && !estVac(mm.p.j[x]));
      const libres = cyc.filter(x => etatJour(mm.g, mm.p, x) === 'libre'), e = etatJour(mm.g, mm.p, k);
      if (cyc.some(x => S.sel.has(x))) {
        if (e === 'ovlp') { if (S.sel.has(k)) S.sel.delete(k); else S.sel.add(k); }
        else cyc.forEach(x => S.sel.delete(x));
      } else if (libres.length) libres.forEach(x => S.sel.add(x));
      else if (e === 'ovlp') S.sel.add(k);
    }
    S.msgDem = ['', '']; selGarder();
    afficherGrille(); afficherDemande(); afficherEchange(); return;
  }
  const enl = t.closest('[data-enlever]');
  if (enl) { const a = analyse(); (a.cycles[+enl.dataset.enlever] || { ks: [] }).ks.forEach(k => S.sel.delete(k)); selGarder(); afficherGrille(); afficherDemande(); afficherEchange(); return; }
  if (t.id === 'envoyer') envoyer(false);
  if (t.id === 'ovOui') { S.ovOk = true; envoyer(false); }
  if (t.id === 'ovNon') { S.ovConf = false; S.ovOk = false; afficherDemande(); }
  if (t.id === 'rien') envoyer(true);
  if (t.id === 'codeOk') validerCode();
  if (t.id === 'codeOubli') { mem.set('code.' + S.moi, ''); S.code = ''; afficherDemande(); afficherEchange(); }
  if (t.id === 'echOuvrir') { S.echOuvert = true; afficherEchange(); }
  if (t.id === 'echFermer') { S.echOuvert = false; S.ech = []; afficherEchange(); }
  if (t.id === 'echAjout') ajouterEchange();
  if (t.id === 'echEnvoyer') envoyerEchange();
  const ee = t.closest('[data-echenl]');
  if (ee) { S.ech.splice(+ee.dataset.echenl, 1); afficherEchange(); }
});

// while a request is on its way (10 to 20 s: the server checks the code, re-reads the grid, writes, emails UK):
// a moving bar and the steps, so the wait doesn't look stuck; the real answer replaces it
function progres(id, etapes) {
  const el = () => document.getElementById(id); let x = 0, fini = false;
  const dessine = () => { const m = el(); if (!m || fini) return; m.className = 'msg';
    m.innerHTML = `<span class="prog"><span class="prog-b"></span></span> ${esc(etapes[Math.min(x, etapes.length - 1)])} <span class="prog-n">— ne ferme pas la page</span>`; };
  dessine(); const t = setInterval(() => { x++; dessine(); }, 3000);
  return () => { fini = true; clearInterval(t); };
}
function envoyer(rien) {
  const a = analyse(); if (!a) return;
  // a pick that uses the overlap: one more click, so nobody spends it by accident
  if (!rien && a.ovJours.length && !S.ovOk) { S.ovConf = true; afficherDemande(); const b = document.getElementById('ovconf'); if (b) b.scrollIntoView({ block: 'nearest' }); return; }
  S.ovConf = false; S.ovOk = false;
  const msg = (cls, t) => { S.msgDem = [cls, t]; const m = document.getElementById('msg'); if (m) { m.className = 'msg ' + cls; m.innerHTML = t; } };
  const avert = [...a.gen.map(x => x[1]), ...a.cycles.flatMap(c => c.msgs.filter(([n]) => n !== 'ok')
    .map(([, t]) => `${blocs(c.ks).map(([x, y]) => dateDe(x) + (x === y ? '' : '→' + dateDe(y))).join(', ')} : ${t}`))].join(' ; ');
  const c = { ini: S.moi, code: S.code, tour: String(a.g.tour), jours: rien ? '' : [...S.sel].sort((x, y) => x - y).map(dateDe).join(','), rien: rien ? '1' : '',
    alt: '', note: document.getElementById('note').value, avert };
  S.envoi = true; afficherDemande(); document.getElementById('note').value = c.note;
  const stop = progres('msg', ['Envoi…', 'Vérification de ton code…', 'Vérification des règles du tour…', rien ? 'Ton tour est noté…' : 'Inscription de tes jours…', 'Copie à UK…', 'Presque fini…']);
  const fini = r => {
    stop(); S.envoi = false;
    if (r && r.ok) {
      ['note'].forEach(id => { const x = document.getElementById(id); if (x) x.value = ''; });
      S.sel.clear(); selGarder(); afficherGrille(); afficherDemande();
      if (r.statut === 'inscrite') msg('ok', rien ? 'C\'est noté ✓ — tu ne prends rien à ce tour-ci, ton tour est terminé.' : 'Inscrit ✓ dans la feuille — ton tour est terminé. UK en a reçu une copie.');
      else if (r.statut === 'attente' && r.confirmation) msg('ok', 'Reçu ✓ — c\'est ton tour, mais UK vérifie d\'abord les choix de la personne avant toi. Ta demande s\'inscrira toute seule dès qu\'il les aura confirmés.');
      else if (r.statut === 'attente') msg('ok', `En file d'attente ✓ — ${r.avant ? `${r.avant} personne${r.avant > 1 ? 's' : ''} avant toi. ` : ''}Ta demande s'inscrira toute seule à ton tour ; UK sera avisé si elle ne peut plus passer.` +
        (r.raisons && r.raisons.length ? ` <b>Attention : en ce moment, elle ne passerait pas</b> (${esc(r.raisons.join(' ; '))}).` : ''));
      else if (r.statut === 'a_decider') msg('w', `Envoyé à UK pour décision — rien n'est inscrit : ${esc((r.raisons || []).join(' ; '))}. C'est toujours ton tour.`);
      else msg('ok', 'Envoyé ✓');
      charger(true);
    } else if (codeRefuse(r)) { msg('x', esc(r.erreur)); }
    else { afficherDemande(); msg('x', esc((r && r.erreur) || 'Envoi impossible pour le moment. Réessaie dans quelques minutes, ou texte UK.')); }
  };
  appel(Object.assign({ quoi: 'vac_demande' }, c), fini);
}

/* ---------- loading ---------- */
function garder(d) {
  if (!d || !Array.isArray(d.groupes) || !d.debut) return false;
  const premier = !S.d;
  S.d = d;
  if (premier) { const mm = moiDe(); if (mm) S.g = mm.gi; selReprendre(); }
  // a picked day that is now in the sheet (mine) leaves my request
  const mm = moiDe(); if (mm) { const n = S.sel.size; [...S.sel].forEach(k => { if (estVac(mm.p.j[k])) S.sel.delete(k); }); if (S.sel.size !== n) selGarder(); }
  afficher(); return true;
}
function charger(frais) {
  if (!CONFIG.url) { garder(demo()); return; }
  if (!S.d && !frais) { try { garder(JSON.parse(mem.get('data') || 'null')); } catch (e) { /* cache illisible */ } }
  const u = CONFIG.url + (CONFIG.url.includes('?') ? '&' : '?') + 'type=equipe&quoi=vacances' + (frais ? '&frais=1' : '');
  const ko = () => { if (!S.d) document.getElementById('etat').innerHTML = '<span class="err">Feuille des vacances indisponible pour le moment.</span>'; };
  fetch(u + '&t=' + Date.now(), { credentials: 'omit', cache: 'no-store' }).then(r => r.json())
    .then(d => { if (!garder(d)) throw 0; try { mem.set('data', JSON.stringify(d)); } catch (e) { /* trop gros */ } })
    .catch(() => {
      const cb = '__vacl' + Date.now(), s = document.createElement('script');
      window[cb] = d => { delete window[cb]; s.remove(); if (garder(d)) { try { mem.set('data', JSON.stringify(d)); } catch (e) { /* */ } } else ko(); };
      s.onerror = () => { s.remove(); ko(); };
      s.src = u + '&callback=' + cb; document.head.appendChild(s);
    });
}
// sample data (no link): 2 groups, cycles 5-4, a few picks, one overlap, one shift exchange

  const C = [['C01','SF','2027-04-01'],['C02','BT','2027-03-24'],['C03','GE','2027-03-29'],['C04','YH','2027-04-01'],['C05','ZZ','2027-03-30'],

    ['S06','GA','2027-03-29'],['S07','CZ','2027-03-31']];
  const ix = d => Math.round((utc(d) - utc(debut)) / 864e5);
  const mk = (l, ov) => l.map(([o, i, cy]) => ({ o, i, dispo: '', t: [0, 0, 0, 0, 0, 0], pris: 0, solde: '', ov, fini: false, cy, form: !cy, j: {} }));
  const groupes = [{ cle: 'C', nom: 'Contrôleurs', tour: 2, nbTours: 5, max: 3, ovlp: 1, gens: mk(C, 1) },
    { cle: 'S', nom: 'Surveillants', tour: 1, nbTours: 6, max: 1, ovlp: 3, gens: mk(SU, 3) }];
  const prendre = (g, i, autour, tour) => {
    const p = groupes[g].gens.find(x => x.i === i); let k = ix(autour);
    while (mod9(k - ix(p.cy)) >= 5) k++;
    k -= mod9(k - ix(p.cy));
    for (let x = 0; x < 5; x++) { p.j[k + x] = String(tour); p.t[tour - 1]++; p.pris++; }
  };
  prendre(0, 'SF', '2027-07-01', 1); prendre(0, 'BT', '2027-07-01', 1); prendre(0, 'GE', '2027-07-01', 1); prendre(0, 'ZZ', '2027-08-15', 1);
  prendre(0, 'DW', '2027-12-22', 1); prendre(0, 'SF', '2027-08-20', 1); prendre(0, 'YH', '2027-07-01', 2);
  prendre(1, 'HY', '2027-07-10', 1); prendre(1, 'DB', '2027-12-24', 1);
  ['SF', 'BT', 'GE'].forEach(i => { groupes[0].gens.find(x => x.i === i).fini = true; });
  groupes[0].gens.find(x => x.i === 'YH').ov = 0;
  const uk = groupes[0].gens.find(x => x.i === 'UK'); let k = ix('2027-07-01'); while (mod9(k - ix(uk.cy)) >= 5) k++;
  const col = groupes[0].gens.find(x => x.cy && mod9(k - ix(x.cy)) >= 5); uk.j[k] = col.i; col.j[k] = 'UK';
  for (const g of groupes) {
    g.enVac = []; g.places = []; g.ovlpPar = [];
    for (let k = 0; k < n; k++) {
      const v = g.gens.filter(p => /^\d+$/.test(p.j[k] || ''));
      g.enVac[k] = v.length; g.places[k] = Math.max(0, g.max - v.length);
      g.ovlpPar[k] = v.length <= g.max ? '' : v.length > g.max + 1 ? 'TROP' : v.reduce((a, p) => (+p.j[k] >= +a.j[k] ? p : a)).i;
    }
  }
  return { at: '2026-11-20 21:00', debut, n, groupes,
    regles: { 1: ["Jusqu'à 2 cycles complets  •  Minimum 3 jours si bloqué", "Chaque personne peut prendre 0, 1 ou 2 cycles complets ; un cycle incomplet d'au moins 3 jours seulement si les autres jours sont déjà bloqués par d'autres."],
      2: ["Jusqu'à 2 cycles complets  •  Minimum 3 jours si bloqué", "Mêmes règles qu'au tour 1."] },
    feries: [['2027-05-24', 'Fête de la Reine'], ['2027-06-24', 'Fête de la St-Jean'], ['2027-07-01', 'Fête du Canada'], ['2027-09-06', 'Fête du Travail'],
      ['2027-09-30', 'Journée nationale de la vérité et de la réconciliation'], ['2027-10-11', 'Action de grâce'], ['2027-11-11', 'Jour du Souvenir'],
      ['2027-12-25', 'Noël'], ['2027-12-26', 'Boxing Day'], ['2028-01-01', 'Jour de l\'An']],
    relache: [['2028-02-26', '2028-03-03', 'CSS des Affluents (probable, à confirmer)'], ['2028-03-04', '2028-03-12', 'La plupart des CSS (à confirmer)']] };
}
// « Plein écran »: opens a new tab and writes this same page into it (as on the schedule page: no web
// address involved). Shown only inside the Wix frame.
(() => {
  const b = document.getElementById('bPlein');
  let dansCadre = true;
  try { dansCadre = window.top !== window; } catch (e) { dansCadre = true; }
  if (!dansCadre) { document.body.classList.add('seul'); return; }
  b.hidden = false;
  b.onclick = () => {
    const w = window.open('', '_blank');
    if (!w) { b.textContent = 'Fenêtre bloquée par le navigateur'; return; }
    try { w.document.open(); w.document.write(PAGE_SOURCE); w.document.close(); }
    catch (e) { w.location.href = URL.createObjectURL(new Blob([PAGE_SOURCE], { type: 'text/html' })); }
  };
})();
window.surLangue = () => afficher();   // FR/EN switch: grid, dates and rules in the new language
charger();
if (CONFIG.url) setInterval(() => { if (!document.hidden && !S.envoi) charger(); }, CONFIG.rafraichir * 60000);   // the script caches 2 min
