  LEGENDE = h;
}
let LEGENDE = '';
document.getElementById('bLeg').onclick = e => ouvrirPop({ c: 'var(--accent)', html: '<h3>Légende</h3><div class="legend">' + LEGENDE + '</div>' }, e.currentTarget);

// « congé à venir » is announced as long before it starts as it lasts (a 6-month leave shows 6 months ahead),
// at least CONFIG.avis.minMois, at most maxMois; a leave with no end date: sansFinMois.
function congeAnnonce(debut, fin) {
  if (!debut) return true;
  const n = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5;
  const x = new Date(), auj = Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()) / 864e5;
  const M = 30.44, A = CONFIG.avis;
  const avis = fin ? Math.min(A.maxMois * M, Math.max(A.minMois * M, n(fin) - n(debut) + 1)) : A.sansFinMois * M;
  return n(debut) - auj <= avis;
}

// one person chosen: say which 5-4 team the grey comes from (or why there is none)
function cycleInfo() {
  if (!S.who) return '';
  const w = S.who.toUpperCase();
  let t;
  if (S.cyclesErr) t = `cycle 5-4 : ${S.cyclesErr}`;
  else if (!S.cycles) t = 'cycle 5-4 : chargement…';
  else if (S.cycles.eq[w]) {
    const aujd = new Date(), jl = d => fmt(d, { day: 'numeric', month: 'long' });
    const a = `${aujd.getFullYear()}-${String(aujd.getMonth() + 1).padStart(2, '0')}-${String(aujd.getDate()).padStart(2, '0')}`;
    const mes = (S.cycles.conges || []).filter(c => c[0] === w && (!c[2] || c[2] >= a));
    const cur = mes.find(c => !c[1] || c[1] <= a), proch = mes.filter(c => c[1] > a && congeAnnonce(c[1], c[2])).sort((x, y) => (x[1] < y[1] ? -1 : 1))[0];
    const quoi = c => (c[3] && c[3] !== 'Congé prolongé' ? ' : ' + esc(c[3].toLowerCase()) : '');
    t = `cycle 5-4 : équipe ${S.cycles.eq[w]}` + (cur ? ` (en congé${quoi(cur)}${cur[2] ? ` jusqu'au ${jl(cur[2])}` : ''})`
      : proch ? ` (congé à venir ${proch[2] ? `du ${jl(proch[1])} au ${jl(proch[2])}` : `dès le ${jl(proch[1])}`})` : '');
  }
  else t = `${esc(w)} absent de la liste Cycles 5-4`;
  return ` · ${t}`;
}

// « 15 nov. à 10 h 47 » from 'yyyy-MM-dd HH:mm'
const quandESS = s => fmt(s.slice(0, 10), { day: 'numeric', month: 'short' }) + (s.length >= 16 ? ` à ${+s.slice(11, 13)} h ${s.slice(14, 16)}` : '');
function statut() {
  const s = document.getElementById('status'), d = S.data;
  if (!d) return;
  const pub = d.horizon ? ` · horaire publié jusqu'au ${fmt(d.horizon, { day: 'numeric', month: 'long' })}` : '';
  s.innerHTML = (S.demo ? '<span class="demo">Données d\'exemple (initiales fictives) — ajoutez le lien dans CONFIG.url.</span> ' : '') +
    // last update = when the last ESS update reached the site (d.essVu), not our last check (d.at)
    (d.ess && d.essVu ? `<b><span class="lg">Dernière mise à jour</span><span class="ct">Mise à jour</span> : ${esc(quandESS(d.essVu))}</b>` +
             `<span class="det"> (publiée par ESS à ${esc(heureDe(d.ess, d.essVu))}) · vérifié ${esc(d.at ? quandESS(d.at) : '?')}</span>`
     : d.ess ? `<b><span class="lg">Dernière mise à jour ESS</span><span class="ct">Mise à jour ESS</span> : ${esc(quandESS(d.ess))}</b>` +
             `<span class="det"> · vérifié ${esc(d.at ? quandESS(d.at) : '?')}</span>`
           : `Mis à jour : ${esc(d.at || '?')}`) + pub + cycleInfo() + '<span class="tip"> · cliquez un quart pour voir les détails</span>' +
    ligneChangement(d);
  compteARebours();
}

/* Second line: the last real change to the schedule (an ESS update that changed someone's shifts or leaves,
   found by comparing with the previous one) and a countdown to when the next ESS update should be on the site.
   ESS updates the calendars 8 times a day (3 h 47, 4 h 47, 9 h 47, 10 h 47, 15 h 47, 16 h 47, 21 h 47, 22 h 47 in
   Nov. 2026); our hourly check brings it here about 40 min later. The times come from the server (d.plan),
   learned from what it has seen, so they follow ESS if it changes them. */
const minDe = s => Date.parse(s.slice(0, 10) + 'T' + s.slice(11, 16) + ':00Z') / 60000;   // clock minutes
const maintenant = () => { const n = nowLocal(); return n.d + ' ' + String(Math.floor(n.m / 60)).padStart(2, '0') + ':' + String(n.m % 60).padStart(2, '0'); };
const heureDe = (s, ref) => (s.slice(0, 10) === ref.slice(0, 10) ? '' : s.slice(0, 10) === addDays(ref.slice(0, 10), 1) ? 'demain ' : fmt(s.slice(0, 10), { day: 'numeric', month: 'short' }) + ' ') +
  `${+s.slice(11, 13)} h ${s.slice(14, 16)}`;
function ligneChangement(d) {
  if (!('chg' in d) && !d.plan) return '';
  let t = '';
  if ('chg' in d) {
    const qui = d.chgQui || [];
    t = d.chg
      ? `<span class="lg">Dernier changement à l'horaire</span><span class="ct">Dernier changement</span> : ` +
        (d.chgVu ? `<span title="Publié par ESS à ${esc(heureDe(d.chg, d.chgVu))}">${esc(quandESS(d.chgVu))}</span>`
                 : `<span class="lg">mise à jour ESS du </span>${esc(quandESS(d.chg))}`) +
        (qui.length ? ` <span title="${esc(qui.join(', '))}">(${qui.length <= 5 ? esc(qui.join(', ')) : qui.length + ' personnes'})</span>` : '')
      : `Dernier changement à l'horaire : aucun depuis le ${esc(quandESS(d.chgDepuis || d.at))}`;
  }
  return `<span class="ligne2">${t}${t ? ' · ' : ''}<span id="compte"></span></span>`;
}
// the next ESS update after the one we have, and when it should be on the site
function prochaineMaj() {
  const d = S.data; if (!d || !d.plan || !d.plan.length) return null;
  const base = d.ess || d.at || '';
  return d.plan.find(x => !base || minDe(x[0]) > minDe(base) + 20) || null;
}
function compteARebours() {
  const el = document.getElementById('compte'); if (!el) return;
  const p = prochaineMaj();
  if (!p) { el.innerHTML = ''; return; }
  const now = maintenant(), reste = minDe(p[1]) - minDe(now);
  const quand = `<span class="lg">Prochaine mise à jour ESS : ${esc(heureDe(p[0], now))}, sur le site vers ${esc(heureDe(p[1], p[0]))} — </span>`;
  if (reste > 0) {
    const h = Math.floor(reste / 60), m = reste % 60;
    el.innerHTML = quand + `<span class="ct">prochaine mise à jour </span>dans ${h ? h + ' h ' + String(m).padStart(2, '0') : m + ' min'}`;
  } else {
    el.innerHTML = quand.replace(' — </span>', ' : </span>') + (S.verifie === p[0] ? '<span class="lg">pas encore arrivée · </span>' : '<span class="lg">devrait être arrivée · </span>') +
      '<button class="rafr" id="rafr">Rafraîchir</button>';
  }
}
document.addEventListener('click', e => {
  if (e.target.id !== 'rafr') return;
  const p = prochaineMaj(); e.target.textContent = 'Rafraîchissement…'; S.verifie = p && p[0]; charger();
});
setInterval(compteARebours, 20000);

function aller(k) {
  if (S.vue === 'mois') S.cur = addMonths(S.cur, k);
  else S.cur = addDays(S.cur, S.vue === 'semaine' ? 7 * k : k);
  afficher();
}

document.getElementById('bPrev').onclick = () => aller(-1);
document.getElementById('bNext').onclick = () => aller(1);
document.getElementById('bToday').onclick = () => { S.cur = nowLocal().d; afficher(); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  S.vue = b.dataset.v; mem.set('vue', S.vue); statut(); afficher();
});
document.getElementById('who').onclick = e => ouvrirPop(popFiltre(), e.currentTarget);
document.getElementById('pop').addEventListener('change', e => {      // a box ticked in the people list
  if (!e.target.matches('.choix input')) return;
  const coches = [...document.querySelectorAll('#pop .choix input:checked')].map(i => i.dataset.w);
  choisir(coches, true);
});
document.getElementById('libres').onchange = e => { S.libres = e.target.checked; mem.set('libres', S.libres ? '1' : '0'); afficher(); };
document.getElementById('conges').onchange = e => { S.conges = e.target.checked; mem.set('conges', S.conges ? '1' : '0'); afficher(); };
document.getElementById('view').addEventListener('click', e => {
  const q = e.target.closest('[data-q]');
  if (q) { ouvrirPop(popQuart(S.qs[+q.dataset.q]), q); return; }
  const c = e.target.closest('[data-cg]');
  if (c) { const [w, j] = c.dataset.cg.split('|'); ouvrirPop(popConge(w, j), c); return; }
  const p = e.target.closest('[data-p]');
  if (p) { ouvrirPop(popPersonne(p.dataset.p), p); return; }
  const d = e.target.closest('[data-day]');
  if (d) { S.cur = d.dataset.day; S.vue = 'jour'; mem.set('vue', 'jour'); statut(); afficher(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fermerPop(); return; }
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') aller(-1);
  if (e.key === 'ArrowRight') aller(1);
});
// redraw only when the width changes (phones fire « resize » when the address bar hides,
// which would otherwise close the details window)
// Size changes. Wix sometimes creates the frame tiny (or hidden) while the page loads and only then gives
// it its real size — on a refresh, without always telling the frame. So the size is re-checked on every
// « resize », by a ResizeObserver, and once a second as a safety net; a new width redraws the calendar.
let resizeT, largeur = innerWidth, hauteur = innerHeight;
function verifierTaille() {
  if (innerWidth === largeur && innerHeight === hauteur) return;
  const largeurChange = innerWidth !== largeur;
  largeur = innerWidth; hauteur = innerHeight;
  ajusterTaille();
  if (largeurChange) { clearTimeout(resizeT); resizeT = setTimeout(afficher, 150); }
}
addEventListener('resize', verifierTaille);
try { new ResizeObserver(verifierTaille).observe(document.documentElement); } catch (e) { /* old browser */ }
setInterval(verifierTaille, 1000);

// Phones (less than 640 px wide):
//   'miniature' → lay the page out at CONFIG.largeurMini px, exactly as on a computer, then shrink it
//                 to the real width (CSS zoom). The details window stays full size (it is outside #app).
//   'compact'   → the phone layout (counts per day, tap a day to see it).
// « Phone » = a touch screen with no mouse. Not the screen size: on a computer with a big zoom or display
// scaling, the screen can measure under 640 px and the calendar wrongly shrank itself.
const estTelephone = () => matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
const zoomOK = (() => { try { return CSS.supports('zoom', '0.5'); } catch (e) { return false; } })();
// iPhone / iPad: Safari up to iOS 16 (e.g. iPhone 8) shrinks the boxes with CSS zoom but not the text, so the
// calendar is unreadable. There the page is shrunk with a transform (scale) instead: same look, every version.
const ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const parEchelle = () => CONFIG.reduction === 'echelle' || (CONFIG.reduction !== 'zoom' && ios) || !zoomOK;
// Phone-sized frame: under 640 px on a phone, or under 480 px on a computer (Wix's phone preview and
// phone editor are about 320–400 px wide), so the preview looks like the real phone.
const cadreTelephone = () => innerWidth < (estTelephone() ? 640 : 480);
function mini() { return CONFIG.telephone === 'miniature' && innerWidth > 0 && cadreTelephone(); }
// compact layout: phones set to 'compact', or a very narrow frame on a computer
function etroit() { return !mini() && cadreTelephone(); }
let majPlein = () => {};                 // shows/hides « Plein écran » (set up at the end of the page)
function ajusterTaille() {
  majPlein();
  // what the calendar measured, shown when hovering the « Mis à jour » line (to sort out display problems)
  document.getElementById('status').title = `Cadre ${innerWidth} × ${innerHeight} px · écran ${screen.width} × ${screen.height}` +
    ` · tactile seulement : ${estTelephone() ? 'oui' : 'non'} · affichage réduit : ${mini() ? (parEchelle() ? 'oui (échelle)' : 'oui (zoom)') : 'non'}` +
    ` · compact : ${etroit() ? 'oui' : 'non'}`;
  const app = document.getElementById('app');
  if (mini()) {
    const z = innerWidth / CONFIG.largeurMini;
    app.style.width = CONFIG.largeurMini + 'px';
    app.style.height = (innerHeight / z) + 'px';
    if (parEchelle()) {                          // scale the drawing (text included); the layout stays 760 px
      app.style.zoom = '';
      app.style.transformOrigin = '0 0';
      app.style.transform = `scale(${z})`;
    } else {
      app.style.transform = app.style.transformOrigin = '';
      app.style.zoom = z;
    }
  } else {
    app.style.width = app.style.height = app.style.zoom = app.style.transform = app.style.transformOrigin = '';
  }
  document.body.classList.toggle('etroit', etroit());
  document.getElementById('bLeg').hidden = !etroit();
}

/* =====================================================================================
   Cycles 5-4 — greys the days off of the people chosen, for any date (past or future)
   ===================================================================================== */
// Read from …/exec?type=equipe&quoi=cycles (the « Cycles 5-4 » tab of the Horaire file): start of the
// period (= day 1 of the 9-day cycle) and each person's team. Team k works cycle days k … k+4.
// People ticked « Congé prolongé » keep their grey too (their leave itself shows from their schedule).
// Approved leaves (« Congés » list): the one going on today → « congé … », else the next one → « congé à venir ».
// Loaded only when someone is chosen; reloaded every hour.
function chargerCycles() {
  if (S.cyclesEnCours) return;
  S.cyclesEnCours = true;

  const garder = (d, memoire) => {
    S.cyclesEnCours = false;
    if (!d || !d.debut || !Array.isArray(d.gens)) {
      if (!S.cycles) { S.cyclesErr = 'réponse inattendue' + (d && d.erreur ? ' (' + d.erreur + ')' : ''); statut(); }
      return;
    }
    if (!memoire) mem.set('cycles', JSON.stringify(d));   // next visit: shown instantly
    S.cyclesErr = '';
    S.cycles = { debut: d.debut, eq: Object.fromEntries(d.gens.map(g => [String(g[0]).trim().toUpperCase(), g[1]])),
                 prolonge: d.gens.filter(g => g[3]).map(g => String(g[0]).trim().toUpperCase()),
                 conges: (d.conges || []).map(c => [String(c[0]).trim().toUpperCase(), c[1] || '', c[2] || '', c[3] || '']) };
    setTimeout(() => { S.cycles = null; }, 3600000);
    statut(); afficher(true);
  };
  if (!S.cycles) {                                  // last answer seen: shown at once, then refreshed
    try { const m = JSON.parse(mem.get('cycles') || 'null'); if (m) { garder(m, true); S.cyclesEnCours = true; } } catch (e) { /* ignore */ }
  }
  if (!CONFIG.url) {                                // sample data: invented teams (once the sample is loaded)
    if (!S.data) { S.cyclesEnCours = false; return; }
    garder({ debut: nowLocal().d, gens: S.data.gens.map((w, i) => [w, i % 9 + 1, 0, 0]) }, true); return;
  }
  const u = CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&quoi=cycles';
  fetch(u, { credentials: 'omit', cache: 'no-store' }).then(r => r.json())
    .then(d => { if (!d || !d.gens) throw 0; garder(d); })
    .catch(() => {
      const cb = '__cycles' + Date.now(), sc = document.createElement('script');
      window[cb] = d => { delete window[cb]; sc.remove(); garder(d); };
      sc.onerror = () => { sc.remove(); S.cyclesEnCours = false; if (!S.cycles) { S.cyclesErr = 'chargement impossible'; statut(); } };
      sc.src = u + '&callback=' + cb; document.head.appendChild(sc);
    });
}
// Paid holidays: …/exec?type=equipe&quoi=feries (Setup D:E of the Admin. Worksheet). Read once per load.
function chargerFeries() {
  const garder = (d, memoire) => {
    if (!d || !Array.isArray(d.feries)) return;
    if (!memoire) mem.set('feries', JSON.stringify(d));
    S.feries = Object.fromEntries(d.feries);
    S.relache = Array.isArray(d.relache) ? d.relache : [];
    afficher(true);
  };
  try { const m = JSON.parse(mem.get('feries') || 'null'); if (m) garder(m, true); } catch (e) { /* ignore */ }
  if (!CONFIG.url) {                                // sample data
    const y = nowLocal().d.slice(0, 4);
    garder({ feries: [[`${y}-12-25`, 'Noël'], [`${y}-12-26`, 'Lendemain de Noël'], [`${+y + 1}-01-01`, "Jour de l'An"]],
             relache: [[`${+y + 1}-02-20`, `${+y + 1}-03-07`, 'CSS de Montréal, Laval (exemple)']] }); return;
  }
  const u = CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&quoi=feries';
  fetch(u, { credentials: 'omit' }).then(r => r.json())
    .then(d => { if (!d || !d.feries) throw 0; garder(d); })
    .catch(() => {
      const cb = '__feries' + Date.now(), sc = document.createElement('script');
      window[cb] = d => { delete window[cb]; sc.remove(); garder(d); };
      sc.onerror = () => sc.remove();
      sc.src = u + '&callback=' + cb; document.head.appendChild(sc);
    });
}
function congeCycle(w, d) {
  const c = S.cycles, k = c && c.eq[String(w).toUpperCase()];
  if (!k) return false;
  const n = Math.round((toUTC(d) - toUTC(c.debut)) / 864e5);
  const j = ((n % 9) + 9) % 9 + 1;                 // 1…9 in the cycle
  return ((j - k + 9) % 9) >= 5;
}

/* =====================================================================================
   Chargement (JSONP : une balise <script> vers l'application Web, pas de souci de CORS)
   ===================================================================================== */
function recevoir(d, demo) {
  S.data = d; S.demo = !!demo;
  indexer(d); remplirFiltre(); statut(); afficher();
}

// 1st try: a plain request WITHOUT the browser's Google sign-in (like a private window), so being
// signed into several Google accounts can't break it. If that fails, 2nd try: the older JSONP way.
function charger() {
  if (!CONFIG.url) { recevoir(demo(), true); return; }
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  fetch(CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&t=' + Date.now(),
        { credentials: 'omit', cache: 'no-store', signal: ctl.signal })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(txt => { const d = JSON.parse(txt); if (!d || !d.q) throw new Error('format'); clearTimeout(t); recevoir(d, false); })
    .catch(() => { clearTimeout(t); chargerJsonp(); });
}

function chargerJsonp() {
  const cb = '__horaireStl' + Date.now();
  const s = document.createElement('script');
  const fin = () => { delete window[cb]; s.remove(); clearTimeout(t); };
  const t = setTimeout(() => { fin(); erreur('le serveur ne répond pas'); }, 25000);
  window[cb] = d => { fin(); recevoir(d, false); };
  s.onerror = () => { fin(); erreur('lien inaccessible'); };
  s.src = CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&callback=' + cb;
  document.head.appendChild(s);
}

function erreur(why) {
  const st = document.getElementById('status');
  if (S.data) { st.innerHTML += ` · <span class="demo">mise à jour impossible (${esc(why)})</span>`; return; }
  st.textContent = '';
  document.getElementById('view').innerHTML = `<div class="msg">Impossible de charger l'horaire (${esc(why)}).<br>Réessayez dans quelques minutes.` +
    '<br><br><small>Si la page marche dans une fenêtre privée : désactivez votre bloqueur de pubs pour ce site, ' +
    'ou déconnectez vos autres comptes Google dans ce navigateur.</small></div>';
}

/* =====================================================================================
   Données d'exemple — initiales fictives (Q…), cycles 5-4, quelques OT, congés et trous
   ===================================================================================== */
function demo() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const today = nowLocal().d, from = addDays(today, -35), to = addDays(today, 45);
  const codes = ['0545', '0615', '0615', '1000', '1100', '1100', '1330', '1330', '1415', '1415', '1515', '2300', '2215', '0615'];
  const fins = { '0545': '1430', '0615': '1500', '1000': '1845', '1100': '1945', '1330': '2215',
                 '1415': '2300', '1515': '0000', '2300': '0745', '2215': '0700' };
  const gens = 'QA QB QC QD QE QF QG QH QJ QK QL QM QN QP QR QS QT QU QV QW QX QY'.split(' ');
  const q = {}, c = {}, libres = [];
  gens.forEach((w, i) => {
    q[w] = []; c[w] = [];
    for (let d = from, k = 0; d <= to; d = addDays(d, 1), k++) {
      const pos = (k + i * 2) % 9, bloc = Math.floor((k + i * 2) / 9);
      if (pos < 5) {
        if (rnd() < 0.05) { c[w].push(d); continue; }
        const a = codes[(i * 5 + bloc * 3) % codes.length];
        const autre = rnd() < 0.04, mixte = !autre && rnd() < 0.07, long = !autre && !mixte && rnd() < 0.05;
        if (long) { q[w].push(rnd() < 0.6 ? [d, '1900', '0700', 0] : [d, '0615', '1815', 0]); continue; }
        const sup = i % 7 === 3 ? 2 : 0;
        if (mixte) {                                   // part coverage, then admin (like DB)
          const mid = String((+a.slice(0, 2) + 4) % 24).padStart(2, '0') + a.slice(2);
          q[w].push([d, a, fins[a], sup | 4, 'Admin', [[a, mid, sup ? 1 : 0, sup ? 'Coverage (S)' : 'Coverage'], [mid, fins[a], 2, 'Admin']]]);
        } else {
          q[w].push(autre ? [d, a, fins[a], sup | 4, rnd() < 0.5 ? 'Nat Refresher' : 'Formation OJT']
                          : [d, a, fins[a], sup]);
        }
      } else if (rnd() < 0.06) {
        const a = ['0615', '1330', '1100'][Math.floor(rnd() * 3)];
        q[w].push([d, a, fins[a], 1]);
      }
    }
  });
  for (let d = today; d <= to; d = addDays(d, 1)) {
    if (rnd() < 0.45) libres.push([d, '0615', '1445', '615', rnd() < 0.3 ? 2 : 1]);
    if (rnd() < 0.3) libres.push([d, '1730', '2300', '', 1]);
  }
  const p = nowLocal(), hh = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  // ESS times of yesterday, today and tomorrow (3 h 47, 4 h 47, 9 h 47…), each on the site 39 min later
  const essH = [3, 4, 9, 10, 15, 16, 21, 22].map(h => h * 60 + 47);
  const tous = [addDays(p.d, -1), p.d, addDays(p.d, 1)].flatMap(d => essH.map(m => [d + ' ' + hh(m), (m + 39 >= 1440 ? addDays(d, 1) : d) + ' ' + hh((m + 39) % 1440)]));
  const ici = p.d + ' ' + hh(p.m), arrives = tous.filter(x => x[1] <= ici);
  const ess = arrives.length ? arrives[arrives.length - 1][0] : p.d + ' 03:47';
  const vu = x => x ? x[1].slice(0, 14) + String(+x[1].slice(14) - 5).padStart(2, '0') : '';   // our check ≈ 5 min before « on the site by »
  const ch = arrives.length > 2 ? arrives[arrives.length - 3] : arrives[arrives.length - 1];
  return { at: ici, ess, essVu: vu(arrives[arrives.length - 1]), chg: ch ? ch[0] : ess, chgVu: vu(ch), chgQui: ['QB', 'QM'], chgDepuis: addDays(p.d, -3) + ' 09:20',
    plan: tous.filter(x => x[0] > ici), horizon: to, gens, q, c, stag: ['QX', 'QY'], libres };
}

/* ===================================================================================== */
document.title = CONFIG.titre;
ajusterTaille();
// « Plein écran »: opens a new tab and writes this same page into it, so the calendar fills the whole
// screen. No web address is involved (Wix's own address for this frame makes Chrome warn « this site
// looks fake », and the Google web app page fails for people signed in to several Google accounts).
// Shown only inside the Wix frame (not in the full-screen tab itself), phones included: in 'miniature' the
// full-screen tab is wider than the Wix box, so the calendar is shrunk less; in 'compact' it is a small ⤢.
(() => {
  const b = document.getElementById('bPlein');
  let dansCadre = true;
  try { dansCadre = window.top !== window; } catch (e) { dansCadre = true; }
  if (!dansCadre) return;
  majPlein = () => { b.hidden = false; };   // also in 'miniature': the full-screen tab is wider, so less shrunk
  majPlein();
  b.onclick = () => {
    const w = window.open('', '_blank');
    if (!w) { b.textContent = 'Fenêtre bloquée par le navigateur'; return; }
    try {                                        // same origin: write the page straight into the tab
      w.document.open(); w.document.write(PAGE_SOURCE); w.document.close();
    } catch (e) {                                // sealed frame (Wix): hand the tab a copy of the page instead
      w.location.href = URL.createObjectURL(new Blob([PAGE_SOURCE], { type: 'text/html' }));
    }
  };
})();
legende();
remplirFiltre();
afficher();
charger();
chargerFeries();
chargerCycles();          // ready before anyone is chosen
if (CONFIG.rafraichirMin > 0) setInterval(charger, CONFIG.rafraichirMin * 60000);
</script>
</body>
</html>
