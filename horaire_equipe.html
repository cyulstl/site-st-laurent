});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { fermerPop(); return; }
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') aller(-1);
  if (e.key === 'ArrowRight') aller(1);
});
// redraw only when the width changes (phones fire « resize » when the address bar hides,
// which would otherwise close the details window)
// Size changes. Wix sometimes creates the frame tiny (or hidden) while the page loads and only then gives
// it its real size — on a refresh, without always telling the frame. So the size is re-checked on every
// « resize », by a ResizeObserver, and once a second as a safety net; a new width redraws the calendar.
let resizeT, largeur = innerWidth, hauteur = innerHeight;
function verifierTaille() {
  if (innerWidth === largeur && innerHeight === hauteur) return;
  const largeurChange = innerWidth !== largeur;
  largeur = innerWidth; hauteur = innerHeight;
  ajusterTaille();
  if (largeurChange) { clearTimeout(resizeT); resizeT = setTimeout(afficher, 150); }
}
addEventListener('resize', verifierTaille);
try { new ResizeObserver(verifierTaille).observe(document.documentElement); } catch (e) { /* old browser */ }
setInterval(verifierTaille, 1000);

// Phones (less than 640 px wide):
//   'miniature' → lay the page out at CONFIG.largeurMini px, exactly as on a computer, then shrink it
//                 to the real width (CSS zoom). The details window stays full size (it is outside #app).
//   'compact'   → the phone layout (counts per day, tap a day to see it).
// « Phone » = a touch screen with no mouse. Not the screen size: on a computer with a big zoom or display
// scaling, the screen can measure under 640 px and the calendar wrongly shrank itself.
const estTelephone = () => matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
const zoomOK = (() => { try { return CSS.supports('zoom', '0.5'); } catch (e) { return false; } })();
// iPhone / iPad: Safari up to iOS 16 (e.g. iPhone 8) shrinks the boxes with CSS zoom but not the text, so the
// calendar is unreadable. There the page is shrunk with a transform (scale) instead: same look, every version.
const ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const parEchelle = () => CONFIG.reduction === 'echelle' || (CONFIG.reduction !== 'zoom' && ios) || !zoomOK;
// Phone-sized frame: under 640 px on a phone, or under 480 px on a computer (Wix's phone preview and
// phone editor are about 320–400 px wide), so the preview looks like the real phone.
const cadreTelephone = () => innerWidth < (estTelephone() ? 640 : 480);
function mini() { return CONFIG.mode !== 'plan' && CONFIG.telephone === 'miniature' && innerWidth > 0 && cadreTelephone(); }   // the plan page: never shrunk
// compact layout: phones set to 'compact', or a very narrow frame on a computer
function etroit() { return !mini() && cadreTelephone(); }
let majPlein = () => {};                 // shows/hides « Plein écran » (set up at the end of the page)
function ajusterTaille() {
  majPlein();
  // what the calendar measured, shown when hovering the « Mis à jour » line (to sort out display problems)
  document.getElementById('status').title = `Cadre ${innerWidth} × ${innerHeight} px · écran ${screen.width} × ${screen.height}` +
    ` · tactile seulement : ${estTelephone() ? 'oui' : 'non'} · affichage réduit : ${mini() ? (parEchelle() ? 'oui (échelle)' : 'oui (zoom)') : 'non'}` +
    ` · compact : ${etroit() ? 'oui' : 'non'}`;
  const app = document.getElementById('app');
  if (mini()) {
    const z = innerWidth / CONFIG.largeurMini;
    app.style.width = CONFIG.largeurMini + 'px';
    app.style.height = (innerHeight / z) + 'px';
    if (parEchelle()) {                          // scale the drawing (text included); the layout stays 760 px
      app.style.zoom = '';
      app.style.transformOrigin = '0 0';
      app.style.transform = `scale(${z})`;
    } else {
      app.style.transform = app.style.transformOrigin = '';
      app.style.zoom = z;
    }
  } else {
    app.style.width = app.style.height = app.style.zoom = app.style.transform = app.style.transformOrigin = '';
  }
  document.body.classList.toggle('etroit', etroit());
  document.getElementById('bLeg').hidden = !etroit();
}

/* =====================================================================================
   Cycles 5-4 — greys the days off of the people chosen, for any date (past or future)
   ===================================================================================== */
// Read from …/exec?type=equipe&quoi=cycles (the « Cycles 5-4 » tab of the Horaire file): start of the
// period (= day 1 of the 9-day cycle) and each person's team. Team k works cycle days k … k+4.
// People ticked « Congé prolongé » keep their grey too (their leave itself shows from their schedule).
// Approved leaves (« Congés » list): the one going on today → « congé … », else the next one → « congé à venir ».
// Loaded only when someone is chosen; reloaded every hour.
function chargerCycles() {
  if (S.cyclesEnCours) return;
  S.cyclesEnCours = true;

  const garder = (d, memoire) => {
    S.cyclesEnCours = false;
    if (!d || !d.debut || !Array.isArray(d.gens)) {
      if (!S.cycles) { S.cyclesErr = 'réponse inattendue' + (d && d.erreur ? ' (' + d.erreur + ')' : ''); statut(); }
      return;
    }
    if (!memoire) mem.set('cycles', JSON.stringify(d));   // next visit: shown instantly
    S.cyclesErr = '';
    S.cycles = { debut: d.debut, eq: Object.fromEntries(d.gens.map(g => [String(g[0]).trim().toUpperCase(), g[1]])),
                 prolonge: d.gens.filter(g => g[3]).map(g => String(g[0]).trim().toUpperCase()),
                 conges: (d.conges || []).map(c => [String(c[0]).trim().toUpperCase(), c[1] || '', c[2] || '', c[3] || '']) };
    setTimeout(() => { S.cycles = null; }, 3600000);
    statut(); afficher(true);
  };
  if (!S.cycles) {                                  // last answer seen: shown at once, then refreshed
    try { const m = JSON.parse(mem.get('cycles') || 'null'); if (m) { garder(m, true); S.cyclesEnCours = true; } } catch (e) { /* ignore */ }
  }
  if (!CONFIG.url) {                                // sample data: invented teams (once the sample is loaded)
    if (!S.data) { S.cyclesEnCours = false; return; }
    garder({ debut: nowLocal().d, gens: S.data.gens.map((w, i) => [w, i % 9 + 1, 0, 0]) }, true); return;
  }
  const u = CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&quoi=cycles';
  fetch(u, { credentials: 'omit', cache: 'no-store' }).then(r => r.json())
    .then(d => { if (!d || !d.gens) throw 0; garder(d); })
    .catch(() => {
      const cb = '__cycles' + Date.now(), sc = document.createElement('script');
      window[cb] = d => { delete window[cb]; sc.remove(); garder(d); };
      sc.onerror = () => { sc.remove(); S.cyclesEnCours = false; if (!S.cycles) { S.cyclesErr = 'chargement impossible'; statut(); } };
      sc.src = u + '&callback=' + cb; document.head.appendChild(sc);
    });
}
// Paid holidays: …/exec?type=equipe&quoi=feries (Setup D:E of the Admin. Worksheet). Read once per load.
function chargerFeries() {
  const garder = (d, memoire) => {
    if (!d || !Array.isArray(d.feries)) return;
    if (!memoire) mem.set('feries', JSON.stringify(d));
    S.feries = Object.fromEntries(d.feries);
    S.relache = Array.isArray(d.relache) ? d.relache : [];
    afficher(true);
  };
  try { const m = JSON.parse(mem.get('feries') || 'null'); if (m) garder(m, true); } catch (e) { /* ignore */ }
  if (!CONFIG.url) {                                // sample data
    const y = nowLocal().d.slice(0, 4);
    garder({ feries: [[`${y}-12-25`, 'Noël'], [`${y}-12-26`, 'Lendemain de Noël'], [`${+y + 1}-01-01`, "Jour de l'An"]],
             relache: [[`${+y + 1}-02-20`, `${+y + 1}-03-07`, 'CSS de Montréal, Laval (exemple)']] }); return;
  }
  const u = CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&quoi=feries';
  fetch(u, { credentials: 'omit' }).then(r => r.json())
    .then(d => { if (!d || !d.feries) throw 0; garder(d); })
    .catch(() => {
      const cb = '__feries' + Date.now(), sc = document.createElement('script');
      window[cb] = d => { delete window[cb]; sc.remove(); garder(d); };
      sc.onerror = () => sc.remove();
      sc.src = u + '&callback=' + cb; document.head.appendChild(sc);
    });
}
function congeCycle(w, d) {
  const c = S.cycles, k = c && c.eq[String(w).toUpperCase()];
  if (!k) return false;
  const n = Math.round((toUTC(d) - toUTC(c.debut)) / 864e5);
  const j = ((n % 9) + 9) % 9 + 1;                 // 1…9 in the cycle
  return ((j - k + 9) % 9) >= 5;
}

   Chargement (JSONP : une balise <script> vers l'application Web, pas de souci de CORS)

function recevoir(d, demo) {
  S.data = d; S.demo = !!demo;
  indexer(d); remplirFiltre(); statut(); afficher();
}

// 1st try: a plain request WITHOUT the browser's Google sign-in (like a private window), so being
// signed into several Google accounts can't break it. If that fails, 2nd try: the older JSONP way.
function charger() {
  if (!CONFIG.url) { recevoir(demo(), true); return; }
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  fetch(CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&t=' + Date.now(),
        { credentials: 'omit', cache: 'no-store', signal: ctl.signal })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(txt => { const d = JSON.parse(txt); if (!d || !d.q) throw new Error('format'); clearTimeout(t); recevoir(d, false); })
    .catch(() => { clearTimeout(t); chargerJsonp(); });
}

function chargerJsonp() {
  const cb = '__horaireStl' + Date.now();
  const s = document.createElement('script');
  const fin = () => { delete window[cb]; s.remove(); clearTimeout(t); };
  const t = setTimeout(() => { fin(); erreur('le serveur ne répond pas'); }, 25000);
  window[cb] = d => { fin(); recevoir(d, false); };
  s.onerror = () => { fin(); erreur('lien inaccessible'); };
  s.src = CONFIG.url + (CONFIG.url.indexOf('?') < 0 ? '?' : '&') + 'type=equipe&callback=' + cb;
  document.head.appendChild(s);
}

function erreur(why) {
  const st = document.getElementById('status');
  if (S.data) { st.innerHTML += ` · <span class="demo">mise à jour impossible (${esc(why)})</span>`; return; }
  st.textContent = '';
  document.getElementById('view').innerHTML = `<div class="msg">Impossible de charger l'horaire (${esc(why)}).<br>Réessayez dans quelques minutes.` +
    '<br><br><small>Si la page marche dans une fenêtre privée : désactivez votre bloqueur de pubs pour ce site, ' +
    'ou déconnectez vos autres comptes Google dans ce navigateur.</small></div>';
}

   Plan du jour : qui est assis quand (moteur testé à part, tests/t_plan_jour.js)

/* PLAN-MOTEUR-DEBUT */
// Plan of the Day engine: who sits when, for one operational day (first morning arrival → next morning).
// people: [{ i, s, e, ot }] — s/e = shift start/end in minutes from the day's 00:00 (a night shift that starts after
// midnight: 1440 + …). Returns { lignes: [[minute, [initials…], note]], … } — a line each time the sitters change.
const PLAN = Object.assign({
  pas: 15,                 // time step (min)
  finAvant: 45,            // stop sitting this long before the end of a regular shift
  finAvantOT: 30,          // … of an OT shift
  sieste: 60,              // ideal sit and ideal break: 1 h on, 1 h off
  minSit: 30,              // never start a sit with less than this left before going home
  minSitHeure: 45,         // on the hour, someone with less than this left sits only if nobody else can (the 13:30s
                           // finish at 21:00, they don't start a half hour at 21:00)
  resteNuit: 60,           // when the night starts (22:15), the evening sitters who leave within this get up
  finCloser: 1410,         // the closer (the 1515, or anyone staying until 23:30 or later) sits the last part with the night:
                           // from the hour before the night starts (22:00) until about 23:00; kept off the hour before
  maxPos: 5,
  minPos: [[0, 1], [600, 2], [1140, 1]],   // fewest positions by time of day [from (min), minimum]; the night is 1
  nuitDe: 1260,            // a shift starting from 21:00 is a night shift
  coupureNuit: 120,        // with 2 night people: the first sits until 02:00, the second after
  nuitTot: 1680,           // a shift that starts earlier but ends after 04:00 the next morning is a night too (early
                           // arrival, e.g. 18:30-06:30): evening sits until the night starts, then the night's last turn
  debutNuit: 1335,         // when the night position starts if nobody starts a night shift (22:15)
  finAvantFen: 30,
  maxAssis: 90,            // never more than 1 h 30 in a row (2 h: never); if nobody else, one position fewer         // stop sitting this long before leaving the floor during the shift (leave, training…)
}, CONFIG.plan || {});

function planJour(gens, cfg) {
  const C = Object.assign({}, PLAN, cfg || {});
  const P0 = gens.map(g => {
    const fin = g.e - (g.ot ? C.finAvantOT : C.finAvant);
    // a coverage window that ends before the shift (leave, training after it): off the floor 30 min before
    const blocs = (g.fen && g.fen.length ? g.fen : [[g.s, g.e]])
      .map(([a, b]) => [a, Math.min(b < g.e ? b - C.finAvantFen : b, fin)]).filter(([a, b]) => b > a);
    return Object.assign({}, g, { fin, blocs, nuit: g.s >= C.nuitDe });
  }).filter(p => p.blocs.length);
  // early nights (18:30-06:30…): an evening part in the day rotation until the night starts, then a night part that
  // takes the night's last turn (sleep, then 02:00 → morning); the regular night shifts keep the first turns
  const vraies = P0.filter(p => p.nuit);
  const debutNuit = vraies.length ? Math.min(...vraies.map(p => p.s)) : C.debutNuit;
  const P = [];
  P0.forEach(p => {
    if (p.nuit || p.e < C.nuitTot) { P.push(p); return; }
    if (debutNuit - p.s >= C.minSit) P.push(Object.assign({}, p, { fin: debutNuit, blocs: [[p.s, debutNuit]], soir: true }));
    P.push(Object.assign({}, p, { nuit: true, tot: true, depart: debutNuit }));
  });
  const tri = (a, b) => a.s - b.s || (a.i < b.i ? -1 : 1);
  // supervisors (sup) sit only if needed: to keep the minimum of positions (or the night, if no controller)
  const sups = P.filter(p => p.sup && !p.nuit).sort(tri);
  const jour = P.filter(p => !p.nuit && !p.sup).sort(tri);
  const nuit = (P.some(p => p.nuit && !p.sup) ? P.filter(p => p.nuit && !p.sup) : P.filter(p => p.nuit))
    .sort((a, b) => (a.tot ? 1 : 0) - (b.tot ? 1 : 0) || tri(a, b));
  const debN = p => p.tot ? p.depart : p.s;          // when a night person can start the night position
  if (!jour.length && !nuit.length) return [];
  const t0 = jour.length ? jour[0].s : nuit[0].s, matin = t0 + 1440;
  // the night: one position, shared in turns (2 people: 22:15 → 02:00, then 02:00 → morning)
  const tranches = [];
  if (nuit.length === 1) tranches.push([nuit[0], debN(nuit[0]), matin]);
  else if (nuit.length >= 2) {
    const fin1 = nuit.length === 2 ? 1440 + C.coupureNuit : null, d = Math.max(debN(nuit[1]), debN(nuit[0]));
    const bornes = [debN(nuit[0])];
    if (fin1) bornes.push(fin1);
    else for (let x = 1; x < nuit.length; x++) bornes.push(d + Math.round(x * (matin - d) / nuit.length / 30) * 30);
    bornes.push(matin);
    nuit.forEach((p, x) => tranches.push([p, bornes[x], bornes[x + 1]]));
  }
  const nuitAssis = t => tranches.filter(([, a, b]) => t >= a && t < b).map(([p]) => p);
  // closers: day shifts that end at midnight or later; heureFerm = the hour mark just before the night starts (22:00)
  const heureFerm = tranches.length ? Math.floor((tranches[0][1] - 1) / 60) * 60 : null;
  const closer = p => heureFerm != null && !p.nuit && !p.sup && !p.soir && p.e >= C.finCloser;
  const minPos = t => { let v = 1; for (const [de, x] of C.minPos) if ((t % 1440) >= de) v = x; return v; };
  // day: step by step (every 15 min); sitters change only for a reason:
  //  R1 someone must go home → replaced; R2 fewer positions than the minimum → filled;
  //  R3 on the hour: 1 h on / 1 h off rotation, and the number of positions follows who is there;
  //  R4 short of staff (more positions than half the people): whoever has rested 45 min (30 if really short)
  //     replaces whoever has sat the longest, as soon as that one has sat an hour — at any quarter hour;
  //  R5 the first relief of the morning: the positions open from the first arrival (05:45), and each one who
  //     arrives in the first hour (06:15) relieves someone who has sat 30 min.
  const st = new Map([...jour, ...sups].map(p => [p, { on: false, depuis: p.s, neuf: true }]));
  const finJour = jour.length || sups.length ? Math.max(...[...jour, ...sups].map(p => p.blocs[p.blocs.length - 1][1])) : t0;
  const lignes = [];
  let assisMin = 0, dispoMin = 0, Pt = 0;
  const assisTot = new Map();
  for (let t = t0; t < Math.max(finJour, nuit.length ? matin : 0); t += C.pas) {
    const heure = t % 60 === 0;
    const bloc = p => p.blocs.find(([a, b]) => t >= a && t < b), reste = p => { const b = bloc(p); return b ? b[1] - t : 0; };
    // supervisors join the rotation only when the controllers alone can't keep the minimum (with one on a break);
    // even then, a controller is always chosen first
    const ctrl = jour.filter(p => bloc(p));
    const miniJ = Math.max(0, minPos(t) - (t < finJour ? nuitAssis(t).length : 0));
    const besoinSup = sups.some(p => bloc(p)) && miniJ > (ctrl.length >= 2 ? ctrl.length - 1 : ctrl.length);
    const dispo = besoinSup ? [...ctrl, ...sups.filter(p => bloc(p))] : ctrl;
    const on = () => [...jour, ...sups].filter(p => st.get(p).on);
    const assis = p => t - st.get(p).depuis, repos = p => (st.get(p).neuf ? 1e9 : t - st.get(p).depuis);
    const court45 = p => heure && (reste(p) < C.minSitHeure || (closer(p) && t === heureFerm - 60)) ? 1 : 0;
    const debout = () => dispo.filter(p => !st.get(p).on && reste(p) >= C.minSit).sort((a, b) => (a.sup ? 1 : 0) - (b.sup ? 1 : 0) || court45(a) - court45(b) || repos(b) - repos(a) || a.fin - b.fin);
    // serie = start of the current unbroken sit (getting up and sitting again in the same minute doesn't break it)
    const lever = p => st.set(p, { on: false, depuis: t, serie: st.get(p).serie, leveA: t });
    const asseoir = p => { const o = st.get(p); st.set(p, { on: true, depuis: t, neuf: false, serie: o.leveA === t && o.serie != null ? o.serie : t }); };
    const serie = p => t - (st.get(p).serie != null ? st.get(p).serie : t);
    const plusLong = () => on().sort((a, b) => (b.sup ? 1 : 0) - (a.sup ? 1 : 0) || assis(b) - assis(a));
    if (!besoinSup) sups.forEach(p => { if (st.get(p).on && (!bloc(p) || (heure && !st.get(p).releve))) st.set(p, { on: false, depuis: t }); });
    const n = dispo.length, nn = t < finJour ? nuitAssis(t).length : 0, mini = Math.max(0, minPos(t) - nn);
    // R1 (and at the start of the night: the evening sitters who leave within the hour get up, the night takes over)
    const debutTranche = tranches.length && t === tranches[0][1];
    [...jour, ...sups].forEach(p => { if (st.get(p).on && (!bloc(p) || (debutTranche && reste(p) < C.resteNuit))) lever(p); });
    // positions: half of those here (kept near 50 % over the day), between the minimum and the maximum, and never
    // everyone at once when 2 or more are here (one must be on a break for the others to rotate)
    // (not again in the first hour: the 05:45 positions stay until the 06:15 relieve them, R5)
    if ((heure && t - t0 >= 60) || on().length > n || t === t0) {
      let c = dispoMin && assisMin / dispoMin > 0.5 ? Math.floor(n / 2) : Math.ceil(n / 2);
      c = Math.min(C.maxPos - nn, Math.max(mini, c));
      if (n >= 2) c = Math.min(c, n - 1);
      Pt = Math.max(nn ? 0 : Math.min(1, n), Math.min(c, n));
    }
    // short of staff: more positions than half the people, forced by the minimum (or the maximum of positions)
    const court = Pt > n / 2 && (mini > Math.floor(n / 2) || Pt > Math.ceil(n / 2)), pause = !court ? C.sieste : n / Pt >= 1.5 ? 45 : 30;
    // R3 (on the hour) / R4 (short, any quarter hour)
    if (heure) {
      // everyone who has sat 45 min or more gets up; the seats are then filled by the most rested
      // (someone who just got up sits again only if nobody else can)
      // (at 22:00, someone with 15 min or less left who has sat an hour or less finishes the sit until the night takes
      // over: the 1415 sits 21:00-22:15)
      const leves = plusLong().filter(x => (assis(x) >= C.sieste - 15 || reste(x) < C.minSit) &&
        !(t === heureFerm && reste(x) <= C.pas && assis(x) <= C.sieste));
      leves.forEach(lever);
      // someone who would reach 1 h 30 by the next hour (sat since the half hour) gets up too, if someone rested
      // can take the seat (13:30-14:00, then off: like the real plans)
      const reposes = debout().filter(x => !leves.includes(x) && repos(x) >= C.sieste - 15 && !(closer(x) && t === heureFerm - 60));
      plusLong().filter(x => !x.sup && serie(x) + C.sieste >= C.maxAssis && !(t === heureFerm && reste(x) <= C.pas))
        .slice(0, reposes.length).forEach(x => { lever(x); leves.push(x); });
      // the closer takes a seat for the last stretch (22:00 → about 23:00, with the night from 22:15)
      // (one closer: the most rested, as an extra seat; none if one is already on)
      if (t === heureFerm && !on().some(closer)) dispo.filter(x => closer(x) && !st.get(x).on && reste(x) >= C.minSit && !leves.includes(x) && repos(x) >= 30)
        .sort((a, b) => repos(b) - repos(a)).slice(0, 1).forEach(x => { asseoir(x); Pt = Math.max(Pt, on().length); });
      while (on().length > Pt) lever(plusLong()[0]);
      const tot = p => assisTot.get(p) || 0;
      // (if nobody has rested 45 min: someone who has had 30 min — short-staffed breaks — never someone who just
      // sat: no 2 h sits; with nobody at all, one position fewer)
      while (on().length < Pt) {
        const libre = x => !leves.includes(x) && !(closer(x) && t === heureFerm - 60 && on().length >= mini);
        const c = debout().find(x => libre(x) && !court45(x) && repos(x) >= Math.min(pause, C.sieste - 15))
          || debout().find(x => libre(x) && repos(x) >= Math.min(pause, C.sieste - 15))
          || debout().find(x => libre(x) && repos(x) >= 30);
        if (!c) break; asseoir(c);
      }
    } else if (court) {
      for (const c of debout().filter(x => repos(x) >= pause)) {
        const p = plusLong()[0]; if (!p || assis(p) < C.sieste) break; lever(p); asseoir(c);
      }
    }
    // the cap: anyone who has sat 1 h 30 gets up, replaced by the most rested who has had 30 min or more
    // (no controller free: a supervisor takes the seat until the next hour — supervisors sit when needed)
    on().filter(p => serie(p) >= C.maxAssis).forEach(p => {
      const c = debout().find(x => x !== p && repos(x) >= 30) ||
        sups.filter(x => x !== p && bloc(x) && !st.get(x).on && repos(x) >= 30).sort((a, b) => repos(b) - repos(a))[0];
      // nobody to take over: they get up anyway if someone else stays seated (1 position for a bit — critical — rather than 2 h)
      if (!c) { if (on().length - 1 + nn >= 1) lever(p); return; }
      lever(p); asseoir(c); if (c.sup && !dispo.includes(c)) st.get(c).releve = true;
    });
    // R2 (and the hour's new positions); never nobody while someone is here (even with less than 30 min left)
    // (someone who just got up sits again only for the minimum, and only for a short while: 1 h 30 at most)
    // (the closer stays free the hour before his stretch, unless needed for the minimum)
    while (on().length < Pt && (heure || t === t0 || on().length < mini || (!on().length && !nn))) {
      const c = debout().find(x => st.get(x).leveA !== t && !(closer(x) && t === heureFerm - 60)) ||
        (on().length < mini || (!on().length && !nn) ? debout().find(x => serie(x) + 30 <= C.maxAssis) : null);
      if (!c) break; asseoir(c); }
    if (!on().length && !nn && dispo.length) asseoir(dispo.slice().sort((a, b) => reste(b) - reste(a))[0]);
    // R6 the half-hour switch (13:30): someone who would have to leave at :45 gets up at :30, and their seat goes
    // to whoever can't do another full hour (their last sit: 06:15 → 13:30-14:00), otherwise to the most rested
    if (!heure && t % 30 === 0) on().filter(p => reste(p) < C.minSit).forEach(p => {
      const L = debout().filter(x => repos(x) >= 30);
      const c = L.filter(x => reste(x) < C.sieste + 30).sort((a, b) => reste(a) - reste(b))[0] || L[0];
      if (c) { lever(p); asseoir(c); }
    });
    // R5
    if (!heure && t > t0 && t - t0 <= 60) {
      const arr = dispo.filter(x => x.s === t && !st.get(x).on);
      for (const p of plusLong().filter(x => assis(x) >= 30)) { const c = arr.shift(); if (!c) break; lever(p); asseoir(c); }
    }
    [...jour, ...sups].forEach(p => { const s = st.get(p); if (s.neuf && !s.on && t >= p.s && t - p.s >= C.sieste) s.neuf = false; });
    assisMin += on().length * C.pas; dispoMin += n * C.pas;
    on().forEach(p => assisTot.set(p, (assisTot.get(p) || 0) + C.pas));
    const qui = [...on(), ...nuitAssis(t)].map(p => p.i + (p.sup ? ' (S)' : ''));
    const note = t < finJour && qui.length < minPos(t) ? 'court' : '';
    const cle = qui.slice().sort().join(' ') + note;
    if (!lignes.length || lignes[lignes.length - 1][3] !== cle) lignes.push([t, qui, note, cle]);
  }
  return lignes.map(([t, qui, note]) => [t, qui, note]);
}
/* PLAN-MOTEUR-FIN */
/* PLAN-COTES-DEBUT */
// Plan du jour — version « côtés » (brouillon, testée en parallèle du moteur actuel, moteur.js).
// Comme les vrais plans : deux côtés qui alternent d'heure en heure, et chacun reste sur son côté.
//   côté X : ouverture 05:45-06:15, les heures impaires (07, 09, 11), 13:00-13:30, puis les heures paires dès 14:00
//            (14, 16, 18, 20) et, pour le closer (1515), 22:00-23:00 avec la nuit ;
//   côté Y : 06:15-07:00, les heures paires (08, 10, 12), 13:30-14:00, puis les heures impaires dès 15:00
//            (15, 17, 19) et 21:00-22:15.
// La bascule de 13:00-13:30 / 13:30-14:00 est le « flip » habituel : un 1100 (X) fait 13:00-13:30 puis 14:00-15:00.
// Chaque arrivée va du côté le moins chargé (ceux qui restent encore au moins 2 h) ; les 05:45 ouvrent sur X, les
// 06:15 sur Y. Un côté qui tombe sous le minimum emprunte le plus reposé de l'autre côté (un flip, rarement).
// Quelqu'un qui doit partir en plein tour est remplacé par le plus reposé de l'autre côté (« YH/GA »).
// Quelqu'un qui arrive en cours d'heure et dont le côté ne s'assoit pas avant plus d'une heure s'assoit tout de suite pour
// le reste de l'heure (pas 1 h 30 de pause en commençant un quart, en OT surtout).
// Un superviseur peut compléter le nombre de positions voulu quand le monde manque : il est noté entre parenthèses,
// « (XV) » = optionnel, selon le trafic sur le moment.
// Jamais plus de 1 h 30 assis d'affilée (2 h : jamais), et 1 h 30 seulement si rien d'autre ne marche ; s'il manque
// quelqu'un, on prend une personne qui a eu au moins 30 min de pause, sinon il y a une position de moins (« court »).
// Pas de longues pauses non plus : quelqu'un qui resterait plus de 1 h 30 sans s'asseoir (entre deux tours, en arrivant
// ou avant de partir) s'assoit tout de suite — une position de plus, jusqu'à 5 ; s'il est de l'autre côté, il change de côté.
// La nuit, les nuits qui entrent tôt et le superviseur pour le minimum : mêmes règles que moteur.js.
const COTES = Object.assign({}, PLAN, {
  grille: [[345, 375, 'X'], [375, 420, 'Y'], [420, 480, 'X'], [480, 540, 'Y'], [540, 600, 'X'], [600, 660, 'Y'],
    [660, 720, 'X'], [720, 780, 'Y'], [780, 810, 'X'], [810, 840, 'Y'], [840, 900, 'X'], [900, 960, 'Y'],
    [960, 1020, 'X'], [1020, 1080, 'Y'], [1080, 1140, 'X'], [1140, 1200, 'Y'], [1200, 1260, 'X'], [1260, 1335, 'Y']],
  closer: [1320, 1380],    // the closer's slot (side X), with the night from 22:15
  resteCote: 180,          // a side's load = its members who stay at least this long after the arrival
  reposFlip: 30,           // someone borrowed from the other side has rested at least this long (else: a 2 h sit)
  // positions wanted by time of day (from the real plans): 2 at the opening, 3 from 07:00, 4 from 12:00,
  // 3 from 19:00; never more than half of those here (rounded up), never fewer than the minimum
  voulu: [[0, 1], [345, 2], [420, 3], [720, 4], [1140, 3], [1335, 1]],
  supJusqua: 3,
  maxAssis: 90,            // never more than 1 h 30 in a row (2 h: never); 1 h 30 only if nothing else works            // a supervisor tops up the positions only up to 3 (never 2 positions when 3 are wanted)
  maxPause: 90,            // no long breaks either: someone who would rest more than 1 h 30 sits now (an extra position, up to 5)
});

function planCotes(gens, cfg) {

      `${p.sup ? '(S) ' : ''}<span class="hr">${p.ot ? '$' : ''}${hm(p.a)}</span></label>`).join('')}</div>` +
    (hors.length ? `<div class="plan-hors">${T('Pas comptés :')} ${hors.map(([w, r]) => `${esc(w)} (${esc(T(r))})`).join(', ')}</div>` : '') +
    `<div class="plan-aide">${nb} personne${nb > 1 ? 's' : ''} comptée${nb > 1 ? 's' : ''} · décoche quelqu'un qui ne sera pas là. Superviseurs (S) : assis seulement s'il le faut pour garder le minimum de positions. Assis jusqu'à 45 min avant la fin du quart (30 en OT), ` +
    `1 h assis / 1 h de pause, pauses de 45 puis 30 min quand il manque du monde ; la nuit, 1 position (22 h 15 jusqu'à 2 h, puis 23 h). ` +
    `Touchez une personne pour voir ses tours. Le texte (onglet Texte) se modifie avant de copier.` +
    (S.planMoteur === 'cotes' ? ` <b>Version 2</b> : deux côtés qui alternent d'heure en heure comme sur les vrais plans (05:45 et heures impaires / 06:15 et heures paires, ` +
      `bascule 13:00-13:30 / 13:30-14:00), chacun reste sur son côté ; on change quelqu'un de côté seulement s'il manque une position. ` +
      `Quelqu'un qui arrive en cours d'heure s'assoit tout de suite plutôt que d'attendre plus d'une heure. ` +
      `Pas de longues pauses : quelqu'un qui resterait plus de 1 h 30 sans s'asseoir s'assoit (une position de plus, jusqu'à 5). Entre parenthèses, « (XV) » : optionnel, selon le trafic (un superviseur qui aide pour garder 3 positions).` : '') + `</div>`;
  return html;
}
// (the calendar no longer has a « Plan du jour » button: the plan has its own page, plan.html)
const clicPlan = e => {
  const b = e.target.closest('[data-plan]'); if (!b) return;
  const a = b.dataset.plan, day = S.planJour;
  if (a === 'prec' || a === 'suiv') { S.planJour = addDays(day, a === 'prec' ? -1 : 1); ouvrirPlan(); }
  else if (a === 'vue') { S.planVue = b.dataset.v; try { localStorage.setItem('planVue', S.planVue); } catch (x) { /* not kept */ } ouvrirPlan(); }
  else if (a === 'moi') { S.planMoi = S.planMoi === b.dataset.i ? null : b.dataset.i; document.getElementById('planVue').innerHTML = vueDuPlan(day); }
  else if (a === 'mot') { S.planMoteur = b.dataset.v; try { localStorage.setItem('planMoteur', S.planMoteur); } catch (x) { /* not kept */ } ouvrirPlan(); }
  else if (a === 'qui') {
    const l = new Set(S.planSans[day] || []); if (b.checked) l.delete(b.value); else l.add(b.value);
    S.planSans[day] = [...l]; document.getElementById('planVue').innerHTML = vueDuPlan(day);
  } else if (a === 'copier') {
    // the text tab's text (edited or not); from the other tabs, the plan's text
    let t = document.getElementById('planTxt'), tmp = null;
    if (!t) { tmp = t = document.createElement('textarea'); t.value = texteDuPlan(day); t.style.cssText = 'position:absolute;left:-9999px'; document.body.appendChild(t); }
    const ok = () => { document.getElementById('planCopie').textContent = 'Copié ✓'; if (tmp) tmp.remove(); };
    const vieux = () => { t.select(); try { document.execCommand('copy'); ok(); } catch (x) { document.getElementById('planCopie').textContent = 'Sélectionné : Ctrl+C'; if (tmp) tmp.remove(); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(ok, vieux); else vieux();
  }
};
document.getElementById('pop').addEventListener('click', clicPlan);
document.getElementById('view').addEventListener('click', e => { if (CONFIG.mode === 'plan') clicPlan(e); });
if (CONFIG.mode === 'plan') { document.body.classList.add('mode-plan'); document.title = 'Plan du jour — St-Laurent'; }

function demo() {
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const today = nowLocal().d, from = addDays(today, -35), to = addDays(today, 45);
  const codes = ['0545', '0615', '0615', '1000', '1100', '1100', '1330', '1330', '1415', '1415', '1515', '2300', '2215', '0615'];
  const fins = { '0545': '1430', '0615': '1500', '1000': '1845', '1100': '1945', '1330': '2215',
                 '1415': '2300', '1515': '0000', '2300': '0745', '2215': '0700' };
  const gens = 'QA QB QC QD QE QF QG QH QJ QK QL QM QN QP QR QS QT QU QV QW QX QY'.split(' ');
  const q = {}, c = {}, libres = [];
  gens.forEach((w, i) => {
    q[w] = []; c[w] = [];
    for (let d = from, k = 0; d <= to; d = addDays(d, 1), k++) {
      const pos = (k + i * 2) % 9, bloc = Math.floor((k + i * 2) / 9);
      if (pos < 5) {
        if (rnd() < 0.05) { c[w].push(d); continue; }
        const a = codes[(i * 5 + bloc * 3) % codes.length];
        const autre = rnd() < 0.04, mixte = !autre && rnd() < 0.07, long = !autre && !mixte && rnd() < 0.05;
        if (long) { q[w].push(rnd() < 0.6 ? [d, '1900', '0700', 0] : [d, '0615', '1815', 0]); continue; }
        const sup = i % 7 === 3 ? 2 : 0;
        if (mixte) {                                   // part coverage, then admin (like DB)
          const mid = String((+a.slice(0, 2) + 4) % 24).padStart(2, '0') + a.slice(2);
          q[w].push([d, a, fins[a], sup | 4, 'Admin', [[a, mid, sup ? 1 : 0, sup ? 'Coverage (S)' : 'Coverage'], [mid, fins[a], 2, 'Admin']]]);
        } else {
          q[w].push(autre ? [d, a, fins[a], sup | 4, rnd() < 0.5 ? 'Nat Refresher' : 'Formation OJT']
                          : [d, a, fins[a], sup]);
        }
      } else if (rnd() < 0.06) {
        const a = ['0615', '1330', '1100'][Math.floor(rnd() * 3)];
        q[w].push([d, a, fins[a], 1]);
      }
    }
  });
  for (let d = today; d <= to; d = addDays(d, 1)) {
    if (rnd() < 0.45) libres.push([d, '0615', '1445', '615', rnd() < 0.3 ? 2 : 1]);
    if (rnd() < 0.3) libres.push([d, '1730', '2300', '', 1]);
  }
  const p = nowLocal(), hh = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  // ESS times of yesterday, today and tomorrow (3 h 47, 4 h 47, 9 h 47…), each on the site 39 min later
  const essH = [3, 4, 9, 10, 15, 16, 21, 22].map(h => h * 60 + 47);
  const tous = [addDays(p.d, -1), p.d, addDays(p.d, 1)].flatMap(d => essH.map(m => [d + ' ' + hh(m), (m + 39 >= 1440 ? addDays(d, 1) : d) + ' ' + hh((m + 39) % 1440)]));
  const ici = p.d + ' ' + hh(p.m), arrives = tous.filter(x => x[1] <= ici);
  const ess = arrives.length ? arrives[arrives.length - 1][0] : p.d + ' 03:47';
  const vu = x => x ? x[1].slice(0, 14) + String(+x[1].slice(14) - 5).padStart(2, '0') : '';   // our check ≈ 5 min before « on the site by »
  const ch = arrives.length > 2 ? arrives[arrives.length - 3] : arrives[arrives.length - 1];
  return { at: ici, ess, essVu: vu(arrives[arrives.length - 1]), chg: ch ? ch[0] : ess, chgVu: vu(ch), chgQui: ['QB', 'QM'], chgDepuis: addDays(p.d, -3) + ' 09:20',
    plan: tous.filter(x => x[0] > ici), horizon: to, gens, q, c, stag: ['QX', 'QY'], libres };
}

// « Plein écran »: opens a new tab and writes this same page into it, so the calendar fills the whole
// screen. No web address is involved (Wix's own address for this frame makes Chrome warn « this site
// looks fake », and the Google web app page fails for people signed in to several Google accounts).
// Shown only inside the Wix frame (not in the full-screen tab itself), phones included: in 'miniature' the
// full-screen tab is wider than the Wix box, so the calendar is shrunk less; in 'compact' it is a small ⤢.
(() => {
  const b = document.getElementById('bPlein');
  let dansCadre = true;
  try { dansCadre = window.top !== window; } catch (e) { dansCadre = true; }
  if (!dansCadre) return;
  majPlein = () => { b.hidden = false; };   // also in 'miniature': the full-screen tab is wider, so less shrunk
  majPlein();
  b.onclick = () => {
    const w = window.open('', '_blank');
    if (!w) { b.textContent = 'Fenêtre bloquée par le navigateur'; return; }
    try {                                        // same origin: write the page straight into the tab
      w.document.open(); w.document.write(PAGE_SOURCE); w.document.close();
    } catch (e) {                                // sealed frame (Wix): hand the tab a copy of the page instead
      w.location.href = URL.createObjectURL(new Blob([PAGE_SOURCE], { type: 'text/html' }));
    }
  };
})();
