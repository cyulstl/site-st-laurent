<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horaire St-Laurent</title>
<!--
  Horaire de l'équipe — St-Laurent
  À coller dans un élément « Embed HTML » (Intégrer du code) de la page Wix.

  Les données viennent de l'application Web de l'Admin. Worksheet (?type=equipe), mise à jour toutes
  les heures à partir des calendriers ICS de chacun. Cette page ne voit jamais les liens ICS.

  Pour modifier :
    - CONFIG (juste en dessous du <style>) : lien des données, couleurs, vue de départ…
    - les vues sont dans les fonctions vueMois(), vueSemaine() et vueJour() ;
    - tout le reste (navigation, filtre, chargement) est au bas du fichier.
  Sans lien dans CONFIG.url, la page montre des données d'exemple (initiales fictives).
-->
<style>
  :root {
    --bg: #ffffff;
    --fg: #3c4043;
    --muted: #70757a;
    --line: #dadce0;
    --soft: #f1f3f4;
    --weekend: #f8f9fa;
    --off: #d9d9d9;          /* days off in the 5-4 cycle: the same grey as the Autobid sheet */
    --offline: #b3b7bd;      /* day borders on that grey */
    --ferie: #c5221f;        /* paid holidays */
    --relache: #b9a3e3;      /* March break (relâche scolaire), a soft marker only */
    --accent: #1a73e8;
    --now: #d93025;
    --libre: #0b8043;
    --partiel: #e8710a;
    --radius: 6px;
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  /* iPhone (Safari) enlarges text in a page laid out wider than the screen (the shrunk « miniature » view):
     keep the text at its real size so it shrinks with the rest */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-size: 13px; }
  button, select { font: inherit; color: inherit; }

  #app { display: flex; flex-direction: column; height: 100%; width: 100%; }

  /* ---------- barre du haut */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px 6px; }
  .bar .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
  .bar .grow { flex: 1 1 auto; }
  .btn { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 5px 14px;
         cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .ico { border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
         font-size: 20px; line-height: 1; color: var(--muted); }
  .ico:hover { background: var(--soft); }
  h1 { font-size: 20px; font-weight: 400; margin: 0 4px; white-space: nowrap; }
  select { border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 8px; background: var(--bg); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .seg button { border: 0; background: var(--bg); padding: 5px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: #e8f0fe; color: #174ea6; font-weight: 500; }
  .tog { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; cursor: pointer; }
  #status { padding: 0 14px 6px; color: var(--muted); font-size: 12px; }
  #status .demo { color: #a50e0e; font-weight: 500; }
  #status .ligne2 { display: block; margin-top: 1px; }
  #status .rafr { border: 0; background: none; padding: 0; font: inherit; color: var(--accent, #1a73e8); text-decoration: underline; cursor: pointer; }

  main { flex: 1 1 auto; overflow: auto; border-top: 1px solid var(--line); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 12px; border-top: 1px solid var(--line);
            color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .ot { font-style: italic; }
  .autre { text-decoration: underline dotted; }
  [data-p]:hover { text-decoration: underline; }
  .moi { background: #fde293; border-radius: 3px; padding: 0 2px; }

  /* ---------- vue Mois */
  .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .month .dow { text-align: center; font-size: 11px; font-weight: 500; color: var(--muted); padding: 6px 0 4px;
                text-transform: uppercase; border-bottom: 1px solid var(--line); background: var(--bg);
                position: sticky; top: 0; z-index: 2; }
  .cell { min-height: 96px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
          padding: 2px 4px 6px; overflow: hidden; }
  .cell:nth-child(7n) { border-right: 0; }
  .cell.we { background: var(--weekend); }
  .cell.out .num { color: #9aa0a6; }
  .cell.np { background-image: repeating-linear-gradient(135deg, transparent 0 6px, #f1f3f4 6px 8px); }
  .cell.off { background-color: var(--off); }   /* day off in the person's 5-4 cycle (one person chosen) */
  .cell.off, .week td.off { border-right-color: var(--offline); border-bottom-color: var(--offline);
                            box-shadow: inset 1px 1px 0 var(--offline); }   /* keep the day borders visible on grey */
  .cell.vide { background: var(--bg); }
  .mtitre { font-size: 15px; font-weight: 500; padding: 16px 10px 8px; border-top: 2px solid var(--line);
            text-transform: capitalize; }
  .num { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px;
         margin: 2px 0 2px; border-radius: 12px; font-size: 12px; font-weight: 500; cursor: pointer; padding: 0 4px; }
  .num:hover { background: var(--soft); }
  .today .num { background: var(--accent); color: #fff; }
  /* paid holidays (1.5x): red date + name (list = Setup D:E of the Admin. Worksheet) */
  .cell:not(.today) .num.fer, .cell.out .num.fer { color: var(--ferie); font-weight: 600; }
  .fnom { font-size: 11px; color: var(--ferie); font-weight: 500; margin-left: 4px; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 34px); display: inline-block; vertical-align: middle; }
  body.etroit .fnom { display: none; }
  .week thead th.fer, .week thead th.fer .d { color: var(--ferie); }
  /* March break: soft mauve strip at the top of the day (list = Setup O:Q of the Admin. Worksheet) */
  .cell { position: relative; }
  .cell.rel::before, .week thead th.rel::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px;
                                               background: var(--relache); pointer-events: none; }
  .week thead th .fn { display: block; font-size: 10.5px; font-weight: 500; color: var(--ferie); white-space: nowrap;
                       overflow: hidden; text-overflow: ellipsis; }
  .ln { display: flex; gap: 4px; align-items: baseline; line-height: 16px; font-size: 12px; }
  .ln .dot { transform: translateY(-1px); }
  .ln b { font-weight: 500; min-width: 30px; }
  .ln .ppl { min-width: 0; overflow-wrap: anywhere; }
  .ev { display: block; margin: 1px 0; padding: 0 5px; border-radius: 3px; font-size: 12px; line-height: 17px;
        background: var(--deg, var(--t)); border-left: 3px solid var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev b { font-weight: 500; }
  .ev .act { color: var(--muted); }
  .ev .hr { font-size: 11px; color: var(--fg); opacity: .85; }
  .ln.libre { color: var(--libre); font-weight: 500; }
  .ln .hr { font-weight: 400; font-size: 11px; opacity: .85; white-space: nowrap; }
  .ln.libre.p { color: var(--partiel); }
  .more { font-size: 12px; color: var(--muted); cursor: pointer; padding-left: 12px; }
  .more:hover { color: var(--fg); text-decoration: underline; }
  .chip { display: block; border-radius: 4px; padding: 1px 6px; margin: 1px 0; font-size: 12px; line-height: 16px;
          background: var(--deg, var(--t)); border-left: 3px solid var(--c); white-space: nowrap; overflow: hidden;
          text-overflow: ellipsis; }
  .chip.conge { background: var(--soft); border-left-color: #9aa0a6; color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 2px; }
  .pill { font-size: 10px; line-height: 14px; padding: 0 4px; border-radius: 7px; background: var(--deg, var(--t)); color: var(--fg); }
  .pill.t { line-height: 12px; padding: 1px 3px; border-radius: 4px; text-align: center; border-left: 2px solid var(--c); }

  /* ---------- vue Semaine (grille d'équipe) */
  table.week { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 820px; }
  .week th, .week td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
                       padding: 3px 4px; text-align: center; font-size: 12px; height: 26px; }
  .week thead th { position: sticky; top: 0; background: var(--bg); z-index: 2; font-weight: 500; color: var(--muted); }
  .week thead th.today { color: var(--accent); }
  .week thead th .d { display: block; font-size: 16px; color: var(--fg); font-weight: 400; }
  .week thead th.today .d { color: var(--accent); font-weight: 500; }
  .week th.who { position: sticky; left: 0; background: var(--bg); z-index: 1; text-align: left; padding-left: 10px;
                 font-weight: 500; width: 56px; }
  .week thead th.who { z-index: 3; }
  .week td.we { background: var(--weekend); }
  .week td.np { background-image: repeating-linear-gradient(135deg, transparent 0 6px, #f1f3f4 6px 8px); }
  .week td .sh { display: inline-block; padding: 1px 4px; border-radius: 4px; background: var(--deg, var(--t));
                 border-left: 3px solid var(--c); font-size: 11px; white-space: nowrap; }
  .week td .cg { color: var(--muted); font-size: 11px; }
  .week tr.sel th, .week tr.sel td { background: #fef7e0; }
  .week td.off, .week tr.sel td.off { background-color: var(--off); }
  .week tfoot th, .week tfoot td { color: var(--muted); font-size: 11px; background: var(--soft); }
  .week tfoot th.who { background: var(--soft); }
  .week tbody tr:hover th.who { color: var(--accent); }

  /* ---------- vue Jour (ligne du temps) */
  .day { position: relative; padding: 0 12px 12px 0; min-width: 520px; }
  .day .row { display: flex; align-items: center; height: 26px; }
  .day .lab { width: 60px; flex: none; padding-left: 12px; font-weight: 500; font-size: 12px; align-self: stretch;
              display: flex; align-items: center; position: sticky; left: 0; background: var(--bg); z-index: 3; }
  .day .trk { position: relative; flex: 1 1 auto; height: 100%; }
  .day .hours { position: sticky; top: 0; background: var(--bg); z-index: 2; height: 24px; border-bottom: 1px solid var(--line); }
  .day .hours span { position: absolute; top: 5px; transform: translateX(-50%); font-size: 11px; color: var(--muted); }
  .day .grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid #eceff1; }
  .day .grid.mid { border-left: 1px solid #c4c7c5; }
  .day .b { position: absolute; z-index: 1; top: 3px; bottom: 3px; border-radius: 4px; background: var(--deg, var(--t)); border-left: 3px solid var(--c);
            font-size: 11px; line-height: 20px; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .day .b.libre { background: #e6f4ea; border: 1px dashed var(--libre); color: var(--libre); font-weight: 500; }
  .day .b.libre.p { background: #feefe3; border-color: var(--partiel); color: var(--partiel); }
  .day .nowline { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--now); z-index: 2; pointer-events: none; opacity: .55; }
  .day .sep { height: 1px; background: var(--line); margin: 4px 0; }
  .day .info { padding: 8px 12px; color: var(--muted); }
  .day .sum { padding: 8px 12px 0; color: var(--muted); font-size: 12px; }

  .msg { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* ---------- congé dans la vue Mois */
  .ev.cg { background: var(--soft); border-left-color: #c4c7c5; color: var(--muted); }
  .ev.cg i { font-size: 11px; }
  /* fin d'une nuit commencée la veille (« → 07:15 ») : pâlie, bordure pointillée */
  .ev.suite, .chip.suite, .week td .sh.suite { background: var(--t); border-left-style: dashed; opacity: .72; font-style: italic; }
  .week td .sh.suite { font-size: 10px; padding: 1px 3px; }
  .day .b.suite { opacity: .6; border-left-style: dashed; font-style: italic; }
  [data-q], [data-cg], [data-p] { cursor: pointer; }

  /* ---------- fenêtre de détails (clic sur un quart) */
  #popbg { position: fixed; inset: 0; z-index: 50; }
  #popbg.sheet { background: rgba(32, 33, 36, .35); }
  .pop { position: fixed; z-index: 51; width: 270px; background: var(--bg); border-radius: 8px;
         border-top: 4px solid var(--c, #9aa0a6); box-shadow: 0 6px 24px rgba(0, 0, 0, .22);
         padding: 12px 14px 14px; font-size: 13px; }
  .pop.sheet { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto;
               border-radius: 14px 14px 0 0; padding: 16px 18px calc(18px + env(safe-area-inset-bottom)); font-size: 15px; }
  .pop .x { position: absolute; top: 4px; right: 4px; border: 0; background: none; font-size: 22px; line-height: 1;
            color: var(--muted); cursor: pointer; padding: 6px 10px; }
  .pop h3 { margin: 0 28px 2px 0; font-size: 17px; font-weight: 500; }
  .pop .dt { color: var(--muted); margin-bottom: 8px; }
  .pop .tm { font-size: 20px; font-weight: 500; }
  .pop .tm small { font-size: 13px; font-weight: 400; color: var(--muted); }
  .pop .tags { margin-top: 6px; }
  .pop .tags span { display: inline-block; margin: 3px 4px 0 0; padding: 1px 9px; border-radius: 10px;
                    background: var(--soft); font-size: 12px; }
  .pop .act { margin-top: 8px; }
  .pop ul { list-style: none; margin: 4px 0 0; padding: 0; }
  .pop li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .pop li .j { width: 62px; flex: none; color: var(--muted); }
  .pop li .dot { margin-right: 6px; }
  .pop ul.parts { margin-top: 10px; }
  .pop ul.parts li { gap: 8px; }
  .pop ul.parts .j { width: auto; flex: none; color: var(--fg); font-variant-numeric: tabular-nums; }
  .pop .sq { width: 12px; height: 12px; border-radius: 3px; border-left: 3px solid; flex: none; }
  .pop .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .pop.large { width: 340px; }
  .pop .choix { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 5px;
                max-height: 46vh; overflow-y: auto; margin-top: 4px; }
  .pop .choix label { display: flex; align-items: center; gap: 5px; padding: 5px 7px; border-radius: 6px;
                      background: var(--soft); cursor: pointer; font-weight: 500; user-select: none; }
  .pop .choix label:has(input:checked) { background: #d3e2fc; color: #0b3a8c; }
  .pop .choix input { margin: 0; }
  .pop .btns button { border: 1px solid var(--line); background: var(--bg); border-radius: 18px; padding: 5px 12px;
                      cursor: pointer; font-size: 13px; color: var(--accent); }
  .pop .btns button:hover { background: #f6f9fe; }
  .pop.sheet .btns button { flex: 1 1 auto; padding: 11px 14px; font-size: 15px; }

  /* compact phone layout (CONFIG.telephone = 'compact'); the class is set by ajusterTaille() */
  body.etroit .bar { padding: 8px 8px 4px; }
  body.etroit h1 { font-size: 16px; flex: 1 1 auto; }
  body.etroit .cell { min-height: 64px; padding: 1px 2px 4px; }
  body.etroit .num { min-width: 22px; height: 22px; }
  body.etroit .day .lab { width: 44px; padding-left: 6px; }
  body.etroit .seg button { padding: 5px 9px; }
  body.etroit #status .tip { display: none; }
  /* phones: everything the calendar doesn't need folds away so the days get the room */
  body.etroit .bar { font-size: 13px; gap: 6px 8px; }
  body.etroit .bar .grp:last-child { gap: 6px 8px; }
  body.etroit #who { order: 1; padding: 4px 11px; }
  body.etroit .seg { order: 2; }
  body.etroit .seg button { padding: 4px 9px; }
  body.etroit .tog { order: 3; }
  body.etroit #bLeg { order: 4; padding: 3px 10px; font-size: 12px; }
  body.etroit #bPlein { order: 5; padding: 3px 9px; font-size: 12px; }
  body.etroit .lg-plein, body.etroit .lg-who, body.etroit .lg-sem { display: none; }
  .ct-who, .ct-sem { display: none; }
  body.etroit .ct-who, body.etroit .ct-sem { display: inline; }
  body.etroit #bToday { font-size: 13px; padding: 4px 10px; }
  body.etroit h1 { font-size: 15px; margin: 0 2px; }
  body.etroit .bar .grp:first-child { gap: 2px; flex-wrap: nowrap; }
  body.etroit #bToday { padding: 4px 11px; }
  body.etroit .ico { width: 28px; height: 28px; }
  body.etroit #status { padding: 0 10px 5px; font-size: 11.5px; line-height: 1.35; }
  body.etroit #status .lg, body.etroit #status .det { display: none; }
  #status .ct { display: none; }
  body.etroit #status .ct { display: inline; }
  body.etroit .legend { display: none; }
  .pop .legend { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; border: 0; padding: 4px 0 0;
                 font-size: 13px; color: var(--fg); }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="grp">
      <button class="btn" id="bToday">Aujourd'hui</button>
      <button class="ico" id="bPrev" aria-label="Précédent">&#8249;</button>
      <button class="ico" id="bNext" aria-label="Suivant">&#8250;</button>
      <h1 id="range"></h1>
    </div>
    <div class="grow"></div>
    <div class="grp">
      <button class="btn" id="who" aria-haspopup="dialog" title="Choisir les personnes à afficher">Tout le monde ▾</button>
      <label class="tog"><input type="checkbox" id="libres"> Shifts en banque</label>
      <label class="tog"><input type="checkbox" id="conges"> Congés</label>
      <div class="seg" role="group" aria-label="Vue">
        <button data-v="mois">Mois</button><button data-v="semaine"><span class="lg-sem">Semaine</span><span class="ct-sem">Sem.</span></button><button data-v="jour">Jour</button>
      </div>
      <button class="btn" id="bLeg" hidden title="Ce que veulent dire les couleurs">Légende</button>
      <button class="btn" id="bPlein" hidden
         title="Ouvrir l'horaire dans un nouvel onglet, sur toute la largeur de l'écran">&#10530; <span class="lg-plein">Plein écran</span></button>
    </div>
  </div>
  <div id="status">Chargement…</div>
  <main id="view"></main>
  <div class="legend" id="legend"></div>
</div>
<div id="popbg" hidden></div>
<div id="pop" class="pop" role="dialog" aria-modal="true" hidden></div>

<script>
// A copy of this whole page as it was loaded, for the « Plein écran » button (taken before anything is drawn)
const PAGE_SOURCE = '<!doctype html>\n' + document.documentElement.outerHTML;
/* =====================================================================================
   CONFIG — ce qu'on change le plus souvent
   ===================================================================================== */
const CONFIG = {
  // Lien de l'application Web de l'Admin. Worksheet (le même que le calendrier Shifts en banque,
  // finissant par /exec). Vide = données d'exemple.
  url: 'https://script.google.com/macros/s/AKfycbzlun0DaIaOlLTwCVXApc4tv6pAecIiLJsfTHMK8mpsCSw0njNe87POvAsIJCePo1Ot/exec',
  avis: { minMois: 1, maxMois: 12, sansFinMois: 3 },   // « congé à venir » : annoncé aussi longtemps d'avance qu'il dure
                            // (6 mois de congé = 6 mois d'avance), au moins minMois, au plus maxMois ; sans date de fin : sansFinMois
  titre: 'Horaire St-Laurent',
  vue: 'mois',              // vue au départ : 'mois', 'semaine' ou 'jour'
  libres: true,             // montrer les Shifts en banque au départ
  conges: false,            // montrer les congés au départ (sinon : case « Congés » à cocher)
  nuitLendemain: false,     // true = une nuit s'affiche le jour où elle finit (comme l'Autobid)
  minuitAvant: true,        // un quart qui commence à minuit (00:00) s'affiche le soir d'avant, après les nuits de 22 h 15 :
                            // on voit les 2 quarts de nuit de chaque nuit ensemble (vues Mois, Semaine et Jour)
  minuitVeille: true,       // (si minuitAvant est false) il reste à son jour, et se voit aussi, pâli, à la fin de la veille
  debordeMin: 60,           // une nuit qui finit au moins n min après minuit se voit aussi (pâlie, « → 07:15 ») le
                            // matin où elle finit : toujours en vue Semaine ; en vue Mois quand 1 à 4 personnes sont choisies
  debordeMoisMax: 4,        // vue Mois : nombre maximum de personnes choisies pour montrer ces fins de nuit
  debutSemaine: 0,          // premier jour des semaines (vues Mois et Semaine) : 0 = dimanche, 1 = lundi
  maxLignes: 30,            // vue Mois : lignes par jour avant « + n de plus »
  normale: 525,             // durée d'un quart normal en minutes (8 h 45) ; plus de 30 min de plus = quart prolongé
  rafraichirMin: 30,        // recharger les données toutes les n minutes (0 = jamais)
  // Sur téléphone (écran de moins de 640 px) :
  //   'miniature' = le même affichage que sur ordinateur, réduit pour tenir dans la largeur ;
  //   'compact'   = l'affichage pour téléphone (des compteurs par jour, toucher un jour pour le détail).
  telephone: 'miniature',
  reduction: 'auto',        // miniature : 'auto' (zoom, échelle sur iPhone/iPad), 'zoom' ou 'echelle'
  largeurMini: 760,         // largeur (px) de l'affichage ordinateur qu'on réduit en mode 'miniature'
  // Couleurs des quarts, dans cet ordre de priorité :
  //   1. stagiaire (colonne « Stagiaire » de Contacts, Admin. Worksheet) : jaune, toujours
  //   2. autre activité que Coverage (formation…) : gris
  //   3. superviseur (S) : rouge
  //   4. sinon, selon l'heure de début (HHMM) ; le premier groupe qui correspond l'emporte.
  // (vert et orange sont gardés pour les Shifts en banque)
  groupes: [
    { nom: 'Jour',   lettre: 'J', de: '0400', a: '0959', couleur: '#0097a7', teinte: '#cdeef2' },
    { nom: 'Nooner', lettre: 'N', de: '1000', a: '1259', couleur: '#8e24aa', teinte: '#ecd4f4' },
    { nom: 'Soir',   lettre: 'S', de: '1300', a: '2059', couleur: '#1a5fd0', teinte: '#d3e2fc' },
    { nom: 'Nuit',   lettre: 'M', de: '2100', a: '0359', couleur: '#6d4c41', teinte: '#e6d9d2' },
  ],
  autre:       { nom: 'Autre activité (formation…)', couleur: '#80868b', teinte: '#eeeeee' },
  superviseur: { nom: 'Superviseur (S)',             couleur: '#c62828', teinte: '#f9d0d0' },
  stagiaire:   { nom: 'Stagiaire',                   couleur: '#f2b600', teinte: '#fdedb0' },
  tz: 'America/Toronto',
};

/* =====================================================================================
   Outils de dates (les dates sont des chaînes « AAAA-MM-JJ », calculées en UTC : pas de piège
   d'heure avancée) et d'heures (« HHMM »)
   ===================================================================================== */
const pad = n => String(n).padStart(2, '0');
const toUTC = d => { const [y, m, j] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, j)); };
const fromUTC = x => x.getUTCFullYear() + '-' + pad(x.getUTCMonth() + 1) + '-' + pad(x.getUTCDate());
const addDays = (d, k) => { const x = toUTC(d); x.setUTCDate(x.getUTCDate() + k); return fromUTC(x); };
// place in the week: 0 = first day (CONFIG.debutSemaine) … 6 = last day
const dow = d => (toUTC(d).getUTCDay() - CONFIG.debutSemaine + 7) % 7;
const debutDe = d => addDays(d, -dow(d));                             // first day of d's week
const estWE = d => toUTC(d).getUTCDay() % 6 === 0;                    // Saturday or Sunday
const firstOfMonth = d => d.slice(0, 8) + '01';
const addMonths = (d, k) => { const x = toUTC(firstOfMonth(d)); x.setUTCMonth(x.getUTCMonth() + k); return fromUTC(x); };
const fmt = (d, o) => new Intl.DateTimeFormat('fr-CA', Object.assign({ timeZone: 'UTC' }, o)).format(toUTC(d));
const mins = a => +a.slice(0, 2) * 60 + +a.slice(2);                 // « 0615 » → 375
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + String(m % 60).padStart(2, '0');   // 375 → « 0615 »
const hm = a => a.slice(0, 2) + ':' + a.slice(2);                    // « 0615 » → « 06:15 »
// length of a shift en banque, in brackets: « (8 h 30) », « (5 h) »
const dureeL = l => { const m = l.fin - l.off; return `(${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''})`; };
const code = a => String(+a);                                         // « 0615 » → « 615 »
function nowLocal() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: CONFIG.tz, year: 'numeric',
    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { d: p.year + '-' + p.month + '-' + p.day, m: +p.hour * 60 + +p.minute };
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function groupe(a) {
  for (const g of CONFIG.groupes) {
    const ok = g.de <= g.a ? (a >= g.de && a <= g.a) : (a >= g.de || a <= g.a);
    if (ok) return g;
  }
  return { nom: '?', lettre: '?', couleur: CONFIG.autre.couleur, teinte: CONFIG.autre.teinte };
}
const estStag = w => !!(S.data && (S.data.stag || []).includes(w));
// colour of a shift: trainee (yellow, always — their shifts are usually OJT, not plain Coverage)
// > other activity (grey) > supervisor (red) > its time group
// a mixed shift (q.parts: part coverage, part something else) is coloured by its coverage, not grey
const couleurQ = q => estStag(q.who) ? CONFIG.stagiaire : ((q.f & 4) && !q.parts) ? CONFIG.autre
  : (q.f & 2) ? CONFIG.superviseur : q.g;
const estGris = q => couleurQ(q) === CONFIG.autre;
const GRIS_PART = '#e2e3e5';                       // the non-coverage part of a mixed shift
// colour of one part of a mixed shift
const couleurPart = (q, k) => k === 2 ? { couleur: CONFIG.autre.couleur, teinte: GRIS_PART }
  : estStag(q.who) ? CONFIG.stagiaire : k === 1 ? CONFIG.superviseur : q.g;
// two-tone (or more) background, in time order and to scale: 06:15–10:00 coverage, 10:00–15:00 grey…
function degradeQ(q) {
  if (!q.parts && q.prolonge && !estGris(q)) {
    const dur = q.fin - q.off, pct = m => (100 * m / dur).toFixed(1) + '%', P = q.prolonge;
    const seg = [[P.normal, couleurQ(q).teinte], [P.extra, P.gx.teinte]].sort((x, y) => x[0][0] - y[0][0]);
    return `linear-gradient(90deg, ${seg.map(([r, c]) => `${c} ${pct(r[0])} ${pct(r[1])}`).join(', ')})`;
  }
  if (!q.parts) return '';
  const dur = q.fin - q.off, base = couleurQ(q).teinte, pct = m => (100 * m / dur).toFixed(1) + '%';
  const stops = []; let t = 0;
  for (const p of q.parts) {
    if (p.s0 > t) stops.push(`${base} ${pct(t)} ${pct(p.s0)}`);
    const c = couleurPart(q, p.k).teinte;
    stops.push(`${c} ${pct(Math.max(p.s0, t))} ${pct(p.s1)}`);
    t = Math.max(t, p.s1);
  }
  if (t < dur) stops.push(`${base} ${pct(t)} 100%`);
  return `linear-gradient(90deg, ${stops.join(', ')})`;
}
const styleQ = q => { const c = couleurQ(q), g = degradeQ(q); return `--c:${c.couleur};--t:${c.teinte}` + (g ? `;--deg:${g}` : ''); };
// what a shift shows: initials, « (S) » for a supervisor, then any activity that is not coverage
const nomQ = q => q.who + (q.f & 2 ? ' (S)' : '');
const labelQ = q => nomQ(q) + (q.act ? ' ' + q.act : '');
// times in 24 h, with $ in front for overtime: « $06:15 - 15:00 »
const heures = q => (q.f & 1 ? '$' : '') + hm(q.a) + ' - ' + hm(q.b);
const titreQ = q => `${nomQ(q)} · ${heures(q)}` + (q.act ? ` · ${q.act}` : '') + (q.f & 1 ? ' · OT' : '') +
  (estStag(q.who) ? ' · stagiaire' : '') + (q.prolonge ? ' · quart prolongé' : '') +
  (minuitQ(q) ? ` · commence à minuit (nuit du ${fmt(addDays(q.day, -1), { weekday: 'long', day: 'numeric' })} au ${fmt(q.day, { day: 'numeric' })})` : '') +
  (q.minuit ? ` · commence à minuit le ${fmt(q.jour, { weekday: 'long', day: 'numeric' })} (nuit du ${fmt(q.day, { weekday: 'long', day: 'numeric' })} au ${fmt(q.jour, { day: 'numeric' })})` : '');

/* =====================================================================================
   État
   ===================================================================================== */
const S = {
  data: null, demo: false,
  byDay: {}, congeDay: {}, libreDay: {},
  vue: CONFIG.vue, cur: nowLocal().d, libres: CONFIG.libres, conges: CONFIG.conges,
  sel: [],      // people ticked in the « Tout le monde » list (empty = everyone)
  feries: {},   // 'yyyy-mm-dd' → holiday name (paid 1.5x), from the Setup tab
  relache: [],  // [début, fin, note] : March break weeks (soft marker), from the Setup tab
  who: '',      // = the one person when exactly one is ticked (one-person layouts), else ''
};
const mem = {
  get(k) { try { return localStorage.getItem('horaireStl.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('horaireStl.' + k, v); } catch (e) { /* pas de stockage : tant pis */ } },
};
(function restaurer() {
  const v = mem.get('vue'); if (['mois', 'semaine', 'jour'].includes(v)) S.vue = v;
  const w = mem.get('who'); if (w) { S.sel = w.split(',').filter(Boolean); S.who = S.sel.length === 1 ? S.sel[0] : ''; }
  const l = mem.get('libres'); if (l !== null) S.libres = l === '1';
  const cg = mem.get('conges'); if (cg !== null) S.conges = cg === '1';
})();

/* =====================================================================================
   Données : indexation par jour
   ===================================================================================== */
function indexer(d) {
  S.byDay = {}; S.congeDay = {}; S.libreDay = {}; S.qs = [];
  for (const w of d.gens || []) {
    for (const [jour, a, b, f, act, parts] of (d.q && d.q[w]) || []) {
      let g = groupe(a);
      // long shift (more than 8 h 45 + 30 min): an early-in midnight (ends between 05:00 and 10:00) is a midnight;
      // the normal 8 h 45 keep the shift's colour, the extra hours take the colour of the time they fall in
      const dur0 = (mins(b) - mins(a) + 1440) % 1440 || 1440;
      let prolonge = null;
      if (dur0 > CONFIG.normale + 30) {
        const finM = (mins(a) + dur0) % 1440, nuit = CONFIG.groupes.find(x => x.lettre === 'M');
        if (nuit && g !== nuit && finM >= 300 && finM <= 600) {
          prolonge = { extra: [0, dur0 - CONFIG.normale], normal: [dur0 - CONFIG.normale, dur0], gx: g };
          g = nuit;
        } else {
          prolonge = { normal: [0, CONFIG.normale], extra: [CONFIG.normale, dur0],
                       gx: groupe(hhmm((mins(a) + CONFIG.normale) % 1440)) };
        }
      }
      // offset = minutes from the displayed day's midnight to the shift start
      let day = jour, off = mins(a);
      if (CONFIG.nuitLendemain && g.lettre === 'M' && mins(a) >= 720) { day = addDays(jour, 1); off -= 1440; }
      const minuit = CONFIG.minuitAvant && !CONFIG.nuitLendemain && mins(a) === 0;
      if (minuit) { day = addDays(jour, -1); off = 1440; }
      let fin = off + ((mins(b) - mins(a) + 1440) % 1440 || 1440);
      const q = { id: S.qs.length, day, jour, who: w, a, b, f: f || 0, act: act || '', g, off, fin, minuit };
      if (prolonge) q.prolonge = prolonge;
      // mixed shift: its parts [start, end, kind 0 coverage / 1 coverage (S) / 2 other, name], in minutes from the start
      if (Array.isArray(parts) && parts.length) {
        const dur = fin - off, rel = t => (mins(t) - mins(a) + 1440) % 1440;
        q.parts = parts.map(([pa, pb, k, nom]) => {
          const s0 = rel(pa); let s1 = rel(pb); if (s1 <= s0) s1 += 1440;
          return { a: pa, b: pb, k, nom, s0: Math.min(s0, dur), s1: Math.min(s1, dur) };
        }).filter(p => p.s1 > p.s0).sort((x, y) => x.s0 - y.s0);
        if (!q.parts.length) delete q.parts;
      }
      S.qs.push(q);                                   // id → shift, for the details window
      (S.byDay[day] = S.byDay[day] || []).push(q);
    }
    for (const j of (d.c && d.c[w]) || []) (S.congeDay[j] = S.congeDay[j] || []).push(w);
  }
  for (const [jour, a, b, c, places] of d.libres || []) {
    let day = jour, off = mins(a);
    if (CONFIG.nuitLendemain && mins(a) >= 1260) { day = addDays(jour, 1); off -= 1440; }
    if (CONFIG.minuitAvant && !CONFIG.nuitLendemain && mins(a) === 0) { day = addDays(jour, -1); off = 1440; }
    const fin = off + ((mins(b) - mins(a) + 1440) % 1440 || 1440);
    (S.libreDay[day] = S.libreDay[day] || []).push({ a, b, code: c, places: places || 1, off, fin });
  }
  for (const k in S.byDay) S.byDay[k].sort((x, y) => x.off - y.off || (x.who < y.who ? -1 : 1));
}
const choisi = w => !S.sel.length || S.sel.includes(w);
const quarts = d => (S.byDay[d] || []).filter(q => choisi(q.who));
const conges = d => S.conges ? (S.congeDay[d] || []).filter(choisi) : [];
// people on leave that day who have no shift that day, in alphabetical order
const congesLibres = d => { const occ = new Set(quarts(d).map(q => q.who)); return conges(d).filter(w => !occ.has(w)).sort(); };
const libres = d => (S.libres ? S.libreDay[d] || [] : []);
const publie = d => !S.data || !S.data.horizon || d <= S.data.horizon;
const estRelache = d => S.relache.some(r => d >= r[0] && d <= r[1]);
// hover text for a March break day: « Relâche : <who, from the Setup tab> »
const titreRelache = d => {
  const qui = S.relache.filter(r => d >= r[0] && d <= r[1]).map(r => r[2]).filter(Boolean);
  return qui.length ? 'Relâche : ' + qui.join(' / ') : 'Relâche scolaire';
};
// night shift that runs past midnight: also shown, faded, on the morning it ends
const deborde = q => q.fin - 1440 >= CONFIG.debordeMin;
const suites = (d, w) => (S.byDay[addDays(d, -1)] || [])
  .filter(q => deborde(q) && (w ? q.who === w : choisi(q.who))).sort((x, y) => x.fin - y.fin || (x.who < y.who ? -1 : 1));
const suitesMois = () => S.sel.length > 0 && S.sel.length <= CONFIG.debordeMoisMax;
// shifts that start at midnight (00:00) the next day: also shown, faded, at the end of the evening before
const minuitQ = q => CONFIG.minuitVeille && !CONFIG.minuitAvant && !CONFIG.nuitLendemain && q.off === 0;
const minuits = (d, w) => (S.byDay[addDays(d, 1)] || [])
  .filter(q => minuitQ(q) && (w ? q.who === w : choisi(q.who))).sort((x, y) => x.fin - y.fin || (x.who < y.who ? -1 : 1));
const titreMinuit = q => `${nomQ(q)} · commence à minuit, ${fmt(q.day, { weekday: 'long', day: 'numeric' })} · ${heures(q)}`;
const titreSuite = q => `${nomQ(q)} · fin de la nuit du ${fmt(q.day, { weekday: 'long', day: 'numeric' })} · ${heures(q)}` +
  (q.act ? ` · ${q.act}` : '');

/* =====================================================================================
   Vue Mois
   ===================================================================================== */
function vueMois() { return grilleMois(S.cur, !!S.who); }

// One month grid. empile = one person chosen: the following months are stacked underneath (remplirMois),
// so days of the next/previous month are left blank here (they appear in their own month).
function grilleMois(cur, empile) {
  const today = nowLocal().d, first = firstOfMonth(cur), start = debutDe(first);
  const nextMonth = addMonths(cur, 1);
  const narrow = etroit();
  let h = cur === S.cur ? '' : `<div class="mtitre">${fmt(first, { month: 'long', year: 'numeric' })}</div>`;
  h += `<div class="month" data-mois="${cur.slice(0, 7)}">`;
  for (let i = 0; i < 7; i++) h += `<div class="dow">${fmt(addDays(start, i), { weekday: narrow ? 'narrow' : 'short' })}</div>`;
  for (let d = start; d < nextMonth || dow(d) !== 0; d = addDays(d, 1)) {
    const dehors = d.slice(0, 7) !== cur.slice(0, 7);
    if (empile && dehors) { h += '<div class="cell vide"></div>'; continue; }
    const cls = ['cell'];
    if (dehors) cls.push('out');
    if (estWE(d)) cls.push('we');
    if (d === today) cls.push('today');
    if (!publie(d)) cls.push('np');
    if (S.who && congeCycle(S.who, d)) cls.push('off');
    if (estRelache(d)) cls.push('rel');
    h += `<div class="${cls.join(' ')}"${narrow ? ` data-day="${d}"` : ''}>` +
      `<span class="num${S.feries[d] ? ' fer' : ''}" data-day="${d}" title="${S.feries[d] ? 'Férié payé 1,5x : ' + esc(S.feries[d]) + ' · ' : ''}${estRelache(d) ? esc(titreRelache(d)) + ' · ' : ''}Voir la journée">${+d.slice(8)}</span>` +
      (S.feries[d] ? `<span class="fnom" title="Férié payé 1,5x">${esc(S.feries[d])}</span>` : '');
    h += narrow ? caseEtroite(d) : caseLarge(d);
    h += '</div>';
  }
  return h + '</div>';
}

// One person chosen: add the following months under the current one until the space is filled,
// plus one more to scroll to (12 at most).
function remplirMois(v) {
  for (let k = 1; k <= 12; k++) {
    const plein = v.scrollHeight > v.clientHeight + 40;
    v.insertAdjacentHTML('beforeend', grilleMois(addMonths(S.cur, k), true));
    if (plein) break;
  }
}

function caseLarge(d) {
  const lignes = [];
  // nights started the day before (1 to 4 people chosen): first, as they are the ones on at the start of the day
  const sx = suitesMois() ? suites(d) : [];
  if (S.who) {                                   // one person: Google-style event chips
    for (const q of sx) lignes.push(`<span class="chip suite" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreSuite(q))}">` +
      `<b>→ ${hm(q.b)}</b> fin de nuit</span>`);
    for (const q of quarts(d)) lignes.push(`<span class="chip" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreQ(q))}">` +
      `<b>${heures(q)}</b>${q.act ? ' ' + esc(q.act) : ''}</span>`);
    for (const q of minuits(d)) lignes.push(`<span class="chip suite" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreMinuit(q))}">` +
      `<b>${heures(q)}</b> à minuit</span>`);
  } else {
    // everyone, one line per person: other activities (grey), then each group in order,
    // supervisors before coverage (Nuit together), each part by start time; then shifts en banque;
    // leave (when « Congés » is ticked) at the very bottom
    const ev = q => `<div class="ev" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreQ(q))}">` +
      `<b>${esc(nomQ(q))}</b> <span class="hr">${heures(q)}</span>` +
      `${q.act ? ' <span class="act">' + esc(q.act) + '</span>' : ''}</div>`;
    for (const q of sx) lignes.push(`<div class="ev suite" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreSuite(q))}">` +
      `<b>${esc(nomQ(q))}</b> <span class="hr">→ ${hm(q.b)}</span></div>`);
    const qs = quarts(d).slice().sort((x, y) => rangMois(x) - rangMois(y) || x.off - y.off || (x.who < y.who ? -1 : 1));
    for (const q of qs) lignes.push(ev(q));
    // tomorrow's 00:00 shifts, after tonight's nights (faded: they belong to tomorrow)
    for (const q of minuits(d)) lignes.push(`<div class="ev suite" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreMinuit(q))}">` +
      `<b>${esc(nomQ(q))}</b> <span class="hr">${heures(q)}</span> <span class="act">à minuit</span></div>`);
  }
  for (const l of libres(d)) {
    lignes.push(l.code
      ? `<div class="ln libre" title="Shift en banque : ${hm(l.a)} - ${hm(l.b)} ${dureeL(l)}">` +
        `<i class="dot" style="--c:var(--libre)"></i><span>Libre ${esc(l.code)} <span class="hr">${dureeL(l)}</span>${l.places > 1 ? ' ×' + l.places : ''}</span></div>`
      : `<div class="ln libre p" title="Shift en banque partiel : ${hm(l.a)} - ${hm(l.b)} ${dureeL(l)}"><i class="dot" style="--c:var(--partiel)"></i>` +
        `<span>Libre ${hm(l.a)} - ${hm(l.b)} <span class="hr">${dureeL(l)}</span>${l.places > 1 ? ' ×' + l.places : ''}</span></div>`);
  }
  if (S.who) { if (congesLibres(d).length) lignes.push(`<span class="chip conge" data-cg="${S.who}|${d}">Congé</span>`); }
  else for (const w of congesLibres(d)) lignes.push(`<div class="ev cg" data-cg="${w}|${d}" title="${w} en congé"><b>${w}</b> <i>congé</i></div>`);
  if (lignes.length > CONFIG.maxLignes) {
    const n = lignes.length - CONFIG.maxLignes + 1;
    return lignes.slice(0, CONFIG.maxLignes - 1).join('') + `<div class="more" data-day="${d}">+ ${n} de plus</div>`;
  }
  return lignes.join('');
}

// Month list order: 0 other activity; then per group (J, N, S): supervisors, then coverage;
// Nuit (M) is one block. Unknown start times go after Nuit.
function rangMois(q) {
  if (estGris(q)) return 0;
  const gi = CONFIG.groupes.indexOf(q.g), n = CONFIG.groupes.length;
  if (gi < 0) return 2 * n + 1;
  if (q.g.lettre === 'M') return 1 + 2 * gi;
  return 1 + 2 * gi + (q.f & 2 ? 0 : 1);
}

function caseEtroite(d) {                         // phone: counts per group, tap the day for details
  if (S.who) {
    const q = quarts(d)[0];
    if (q) return `<div class="pills"><span class="pill t" style="${styleQ(q)}" data-q="${q.id}">${q.f & 1 ? '$' : ''}${hm(q.a)}<br>${hm(q.b)}</span></div>`;
    return congesLibres(d).length ? `<div class="pills"><span class="pill" style="--t:var(--soft)" data-cg="${S.who}|${d}">C</span></div>` : '';
  }
  // same order as the list: A = other activity, coverage per group, L = shifts en banque, C = on leave (if shown)
  const n = {};
  let a = 0;
  for (const q of quarts(d)) if (estGris(q)) a++; else n[q.g.lettre] = (n[q.g.lettre] || 0) + 1;
  const cg = congesLibres(d).length;
  let h = '<div class="pills">';
  if (a) h += `<span class="pill" style="--t:${CONFIG.autre.teinte}" title="Autre activité">A${a}</span>`;
  for (const g of CONFIG.groupes) if (n[g.lettre]) h += `<span class="pill" style="--t:${g.teinte}">${g.lettre}${n[g.lettre]}</span>`;
  const lb = libres(d).reduce((s, l) => s + l.places, 0);
  if (lb) h += `<span class="pill" style="--t:#e6f4ea;color:var(--libre)">L${lb}</span>`;
  if (cg) h += `<span class="pill" style="--t:var(--soft);color:var(--muted)" title="En congé">C${cg}</span>`;
  return h + '</div>';
}

/* =====================================================================================
   Vue Semaine — grille de l'équipe (une ligne par personne, comme l'Autobid)
   ===================================================================================== */
function vueSemaine() {
  const today = nowLocal().d, start = debutDe(S.cur);
  const jours = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  // the people ticked go first, highlighted; everyone else stays below for context
  const tous = S.data.gens || [];
  const gens = S.sel.filter(w => tous.includes(w)).concat(tous.filter(w => !S.sel.includes(w)));
  let h = '<table class="week"><thead><tr><th class="who"></th>';
  for (const d of jours) h += `<th class="${d === today ? 'today' : ''}${S.feries[d] ? ' fer' : ''}${estRelache(d) ? ' rel' : ''}" data-day="${d}" style="cursor:pointer"` +
    `${S.feries[d] || estRelache(d) ? ` title="${[S.feries[d] ? 'Férié payé 1,5x : ' + esc(S.feries[d]) : '', estRelache(d) ? esc(titreRelache(d)) : ''].filter(Boolean).join(' · ')}"` : ''}>` +
    `${fmt(d, { weekday: 'short' })}<span class="d">${+d.slice(8)}</span>` +
    `${S.feries[d] ? `<span class="fn">${esc(S.feries[d])}</span>` : ''}</th>`;
  h += '</tr></thead><tbody>';
  for (const w of gens) {
    h += `<tr class="${S.sel.includes(w) ? 'sel' : ''}"><th class="who" data-p="${w}">${w}</th>`;
    for (const d of jours) {
      const cls = [estWE(d) ? 'we' : '', publie(d) ? '' : 'np', S.sel.includes(w) && congeCycle(w, d) ? 'off' : ''].join(' ');
      const qs = (S.byDay[d] || []).filter(q => q.who === w);
      // the end of a night started the day before comes first (faded « → 07:15 »)
      let c = suites(d, w).map(q => `<span class="sh suite" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreSuite(q))}">→ ${hm(q.b)}</span>`)
        .concat(qs.map(q => `<span class="sh" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreQ(q))}">${heures(q)}</span>`))
        .concat(minuits(d, w).map(q => `<span class="sh suite" style="${styleQ(q)}" data-q="${q.id}" title="${esc(titreMinuit(q))}">${hm(q.a)} →</span>`)).join(' ');
      if (!qs.length && S.conges && (S.congeDay[d] || []).includes(w)) c += (c ? ' ' : '') + `<span class="cg" data-cg="${w}|${d}">congé</span>`;
      h += `<td class="${cls}">${c}</td>`;
    }
    h += '</tr>';
  }
  h += '</tbody><tfoot>';
  for (const g of CONFIG.groupes) {
    h += `<tr><th class="who"><i class="dot" style="--c:${g.couleur}"></i> ${g.lettre}</th>`;
    for (const d of jours) h += `<td>${(S.byDay[d] || []).filter(q => q.g === g).length || ''}</td>`;
    h += '</tr>';
  }
  if (S.libres) {
    h += '<tr><th class="who" style="color:var(--libre)">Libres</th>';
    for (const d of jours) {
      const l = S.libreDay[d] || [];
      const c = l.filter(x => x.code).reduce((s, x) => s + x.places, 0), p = l.filter(x => !x.code).reduce((s, x) => s + x.places, 0);
      const det = l.map(x => `${x.code ? 'Libre ' + x.code : 'Partiel ' + hm(x.a) + ' - ' + hm(x.b)} ${dureeL(x)}${x.places > 1 ? ' ×' + x.places : ''}`).join('\n');
      h += `<td title="${det ? esc(det) : 'complets / partiels'}">${c ? `<span style="color:var(--libre)">${c}</span>` : ''}` +
        `${c && p ? ' · ' : ''}${p ? `<span style="color:var(--partiel)">${p}p</span>` : ''}</td>`;
    }
    h += '</tr>';
  }
  return h + '</tfoot></table>';
}

/* =====================================================================================
   Vue Jour — ligne du temps (qui travaille à quelle heure)
   ===================================================================================== */
function vueJour() {
  const d = S.cur, qs = quarts(d), ls = libres(d), now = nowLocal();
  // tomorrow's 00:00 shifts drawn faded after midnight (same shift, 1440 min later on this day's axis)
  const mx = minuits(d).map(q => ({ q, off: q.off + 1440, fin: q.fin + 1440 }));
  if (!qs.length && !ls.length) {
    return `<div class="msg">${publie(d) ? 'Aucun quart ce jour-là.' : 'Horaire pas encore publié pour cette date.'}</div>`;
  }
  // axis: 5:00 → 8:00 the next morning, widened if a shift goes beyond
  let lo = 300, hi = 1920;
  for (const x of qs.concat(ls, mx)) { lo = Math.min(lo, Math.floor(x.off / 60) * 60); hi = Math.max(hi, Math.ceil(x.fin / 60) * 60); }
  const pct = m => ((m - lo) / (hi - lo) * 100).toFixed(3) + '%';
  let grid = '';
  for (let m = lo; m <= hi; m += 60) grid += `<div class="grid ${m % 1440 === 0 ? 'mid' : ''}" style="left:${pct(m)}"></div>`;
  let h = '<div class="day"><div class="row hours"><div class="lab"></div><div class="trk">';
  const step = etroit() ? 180 : 120;
  for (let m = lo + 60; m < hi; m += step) h += `<span style="left:${pct(m)}">${pad((m / 60 + 24) % 24)}:00</span>`;
  h += '</div></div>';
  const nowLine = d === now.d && now.m >= lo && now.m <= hi ? `<div class="nowline" style="left:${pct(now.m)}"></div>` : '';
  for (const q of qs) {
    h += `<div class="row"><div class="lab" data-q="${q.id}">${esc(nomQ(q))}</div><div class="trk">${grid}${nowLine}` +
      `<div class="b" data-q="${q.id}" style="${styleQ(q)};left:${pct(q.off)};width:calc(${pct(q.fin)} - ${pct(q.off)})" title="${esc(titreQ(q))}">` +
      `<b>${esc(nomQ(q))}</b> · ${heures(q)}${q.act ? ' · ' + esc(q.act) : ''}</div></div></div>`;
  }
  for (const { q, off, fin } of mx) {
    h += `<div class="row"><div class="lab" data-q="${q.id}" style="opacity:.72;font-style:italic">${esc(nomQ(q))}</div><div class="trk">${grid}${nowLine}` +
      `<div class="b suite" data-q="${q.id}" style="${styleQ(q)};left:${pct(off)};width:calc(${pct(fin)} - ${pct(off)})" title="${esc(titreMinuit(q))}">` +
      `<b>${esc(nomQ(q))}</b> · ${heures(q)} · à minuit</div></div></div>`;
  }
  if (ls.length) {
    h += '<div class="sep"></div>';
    for (const l of ls) for (let i = 0; i < l.places; i++) {
      h += `<div class="row"><div class="lab" style="color:${l.code ? 'var(--libre)' : 'var(--partiel)'}">Libre</div>` +
        `<div class="trk">${grid}${nowLine}<div class="b libre ${l.code ? '' : 'p'}" style="left:${pct(l.off)};` +
        `width:calc(${pct(l.fin)} - ${pct(l.off)})">${l.code ? 'Complet ' : 'Partiel '}${hm(l.a)} - ${hm(l.b)} ${dureeL(l)}</div></div></div>`;
    }
  }
  const cg = conges(d);
  const n = {};
  for (const q of qs) n[q.g.lettre] = (n[q.g.lettre] || 0) + 1;
  h += `<div class="sum">${qs.length} quart${qs.length > 1 ? 's' : ''} — ` +
    CONFIG.groupes.filter(g => n[g.lettre]).map(g => `${g.nom} ${n[g.lettre]}`).join(' · ') +
    (cg.length ? `<br>En congé : ${cg.join(' ')}` : '') + '</div>';
  return h + '</div>';
}

/* =====================================================================================
   Fenêtre de détails : un clic sur un quart (ou un congé, ou des initiales en vue Semaine)
   ouvre une petite fenêtre au lieu de filtrer tout de suite. Sur téléphone, elle monte du bas.
   ===================================================================================== */
const duree = m => `${Math.floor(m / 60)} h ${pad(m % 60)}`;
const jourLong = d => fmt(d, { weekday: 'long', day: 'numeric', month: 'long' });

function boutons(w, d) {
  let h = '<div class="btns">';
  if (S.sel.includes(w)) h += S.sel.length === 1 ? '<button data-act="tous">Voir tout le monde</button>'
                                                 : `<button data-act="retirer" data-w="${w}">Retirer ${w}</button>`;
  else h += `<button data-act="filtre" data-w="${w}">Ne voir que ${w}</button>` +
            (S.sel.length ? `<button data-act="ajouter" data-w="${w}">Ajouter ${w}</button>` : '');
  if (d && !(S.vue === 'jour' && S.cur === d)) h += `<button data-act="jour" data-d="${d}">Voir la journée</button>`;
  return h + '</div>';
}

function popQuart(q) {
  const c = couleurQ(q);
  // first tag = what gives the colour, then the time group and any other marks
  const tags = [`<span style="background:${c.teinte}">${esc(c === q.g ? `${q.g.nom} (${q.g.lettre})` : c.nom)}</span>`];
  if (c !== q.g) tags.push(`<span>${q.g.nom} (${q.g.lettre})</span>`);
  if ((q.f & 2) && c !== CONFIG.superviseur) tags.push(`<span>${CONFIG.superviseur.nom}</span>`);
  if (q.f & 1) tags.push('<span>$ Temps supplémentaire</span>');
  if (q.prolonge) tags.push('<span>Quart prolongé</span>');
  return { c: c.couleur, html:
    `<h3>${esc(nomQ(q))}</h3><div class="dt">${q.minuit ? `Commence à minuit le ${jourLong(q.jour)} · nuit du ${fmt(q.day, { weekday: 'long', day: 'numeric' })} au ${fmt(q.jour, { day: 'numeric' })}`
      : jourLong(q.day) + (minuitQ(q) ? ' · commence à minuit (fait partie du soir d\'avant)' : '')}</div>` +
    `<div class="tm">${heures(q)} <small>${duree(q.fin - q.off)}${q.fin > 1440 ? ' · finit le lendemain' : ''}</small></div>` +
    `<div class="tags">${tags.join('')}</div>` +
    (q.parts
      ? '<ul class="parts">' + q.parts.map(p => { const pc = couleurPart(q, p.k);
          return `<li><i class="sq" style="background:${pc.teinte};border-color:${pc.couleur}"></i>` +
            `<span class="j">${hm(p.a)} - ${hm(p.b)}</span><span>${esc(p.nom)}</span></li>`; }).join('') + '</ul>'
      : (q.prolonge ? (() => {
          const P = q.prolonge, t = m => hm(hhmm((mins(q.a) + m) % 1440)), c = couleurQ(q);
          const rows = [[P.normal, c, `${q.g.nom} (${q.g.lettre})`], [P.extra, P.gx, `Heures en plus (${P.gx.nom.toLowerCase()})`]]
            .sort((x, y) => x[0][0] - y[0][0]);
          return '<ul class="parts">' + rows.map(([r, col, nom]) =>
            `<li><i class="sq" style="background:${col.teinte};border-color:${col.couleur}"></i>` +
            `<span class="j">${t(r[0])} - ${t(r[1])}</span><span>${esc(nom)}</span></li>`).join('') + '</ul>' +
            (q.act ? `<div class="act">Activité : <b>${esc(q.act)}</b></div>` : '');
        })()
      : (q.act ? `<div class="act">Activité : <b>${esc(q.act)}</b></div>` : ''))) + boutons(q.who, q.day) };
}

function popConge(w, d) {
  return { c: '#c4c7c5', html: `<h3>${esc(w)}</h3><div class="dt">${jourLong(d)}</div>` +
    '<div class="tags"><span>Congé</span></div>' + boutons(w, d) };
}

function popPersonne(w) {                        // week view: that person's week at a glance
  const start = debutDe(S.cur);
  let li = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    const qs = (S.byDay[d] || []).filter(q => q.who === w);
    const txt = qs.length ? qs.map(q => `<i class="dot" style="--c:${couleurQ(q).couleur}"></i>${heures(q)}` +
      (q.act ? ` <span style="color:var(--muted)">${esc(q.act)}</span>` : '')).join('<br>')
      : (S.congeDay[d] || []).includes(w) ? '<span style="color:var(--muted)">congé</span>' : '<span style="color:var(--muted)">—</span>';
    li += `<li><span class="j">${fmt(d, { weekday: 'short', day: 'numeric' })}</span><span>${txt}</span></li>`;
  }
  return { c: '#9aa0a6', html: `<h3>${esc(w)}</h3><div class="dt">Semaine du ${fmt(start, { day: 'numeric', month: 'long' })}</div>` +
    `<ul>${li}</ul>` + boutons(w, '') };
}

function ouvrirPop(p, el) {
  const pop = document.getElementById('pop'), bg = document.getElementById('popbg');
  const sheet = innerWidth < 640;
  pop.style.setProperty('--c', p.c);
  pop.innerHTML = '<button class="x" data-act="fermer" aria-label="Fermer">×</button>' + p.html;
  pop.classList.toggle('sheet', sheet);
  pop.classList.toggle('large', !!p.large);
  bg.classList.toggle('sheet', sheet);
  bg.hidden = false; pop.hidden = false;
  if (!sheet) {                                  // next to the shift, inside the window
    const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    const x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
    let y = r.bottom + 6;
    if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  }
}

function fermerPop() {
  document.getElementById('pop').hidden = true;
  document.getElementById('popbg').hidden = true;
}

document.getElementById('popbg').addEventListener('click', fermerPop);
document.getElementById('pop').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  fermerPop();
  const w = b.dataset.w;
  if (b.dataset.act === 'filtre') choisir([w]);
  else if (b.dataset.act === 'tous') choisir([]);
  else if (b.dataset.act === 'ajouter') choisir(S.sel.concat(w));
  else if (b.dataset.act === 'retirer') choisir(S.sel.filter(x => x !== w));
  else if (b.dataset.act === 'jour') {
    S.cur = b.dataset.d; S.vue = 'jour'; mem.set('vue', 'jour'); statut(); afficher();
  }
});

/* =====================================================================================
   Affichage, navigation, filtre
   ===================================================================================== */
// garderPop: redraw behind the open window (ticking people in the list) without closing it
function afficher(garderPop) {
  if (!garderPop) fermerPop();
  if (S.sel.length && !S.cycles) chargerCycles();
  const v = document.getElementById('view');
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.vue)));
  document.getElementById('libres').checked = S.libres;
  document.getElementById('conges').checked = S.conges;
  const r = document.getElementById('range');
  if (S.vue === 'mois') r.textContent = fmt(S.cur, { month: 'long', year: 'numeric' });
  else if (S.vue === 'semaine') {
    const a = debutDe(S.cur), b = addDays(a, 6);
    r.textContent = a.slice(0, 7) === b.slice(0, 7)
      ? `${+a.slice(8)} – ${+b.slice(8)} ${fmt(b, { month: 'short', year: 'numeric' })}`
      : `${fmt(a, { day: 'numeric', month: 'short' })} – ${fmt(b, { day: 'numeric', month: 'short', year: 'numeric' })}`;
  } else r.textContent = fmt(S.cur, etroit() ? { weekday: 'short', day: 'numeric', month: 'short' } : { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) +
    (S.feries[S.cur] ? ` · ${S.feries[S.cur]} (férié payé 1,5x)` : '') + (estRelache(S.cur) ? ' · relâche scolaire' : '');
  if (!S.data) return;
  const keep = v.scrollTop;
  v.innerHTML = S.vue === 'mois' ? vueMois() : S.vue === 'semaine' ? vueSemaine() : vueJour();
  if (S.vue === 'mois' && S.who) remplirMois(v);
  v.scrollTop = keep;
  if (S.vue === 'jour' && S.cur === nowLocal().d) v.scrollLeft = 0;
}

/* « Tout le monde ▾ »: a list of initials to tick. Nothing ticked = everyone. One person ticked = the
   one-person layouts (chips in Mois, times in the phone view). Ticking redraws right away. */
function choisir(liste, garderPop) {
  const gens = (S.data && S.data.gens) || [];
  S.sel = liste.filter((w, i) => liste.indexOf(w) === i && (!S.data || gens.includes(w)));
  S.who = S.sel.length === 1 ? S.sel[0] : '';
  mem.set('who', S.sel.join(','));
  remplirFiltre(); statut(); afficher(garderPop);
}

function remplirFiltre() {
  const gens = (S.data && S.data.gens) || [];
  if (S.data) { S.sel = S.sel.filter(w => gens.includes(w)); S.who = S.sel.length === 1 ? S.sel[0] : ''; }
  const n = S.sel.length;
  document.getElementById('who').innerHTML =
    (!n ? '<span class="lg-who">Tout le monde</span><span class="ct-who">Tous</span>' : n <= 3 ? esc(S.sel.join(', ')) : `${n} personnes`) + ' ▾';
}

function popFiltre() {
  const gens = (S.data && S.data.gens) || [];
  const cases = gens.map(w => `<label><input type="checkbox" data-w="${w}"${S.sel.includes(w) ? ' checked' : ''}>${w}</label>`).join('');
  return { c: 'var(--accent)', large: true,
    html: '<h3>Personnes à afficher</h3><div class="dt">Cochez une ou plusieurs personnes. Aucune case = tout le monde.</div>' +
      `<div class="choix">${cases}</div>` +
      '<div class="btns"><button data-act="tous">Tout le monde</button><button data-act="fermer">OK</button></div>' };
}

function legende() {
  let h = CONFIG.groupes.map(g => `<span><i class="dot" style="--c:${g.couleur}"></i>${g.nom} (${g.lettre})</span>`).join('');
  h += `<span><i class="dot" style="--c:${CONFIG.superviseur.couleur}"></i>${CONFIG.superviseur.nom}</span>`;
  h += `<span><i class="dot" style="--c:${CONFIG.stagiaire.couleur}"></i>${CONFIG.stagiaire.nom}</span>`;
  h += `<span><i class="dot" style="--c:${CONFIG.autre.couleur}"></i>${CONFIG.autre.nom} : texte après les initiales</span>`;
  h += '<span>$ = OT</span>';
  h += '<span>Deux couleurs = quart prolongé ou partagé entre deux activités</span>';
  h += '<span><i class="dot" style="--c:#c4c7c5"></i>Congé</span>';
  h += '<span><i class="dot" style="--c:var(--libre)"></i>Libre complet (8 h 30 en OT)</span>';
  h += '<span><i class="dot" style="--c:var(--partiel)"></i>Libre partiel</span>';
  h += '<span>Hachuré = pas encore publié</span>';
  h += '<span><i style="opacity:.72;font-style:italic">→ 07:15</i> pâli = fin d\'une nuit commencée la veille</span>';
  h += '<span><i class="dot" style="--c:var(--off)"></i>Gris = congé du cycle 5-4 de la personne choisie</span>';
  h += '<span style="color:var(--ferie);font-weight:500">Date en rouge = férié payé 1,5x</span>';
  h += '<span><i class="dot" style="--c:var(--relache)"></i>Trait mauve en haut du jour = relâche scolaire (repère)</span>';
